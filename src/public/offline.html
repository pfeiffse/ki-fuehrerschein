<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Führerschein · Offline-Modus · SLZB</title>
<style>

/* =====================================================================
   KI-Führerschein · Gestaltung der Hülle (Startseite, Übersicht,
   Modulrahmen, Zertifikat, Lehrkraft-Bereich)
   Leitidee: Lernpfad mit SLZB-Bögen (C) + Führerschein-Metapher (B)
   Farben: SLZB-Hausfarben laut slzb.de
   ===================================================================== */
:root{
  --navy:#00295f; --blue:#063b81; --sky:#3c9dd7; --ice:#baddff; --pale:#eef5fc; --paper:#f4f8fd;
  --yellow:#ffb225; --green:#3aa533; --red:#e70c14; --black:#1b1b1b;
  --ink:#17243b; --muted:#56667c; --line:#d5e0ee;
  --ok:#2b7a26; --ok-bg:#e6f5e4; --warn:#8a5a00; --warn-bg:#fff4dc; --bad:#c0262d; --bad-bg:#fdeaea;
  --font:"Fira Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --bar-h:64px;
  --r:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.5;font-size:17px}
h1,h2,h3{line-height:1.2;margin:0}
a{color:var(--blue)}
button{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.container{max-width:1040px;margin:0 auto;padding:0 20px}

/* ---------- Kopfzeile ---------- */
.topbar{position:sticky;top:0;z-index:40;height:var(--bar-h);display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.topbar .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.topbar .brand img{height:46px;width:auto;flex:0 0 auto}
.topbar .brand b{display:block;font-size:18px;font-weight:800;color:var(--navy);white-space:nowrap}
.topbar .brand small{display:block;font-size:13px;font-weight:500;color:var(--sky);white-space:nowrap}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--pale);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:15px;white-space:nowrap}
.chip .av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.stripe{height:4px;background:linear-gradient(90deg,var(--yellow) 0 25%,var(--red) 25% 50%,var(--black) 50% 75%,var(--green) 75%)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:999px;padding:11px 20px;min-height:46px;cursor:pointer;border:2px solid transparent;background:var(--yellow);color:var(--navy);text-decoration:none;white-space:nowrap}
.btn:hover{background:#f5a300}
.btn.blue{background:var(--blue);color:#fff}.btn.blue:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--blue);border-color:var(--line)}.btn.ghost:hover{border-color:var(--blue);background:var(--pale)}
.btn.onblue{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}.btn.onblue:hover{background:rgba(255,255,255,.22)}
.btn.small{min-height:36px;padding:6px 14px;font-size:15px}
.btn.danger{background:#fff;color:var(--bad);border-color:#f0b9bc}.btn.danger:hover{background:var(--bad-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}

/* ---------- Blaue Bühne mit SLZB-Bögen ---------- */
.stage{position:relative;overflow:hidden;background:var(--blue);color:#fff;padding:34px 0 46px;min-height:calc(100vh - var(--bar-h) - 4px)}
.stage .arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage>.container{position:relative}
.stage h1{font-size:clamp(28px,4.5vw,40px);font-weight:800}
.stage .lead{color:var(--ice);font-size:18px;margin:8px 0 0;max-width:640px}
.sec{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ice);margin:32px 0 14px;font-weight:700}

/* ---------- Führerschein-Karte ---------- */
.license{position:relative;overflow:hidden;color:var(--ink);background:linear-gradient(135deg,#fbe8ef 0%,#eaeefc 52%,#e6f4e7 100%);border-radius:20px;border:1px solid rgba(255,255,255,.6);box-shadow:0 14px 34px rgba(0,20,60,.3);padding:22px 24px;display:grid;grid-template-columns:118px 1fr auto;gap:22px;align-items:center;margin-top:24px}
.license::after{content:"KI";position:absolute;right:-6px;bottom:-56px;font-size:190px;font-weight:900;color:rgba(6,59,129,.05);pointer-events:none}
.license .photo{width:118px;height:138px;border-radius:12px;background:linear-gradient(160deg,#dfe8f4,#c9d7ea);border:3px solid #fff;display:grid;place-items:center;font-size:54px;font-weight:800;color:var(--blue)}
.license .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.license .kicker b{background:var(--blue);color:#fff;border-radius:5px;padding:2px 7px;letter-spacing:0}
.license h2{font-size:28px;color:var(--navy);margin:6px 0 8px}
.license dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:15px}
.license dt{color:var(--muted)}.license dd{margin:0;font-weight:700}
.classes{display:grid;grid-template-columns:repeat(2,64px);gap:8px;position:relative;z-index:1}
.cls{width:64px;height:64px;border-radius:12px;border:2px dashed #aebcd0;display:grid;place-items:center;text-align:center;font-weight:800;color:#9aa9bf;font-size:13px;line-height:1.1;background:rgba(255,255,255,.55)}
.cls .i{display:block;font-size:22px}
.cls.ok{border:2px solid var(--c);background:var(--c);color:#fff}
.cls.pop{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ---------- Lernpfad ---------- */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;max-width:780px;position:relative}
.stop{position:relative;display:grid;grid-template-columns:68px 1fr auto;gap:18px;align-items:center;background:#fff;color:var(--ink);border-radius:18px;padding:16px 20px;box-shadow:0 10px 24px rgba(0,20,60,.25)}
.stop:nth-child(even){margin-left:56px}
.sign{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;background:var(--c);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--c)}
.stop.open .sign,.stop.locked .sign{background:#fff;color:var(--c)}
.stop.locked{opacity:.78}
.stop.locked .sign{color:#9aa9bf;box-shadow:0 0 0 4px #fff,0 0 0 7px #c5d0de}
.stop .tag{font-size:13px;font-weight:700;color:var(--muted)}
.stop .tag.ok{color:var(--ok)}.stop .tag.busy{color:var(--warn)}
.stop h3{font-size:20px;margin:2px 0}
.stop p{margin:0;font-size:15px;color:var(--muted)}
.stop .earned{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:14px;border-radius:999px;padding:3px 10px}
.stamp{position:absolute;right:16px;top:-12px;transform:rotate(-9deg);border:3px solid var(--ok);color:var(--ok);background:#fff;font-weight:900;font-size:13px;letter-spacing:.12em;padding:3px 10px;border-radius:7px;text-transform:uppercase}
.stamp.busy{border-color:#c98400;color:#a86a00}
.stamp.new{animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-9deg) scale(2.4);opacity:0}100%{transform:rotate(-9deg) scale(1);opacity:1}}
.goal{display:flex;gap:16px;align-items:center;margin:22px 0 0 0;max-width:780px;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.35);border-radius:18px;padding:16px 20px}
.goal .gi{width:56px;height:56px;border-radius:50%;border:3px dashed var(--yellow);display:grid;place-items:center;font-size:26px;flex:0 0 auto}
.goal b{display:block;font-size:18px}
.goal span{color:var(--ice)}
.goal.ready{background:var(--yellow);border:0;color:var(--navy)}
.goal.ready span{color:var(--navy)}
.goal.ready .gi{border:3px solid var(--navy);background:#fff}
.goal .btn{margin-left:auto}

/* ---------- Inhaltsseiten (hell) ---------- */
.page{padding:30px 0 50px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:18px;box-shadow:0 4px 14px rgba(6,59,129,.06)}
.card h2{font-size:22px;color:var(--navy);margin-bottom:10px}
.muted{color:var(--muted)}
.note{background:var(--pale);border-left:4px solid var(--sky);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px}
.note.warn{background:var(--warn-bg);border-left-color:var(--yellow)}
.footlinks{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;font-size:15px}
.footlinks a,.footlinks button{color:var(--ice)}
.page .footlinks a,.page .footlinks button{color:var(--blue)}

/* ---------- Formulare ---------- */
label.f{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
input.f,select.f{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;color:var(--ink)}
input.f:focus,select.f:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 3px rgba(60,157,215,.25)}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:600;font-size:15px}
.okmsg{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:600;font-size:15px}

/* ---------- Startseite ---------- */
.landing{display:grid;grid-template-columns:1.15fr 1fr;gap:30px;align-items:start}
.landing .mini{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.landing .mini li{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px}
.landing .mini .sign{width:38px;height:38px;font-size:16px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.landing .login{background:#fff;color:var(--ink);border-radius:20px;padding:24px;box-shadow:0 14px 34px rgba(0,20,60,.3)}
.landing .login h2{color:var(--navy);font-size:24px}
.modebadge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--pale);color:var(--blue);margin-top:4px}

/* ---------- Modulansicht ---------- */
.modbar{position:sticky;top:0;z-index:40;height:var(--bar-h);display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--blue);color:#fff;overflow:hidden}
.modbar .arcs{position:absolute;right:0;top:0;height:100%;width:260px;pointer-events:none;opacity:.9}
.modbar .sign{width:40px;height:40px;font-size:17px;flex:0 0 auto;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.modbar .t{min-width:0;position:relative}
.modbar .t small{display:block;color:var(--ice);font-size:13px}
.modbar .t b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;position:relative;z-index:1}
.modbar img{height:40px;background:#fff;border-radius:8px;padding:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;background:rgba(255,255,255,.14);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
#modstage{position:fixed;left:0;right:0;bottom:0;top:var(--bar-h);background:#fff}
#modstage iframe{display:block;width:100%;height:100%;border:0}
#modstage[hidden],#modstage iframe[hidden]{display:none}

/* ---------- Hinweis-Leiste (Toast) ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);z-index:90;display:flex;gap:16px;align-items:center;background:var(--navy);color:#fff;border-radius:18px;padding:14px 16px 14px 20px;box-shadow:0 18px 40px rgba(0,20,60,.45);max-width:min(680px,calc(100% - 24px));transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
.toast:not(.show){visibility:hidden;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible;opacity:1}
.toast .ti{font-size:34px}
.toast b{display:block}
.toast span{color:var(--ice);font-size:15px}

/* ---------- Zertifikat ---------- */
.certwrap{display:flex;flex-direction:column;align-items:center;gap:20px}
.dl-card{width:min(680px,100%);min-height:calc(min(680px,100vw) * 54 / 85.6);position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(135deg,#fbe8ef 0%,#e9edfc 50%,#e4f4e6 100%);border:1px solid #cfcadf;box-shadow:0 18px 40px rgba(0,20,60,.3);padding:4.2% 4.6%;display:grid;grid-template-columns:27% 1fr;grid-template-rows:auto 1fr auto;gap:3% 4%;color:var(--ink)}
.dl-card .bg{position:absolute;inset:0;pointer-events:none}
.dl-card .hdr{grid-column:1/-1;display:flex;align-items:center;gap:14px;position:relative}
.dl-card .hdr img{height:clamp(36px,8vw,58px)}
.dl-card .hdr small{display:block;font-size:clamp(9px,1.6vw,12px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dl-card .hdr h2{font-size:clamp(17px,3.4vw,26px);color:var(--navy);font-weight:800}
.dl-card .hdr .eu{margin-left:auto;align-self:flex-start;background:var(--blue);color:#fff;font-weight:900;border-radius:8px;padding:4px 10px;font-size:clamp(12px,2.2vw,18px)}
.dl-card .ph{position:relative;border-radius:12px;background:linear-gradient(160deg,#dfe8f4,#c9d7ea);border:3px solid #fff;display:grid;place-items:center;font-size:clamp(30px,8vw,64px);font-weight:900;color:var(--blue)}
.dl-card dl{position:relative;display:grid;grid-template-columns:auto 1fr;gap:.35em .8em;margin:0;font-size:clamp(11px,2vw,16px);align-content:center}
.dl-card dt{color:var(--muted);font-weight:700}
.dl-card dd{margin:0;font-weight:800}
.dl-card .row{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:2%;position:relative}
.dl-card .row div{border-radius:10px;background:var(--c);color:#fff;font-weight:800;font-size:clamp(9px,1.6vw,13px);padding:.5em .4em;text-align:center;line-height:1.2}
.dl-card .row div i{font-style:normal;display:block;font-size:1.5em}
.dl-card .mksatz{grid-column:1/-1;position:relative;background:rgba(255,255,255,.7);border-left:4px solid var(--yellow);border-radius:8px;padding:.5em .8em;font-size:clamp(11px,1.9vw,15px)}
.dl-card .mksatz span{display:block;font-size:.75em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dl-card .mksatz q{font-weight:700;color:var(--navy);quotes:"„" "“"}
.dl-card .mksatz .blank{display:block;height:1.6em;border-bottom:2px dotted #8a9ab0}
textarea.f{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink)}
textarea.f:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 3px rgba(60,157,215,.25)}
.certtext{max-width:680px;text-align:center}
.locked-cert{text-align:center;max-width:560px;margin:0 auto}

/* ---------- Tabellen (Lehrkraft) ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl td.c,.tbl th.c{text-align:center}
.tblwrap{overflow-x:auto}
.classlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.classitem{text-align:left;cursor:pointer;background:var(--pale);border:2px solid transparent;border-radius:14px;padding:14px}
.classitem.on{border-color:var(--blue);background:#fff}
.classitem b{display:block;font-size:18px;color:var(--navy)}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:.12em;font-size:26px;color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ---------- Responsiv ---------- */
@media (max-width:860px){
  .landing{grid-template-columns:1fr}
  .license{grid-template-columns:90px 1fr}
  .license .photo{width:90px;height:108px;font-size:40px}
  .license .classes{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}
  .cls{width:auto}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:640px){
  :root{--bar-h:58px}
  .topbar .brand small,.modbar .pill.hide-s{display:none}
  .topbar .brand img{height:38px}
  .chip .nm{display:none}
  .stop{grid-template-columns:48px 1fr;padding:14px}
  .stop .sign{width:46px;height:46px;font-size:18px}
  .stop .btn{grid-column:1/-1}
  .stop:nth-child(even){margin-left:0}
  .modbar img,.modbar .arcs{display:none}
  .goal{flex-wrap:wrap}.goal .btn{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Druck (Zertifikat) ---------- */
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff}
  .topbar,.stripe,.noprint,.toast,#modstage,.modbar{display:none!important}
  .page{padding:0}
  .certwrap{gap:6mm}
  .dl-card{width:170mm;min-height:107mm;box-shadow:none;border:1px solid #999;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dl-card *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- Belohnung: Stempel auf den Führerschein + Konfetti ---------- */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:300}
.cel{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,20,50,.78);backdrop-filter:blur(3px);animation:celFade .25s ease}
@keyframes celFade{from{opacity:0}to{opacity:1}}
.cel .panel{background:#fff;color:var(--ink);border-radius:26px;max-width:480px;width:100%;padding:28px 26px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.cel .kick{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.cel h2{font-size:26px;margin:4px 0 4px;color:var(--navy)}
.cel p{margin:0 0 18px;color:var(--muted)}
.cel .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cel .lic{position:relative;margin:10px auto 18px;width:100%;max-width:400px;border-radius:18px;background:linear-gradient(135deg,#fbe8ef,#e9edfc 50%,#e4f4e6);border:1px solid #cfcadf;padding:14px 16px;text-align:left;display:grid;grid-template-columns:70px 1fr;gap:10px 14px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.cel .lic .ph{height:84px;border-radius:10px;background:linear-gradient(160deg,#dfe8f4,#c9d7ea);border:3px solid #fff;display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--blue)}
.cel .lic small{display:block;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.cel .lic b{display:block;font-size:20px;color:var(--navy)}
.cel .lic .k{color:var(--muted);font-size:14px}
.cel .lic .fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cel .lic .f{height:48px;border-radius:9px;border:2px dashed #aebcd0;display:grid;place-items:center;text-align:center;font-weight:800;color:#9aa9bf;font-size:12px;line-height:1.1;background:rgba(255,255,255,.5)}
.cel .lic .f i{font-style:normal;display:block;font-size:18px}
.cel .lic .f.ok{border:2px solid var(--fc);background:var(--fc);color:#fff}
.cel .lic .f.fill{animation:celFill .5s 1.05s both}
@keyframes celFill{0%{background:rgba(255,255,255,.5);color:#9aa9bf;border:2px dashed #aebcd0;transform:scale(1)}50%{transform:scale(1.25)}100%{background:var(--fc);color:#fff;border:2px solid var(--fc);transform:scale(1)}}
.cel .bigstamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-12deg);border:6px solid var(--ok);color:var(--ok);background:rgba(255,255,255,.88);font-size:clamp(24px,7vw,34px);font-weight:900;letter-spacing:.14em;padding:4px 18px;border-radius:12px;text-transform:uppercase;white-space:nowrap;animation:celSlam .55s .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes celSlam{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3.2);opacity:0}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.cel .shake{animation:celShake .35s .95s}
@keyframes celShake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,2px)}}

/* ---------- Punkte ---------- */
.pts{display:inline-flex;align-items:center;gap:8px;background:#fff8e6;border:2px solid #ffd27a;border-radius:999px;padding:4px 12px 4px 8px;font-size:14px;color:var(--navy);white-space:nowrap}
.pts .star{font-size:18px}
.pts b{font-size:16px;font-variant-numeric:tabular-nums}
.pts .pbar{width:70px;height:7px;border-radius:99px;background:#f1e2bd;overflow:hidden}
.pts .pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb225,#f59000);border-radius:99px}
.pts.bump{animation:ptsBump .5s ease}
@keyframes ptsBump{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.modbar .pts{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.modbar .pts .pbar{background:rgba(255,255,255,.25)}
.stop .ptsnote{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:#a86a00}
.cel .ptsgain{display:inline-block;margin:0 0 10px;background:#fff8e6;border:2px solid #ffd27a;color:#8a5200;font-weight:900;font-size:20px;border-radius:999px;padding:4px 16px;animation:ptsGain .6s 1.15s cubic-bezier(.2,1.6,.4,1) both}
@keyframes ptsGain{0%{transform:scale(0) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}

/* ---------- Lernweg Klasse 7–10 ---------- */
.grades{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1000px;position:relative}
.grade{display:flex;gap:12px;align-items:flex-start;background:#0f4a8f;border:1.5px dashed rgba(255,255,255,.28);border-radius:16px;padding:14px;color:rgba(255,255,255,.62)}
.grade .gi{font-size:26px;filter:grayscale(1);opacity:.6}
.grade .gk{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.grade b{display:block;font-size:17px;color:rgba(255,255,255,.75)}
.grade .gu{display:block;font-size:13px;line-height:1.35;margin:2px 0 6px}
.grade .gs{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.1)}
.grade.now{background:#fff;border:0;color:var(--ink);box-shadow:0 10px 24px rgba(0,20,60,.25)}
.grade.now .gi{filter:none;opacity:1}
.grade.now b{color:var(--navy)}
.grade.now .gk{color:var(--sky)}
.grade.now .gu{color:var(--muted)}
.grade .gs.now{background:var(--yellow);color:var(--navy)}
.grade .gs.ok{background:var(--ok-bg);color:var(--ok)}
@media (max-width:860px){.grades{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grades{grid-template-columns:1fr}.topbar .pts .pbar{display:none}.topbar .pts{padding:4px 10px 4px 6px}.modbar .pts{display:none}}
@media (max-width:420px){.topbar .pts .pn{display:none}}


.offline-hint{position:fixed;bottom:12px;right:12px;background:#1b1b1b;color:#ffb225;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style>
</head>

rgin:20px 0}.choices{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.choice{flex:1 1 155px}.feedback{border-left:6px solid var(--blue);background:#eef3ff;padding:15px 18px;border-radius:12px;margin-top:20px;font-weight:650}.feedback.good{border-color:var(--good);background:#e8f7ee}.big{font-size:clamp(26px,4vw,42px);font-weight:850}.sub{color:#53627a;font-size:16px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.picture{border:2px solid #cbd6ec;border-radius:16px;background:white;padding:15px 7px;text-align:center;position:relative}.emoji{font-size:clamp(43px,7vw,72px);line-height:1.5}.star{position:absolute;top:4px;right:9px;color:#b35b00;font-size:27px;filter:drop-shadow(0 1px 1px white)}.tag{font-size:15px;font-weight:800}.prob{display:grid;grid-template-columns:105px 1fr 50px;align-items:center;gap:9px;margin:12px 0}.bar{background:#dbe4f5;border-radius:20px;height:23px;overflow:hidden}.bar span{display:block;background:#5880eb;height:100%;transition:width .25s}.mini-note{font-size:14px;color:#52617b}.hidden{display:none!important}.number{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#dce8ff;color:#234cbb;font-weight:900;margin-right:8px}.context-btn.active{background:var(--blue);color:white}.sentence{background:white;border-radius:15px;padding:18px;font-size:clamp(22px,3vw,31px);font-weight:800;min-height:78px;overflow-wrap:anywhere}.word{display:inline-block;background:#dbe6ff;border:2px solid #a9c2ff;border-radius:9px;padding:3px 9px;margin:3px}.final-list{font-size:22px;line-height:1.9}footer{font-size:13px;color:#52617b;margin-top:22px}@media(max-width:520px){.cards{gap:6px}.picture{padding:8px 3px}.tag{font-size:13px}.prob{grid-template-columns:85px 1fr 45px}.wrap{padding:12px 10px 35px}.card{padding:17px}}\n.train-top{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}.train-meter{height:19px;background:#dbe4f5;border-radius:30px;overflow:hidden;flex:1 1 200px}.train-meter>div{height:100%;background:#5880eb;transition:width .3s}.horse-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:20px}.train-tile{background:white;border:1px solid #b7c7ea;border-radius:12px;min-width:0;text-align:center;padding:8px 2px}.train-tile span{display:block;font-size:clamp(24px,4vw,42px)}.train-tile small{display:block;font-size:12px;color:#16734a;font-weight:700}.empty-train{padding:25px 10px;color:#53627a}.test-animal{font-size:84px;text-align:center;background:white;border:2px solid #cbd6ec;border-radius:16px;max-width:220px;margin:auto}@media(max-width:520px){.horse-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}\n\n.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.photo-card{min-width:0;background:#fff;border:2px solid #cbd6ec;border-radius:15px;overflow:hidden;text-align:center}.photo-card img{display:block;width:100%;height:155px;object-fit:cover;background:#e3e9f3}.photo-card .caption{padding:9px;font-size:15px;font-weight:750}.photo-card button{border:0;border-top:2px solid #cbd6ec;border-radius:0;width:100%;font-size:15px;padding:11px 5px}.photo-card button:focus-visible{outline:3px solid #2859d8;outline-offset:-3px}.photo-card.selected{border-color:#2859d8;background:#e7eeff;box-shadow:inset 0 0 0 2px #2859d8}.photo-card .fallback{height:155px;display:none;align-items:center;justify-content:center;font-size:65px;background:#eaf0fa}.small-divider{border:0;border-top:2px solid #d6e0f2;margin:30px 0}.photo-note{font-size:14px;color:#53627a}.train-chip{display:inline-block;background:#dce8ff;border-radius:15px;padding:7px 12px;font-size:15px;font-weight:750}.stage-label{font-size:16px;font-weight:850;color:#2859d8}.photo-card button:disabled{opacity:.75}@media(max-width:580px){.photo-grid{gap:7px}.photo-card img,.photo-card .fallback{height:112px}.photo-card .caption{font-size:13px;padding:7px 3px}.photo-card button{font-size:13px;min-height:54px}}\n.wm-discovery{max-width:560px;margin:18px auto}.wm-pin-tray{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0}.wm-pin{touch-action:none;user-select:none;cursor:grab;border-radius:50%;font-size:27px;width:64px;height:64px;padding:0;background:#fff7e6;border-color:#b46b1d;z-index:10}.wm-pin.dragging{cursor:grabbing;opacity:.85;position:relative}.wm-drop-photo{cursor:crosshair;touch-action:pan-y}.wm-drop-photo .wm-stamp{pointer-events:none}.wm-search-feedback{font-weight:700;color:#234cbb;min-height:25px;margin:8px 0}.wm-discovery .wm-photo img{height:315px;object-fit:cover}.wm-discovery .wm-photo img{height:315px;object-fit:cover}.wm-hotspot{position:absolute;right:8%;bottom:29px;width:66px;height:66px;border:2px dashed rgba(255,255,255,.85);border-radius:50%;background:rgba(15,35,65,.12);color:white;cursor:pointer;font-size:14px;z-index:3}.wm-hotspot:focus-visible{outline:4px solid #2859d8}.wm-discovery-note{padding:14px;background:#e7eeff;border-radius:12px;margin:12px 0}.wm-photo{position:relative;background:#e8eef6;border:2px solid #cbd6ec;border-radius:14px;overflow:hidden;min-width:0}.wm-photo img{display:block;width:100%;height:165px;object-fit:cover}.wm-photo .wm-fallback{display:none;height:165px;align-items:center;justify-content:center;text-align:center;padding:12px;color:#46536b}.wm-stamp{position:absolute;right:10px;bottom:40px;padding:2px 5px;background:rgba(255,255,255,.38);color:rgba(30,42,54,.65);border:1px solid rgba(30,42,54,.25);border-radius:3px;font-size:clamp(11px,1.8vw,15px);font-weight:600;transform:none;pointer-events:none}.wm-caption{background:white;text-align:center;padding:7px;font-size:15px;font-weight:800}.wm-test-single{max-width:340px;margin:16px auto}.wm-test-single .wm-photo img,.wm-test-single .wm-fallback{height:215px}@media(max-width:580px){.wm-photo img,.wm-photo .wm-fallback{height:120px}.wm-test-single .wm-photo img,.wm-test-single .wm-fallback{height:195px}}\n\n/* Station 1: Trainingsmengen anschaulich machen */\n.data-flow{margin:18px 0;padding:15px;background:#eef3ff;border:2px solid #cbd6ec;border-radius:17px}\n.data-flow-heading{font-weight:800;margin-bottom:9px}\n.data-flow-track{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center}\n.data-flow-tiles{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;min-height:130px;align-content:center}\n.data-flow-tiles .mini-photo{aspect-ratio:1;border:1px solid #bcc9df;border-radius:3px;display:grid;place-items:center;font-size:clamp(9px,1.7vw,16px);background:#fff;opacity:.22;transform:scale(.85);transition:opacity .16s,transform .16s,background .16s}\n.data-flow-tiles .mini-photo.seen{opacity:1;transform:scale(1);background:#d7e6ff}\n.data-flow-tiles .mini-photo.flash{background:#b9e9ce}\n.data-flow-computer{font-size:40px;text-align:center;line-height:1.15}\n.data-flow-computer small{display:block;font-size:12px;font-weight:800}\n.data-flow-count{font-weight:900;font-size:clamp(25px,5vw,36px);color:#2048a7;font-variant-numeric:tabular-nums}\n.data-flow-caption{font-size:14px;margin-top:8px;color:#344562}\n.data-flow.busy .data-flow-computer{animation:computer-pulse .5s ease-in-out infinite alternate}\n@keyframes computer-pulse{from{transform:scale(1)}to{transform:scale(1.09)}}\n@media(prefers-reduced-motion:reduce){.data-flow.busy .data-flow-computer{animation:none}.data-flow-tiles .mini-photo{transition:none}}\n\n/* Station 2: eigenständige Abschlussfrage und Merksatz-Seite */\n.wm-quiz-option{display:block;width:100%;margin:10px 0;padding:17px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;font-weight:650;cursor:pointer}\n.wm-quiz-option.selected{border-color:var(--blue);background:var(--light)}\n.wm-quiz-option:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\n.wm-takeaway-page{padding:24px 8px;text-align:center}\n.wm-big-takeaway{font-size:clamp(27px,5vw,47px);line-height:1.25;font-weight:900;margin:25px auto;max-width:760px}\n.wm-takeaway-page .scene{max-width:720px;margin:22px auto}\n/* Station 2: Übersicht nach den vier Bildtests */\n.wm-review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:18px 0}\n.wm-review-item{min-width:0;background:#fff;border:2px solid #cbd6ec;border-radius:15px;padding:10px}\n.wm-review-number{font-weight:800;margin-bottom:8px}\n.wm-review-item .wm-photo img{height:160px;object-fit:cover}\n.wm-review-answer{font-size:16px;padding:10px;margin-top:8px;border-radius:10px;line-height:1.5}\n.wm-review-answer.correct{background:#ddf4e7;color:#145c39}\n.wm-review-answer.wrong{background:#ffe4df;color:#8c2920}\n.wm-review-takeaway{font-weight:750}\n@media(max-width:520px){.wm-review-grid{grid-template-columns:1fr}}\n\n/* STATION-4-MODUL: Alle Styles sind auf #ki-satzwerkstatt begrenzt. */\n#ki-satzwerkstatt{--ink:#1d2d43;--blue:#2563eb;--soft:#eef5ff;--line:#cdddf2;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);max-width:950px;margin:0 auto;padding:clamp(16px,4vw,38px);line-height:1.5}#ki-satzwerkstatt *{box-sizing:border-box}#ki-satzwerkstatt .sw-eyebrow{font-weight:800;color:#1d5cb6;letter-spacing:.04em}#ki-satzwerkstatt h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.12;margin:.35em 0}#ki-satzwerkstatt .sw-lead{font-size:1.16rem;max-width:760px}#ki-satzwerkstatt .sw-card{border:2px solid var(--line);background:#fff;border-radius:22px;padding:clamp(18px,3vw,30px);margin-top:20px;box-shadow:0 10px 28px #17365b0d}#ki-satzwerkstatt .sw-counter{font-weight:800;color:#315f9d}#ki-satzwerkstatt .sw-sentence{background:var(--soft);border-radius:18px;padding:20px;min-height:96px;font-size:clamp(1.4rem,3vw,2.15rem);font-weight:800;display:flex;flex-wrap:wrap;gap:8px;align-items:center}#ki-satzwerkstatt .sw-word{display:inline-block;background:white;border:1px solid #bad1f4;border-radius:10px;padding:2px 9px}#ki-satzwerkstatt .sw-cursor{color:var(--blue);animation:swblink 1s steps(2) infinite}@keyframes swblink{50%{opacity:0}}#ki-satzwerkstatt .sw-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}#ki-satzwerkstatt button{font:inherit;cursor:pointer}#ki-satzwerkstatt .sw-option{border:2px solid #9fc0ec;background:#fff;color:var(--ink);border-radius:15px;min-height:64px;padding:12px;font-size:1.1rem;font-weight:750;text-align:left;transition:background .15s,border-color .15s,opacity .15s}#ki-satzwerkstatt .sw-option:not(:disabled):hover,#ki-satzwerkstatt .sw-option:not(:disabled):focus-visible{background:#e8f2ff;border-color:var(--blue)}#ki-satzwerkstatt .sw-option:disabled{color:#929ba7;background:#edf0f4;border-color:#e1e5ea;opacity:.65;text-decoration:line-through;cursor:not-allowed}#ki-satzwerkstatt .sw-option:disabled::after{content:' · passt grammatikalisch nicht';font-size:.75rem;display:block;text-decoration:none;font-weight:500}#ki-satzwerkstatt .sw-note{background:#fff7e6;border-left:5px solid #f4b542;padding:12px 16px;border-radius:10px;margin-top:18px}#ki-satzwerkstatt .sw-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}#ki-satzwerkstatt .sw-action{background:var(--blue);color:white;border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:1rem;min-height:48px}#ki-satzwerkstatt .sw-action.sw-secondary{background:#e6effd;color:#1c4c8b}#ki-satzwerkstatt .sw-done{background:#e9f8ee;border:2px solid #80cda0;padding:16px;border-radius:14px;font-size:1.12rem}#ki-satzwerkstatt .sw-foot{font-size:.93rem;color:#536276;margin-top:20px}#ki-satzwerkstatt .sw-explain{font-size:1rem;margin-top:8px}#ki-satzwerkstatt .sw-step{margin-top:20px;font-size:1.16rem;font-weight:800}#ki-satzwerkstatt .sw-hint{color:#4c5b6f;margin:5px 0 0}@media(prefers-reduced-motion:reduce){#ki-satzwerkstatt .sw-cursor{animation:none}}\n\n\u003c/style>\n\u003cscript data-kifs=\"bridge\">/* =====================================================================\n   KI-Führerschein · Modul-Brücke\n   Wird beim Bauen in den \u003chead> jedes Originalmoduls eingefügt.\n   Sie verändert KEINEN Inhalt und KEINE Logik der Module, sondern nur:\n     1. Optik: Schrift Fira Sans + Umfärbung aller Blau-/Türkistöne auf\n        SLZB-Blau (Hell bleibt hell, Dunkel bleibt dunkel; Rot/Grün für\n        richtig/falsch bleiben unverändert).\n     2. Meldung an das Gesamtpaket, wenn das Modul nach SEINER EIGENEN\n        Logik abgeschlossen ist (z. B. Text „Geschafft!“ in Modul 1).\n   MODE: 'm1' | 'm2' | 'm3' | 'm4' | 'm4s' (Unterseite/Station in Modul 4)\n   SKIN: { mode: 'zusätzliches CSS' } aus src/skin/*.css\n   ===================================================================== */\n(function kifsBridge(MODE, SKIN){\n  'use strict';\n  var doc = document;\n\n  /* ---------- 1. Schrift ---------- */\n  var fontCss = 'html body,body button,body input,body textarea,body select{font-family:\"Fira Sans\",system-ui,-apple-system,\"Segoe UI\",Arial,sans-serif!important}';\n  try {\n    var link = doc.createElement('link');\n    link.rel = 'stylesheet';\n    link.href = 'https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap';\n    doc.head.appendChild(link);\n    var st = doc.createElement('style');\n    st.setAttribute('data-kifs', 'skin');\n    st.textContent = fontCss + (SKIN[MODE] || '');\n    doc.head.appendChild(st);\n  } catch (e) {}\n\n  /* ---------- 2. Farb-Umfärbung ---------- */\n  var SLZB_HUE = 214;   // Farbton von SLZB-Blau #063b81\n  var YELLOW_HUE = 39;  // Farbton von SLZB-Gelb #ffb225\n  var cache = {}, outputs = {};\n  function parseHex(h) {\n    h = h.slice(1);\n    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];\n    return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];\n  }\n  function toHsl(r,g,b){\n    var mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, h=0, s=0, d=mx-mn;\n    if (d) { s = l>.5 ? d/(2-mx-mn) : d/(mx+mn);\n      h = mx===r ? (g-b)/d+(g\u003cb?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; }\n    return [h,s,l];\n  }\n  function toHex(h,s,l){\n    function f(n){ var k=(n+h/30)%12, a=s*Math.min(l,1-l);\n      var v=l-a*Math.max(-1,Math.min(k-3,9-k,1)); return ('0'+Math.round(v*255).toString(16)).slice(-2); }\n    return '#'+f(0)+f(8)+f(4);\n  }\n  function mapColor(hex){\n    var key = hex.toLowerCase();\n    if (outputs[key]) return hex;\n    if (cache[key]) return cache[key];\n    var rgb = parseHex(key), hsl = toHsl(rgb[0],rgb[1],rgb[2]), out = key;\n    if (hsl[1] >= 0.2 && hsl[0] >= 165 && hsl[0] \u003c= 250) out = toHex(SLZB_HUE, Math.min(1, hsl[1]*1.05), hsl[2]);\n    else if (hsl[1] >= 0.5 && hsl[0] >= 36 && hsl[0] \u003c= 56 && hsl[2] >= 0.45 && hsl[2] \u003c= 0.8) out = toHex(YELLOW_HUE, 1, hsl[2]);\n    cache[key] = out; outputs[out] = 1;\n    return out;\n  }\n  var HEX = /#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})(?![0-9a-zA-Z_-])/g;\n  function remapDecl(t){ return t.replace(HEX, mapColor); }\n  // nur innerhalb von Deklarationsblöcken { … } umfärben – Selektoren (#id) bleiben unangetastet\n  function remapCss(t){ return t.replace(/\\{([^{}]*)\\}/g, function(m, body){ return '{' + remapDecl(body) + '}'; }); }\n  function fixStyleEl(el){\n    if (el.getAttribute && el.getAttribute('data-kifs')) return;\n    var t = el.textContent, n = remapCss(t);\n    if (n !== t) el.textContent = n;\n  }\n  function fixInline(el){\n    var t = el.getAttribute('style'); if (!t) return;\n    var n = remapDecl(t); if (n !== t) el.setAttribute('style', n);\n  }\n  function fixTree(root){\n    if (root.nodeType !== 1) return;\n    if (root.tagName === 'STYLE') { fixStyleEl(root); return; }\n    if (root.hasAttribute('style')) fixInline(root);\n    var a = root.querySelectorAll('style,[style]');\n    for (var i=0;i\u003ca.length;i++) a[i].tagName==='STYLE' ? fixStyleEl(a[i]) : fixInline(a[i]);\n  }\n  fixTree(doc.documentElement);\n  try {\n    new MutationObserver(function(list){\n      for (var i=0;i\u003clist.length;i++){\n        var m=list[i];\n        if (m.type==='attributes') fixInline(m.target);\n        else for (var j=0;j\u003cm.addedNodes.length;j++) fixTree(m.addedNodes[j]);\n      }\n    }).observe(doc.documentElement, {subtree:true, childList:true, attributes:true, attributeFilter:['style']});\n  } catch (e) {}\n\n  if (MODE === 'm4s') return; // Stationen in Modul 4: nur Optik\n\n  /* ---------- 3. Meldungen an das Gesamtpaket ---------- */\n  function post(type, extra){\n    try { parent.postMessage(Object.assign({kifs:true, type:type, module:MODE}, extra||{}), '*'); } catch(e){}\n  }\n  function txt(id){ var el=doc.getElementById(id); return el ? el.textContent.trim() : ''; }\n  var CHECK = {\n    // Modul 1: Abschlussseite zeigt im Zähler „Geschafft!“\n    m1: function(){ return txt('counter') === 'Geschafft!'; },\n    // Modul 2: alle 9 Kapitel nach der moduleigenen Freischaltlogik erledigt\n    m2: function(){ return txt('chapterProgress') === '9 von 9 Kapiteln geschafft'; },\n    // Modul 3: Button „Modul abschließen“ wurde gedrückt\n    m3: function(){ return doc.body && doc.body.getAttribute('data-module-complete') === 'true'; },\n    // Modul 4: Abschluss-Achievement der Station 5 („Modul erfolgreich abgeschlossen!“)\n    m4: function(){ return txt('achievementEyebrow') === 'Modul erfolgreich abgeschlossen!'; }\n  };\n  var SCORE = { m2: function(){ return Number(txt('points')) || 0; } };\n  var reported = false;\n  function tick(){\n    if (reported || !CHECK[MODE]) return;\n    var ok = false; try { ok = CHECK[MODE](); } catch(e){}\n    if (ok) { reported = true; post('complete', {score: SCORE[MODE] ? SCORE[MODE]() : 100}); }\n  }\n  doc.addEventListener('DOMContentLoaded', function(){\n    post('loaded');\n    // Modul 4: die Stationen (eigene Unterseiten) ebenfalls mit der Optik versehen\n    if (MODE === 'm4') {\n      try {\n        /* global pages */\n        var inject = '\u003cscript>(' + kifsBridge.toString().replace(/\u003c\\/script/gi,'\u003c\\\\/script') + ')(\"m4s\",' + JSON.stringify(SKIN) + ')\u003c\\/script>\u003c/head>';\n        if (typeof pages === 'object') Object.keys(pages).forEach(function(k){\n          if (pages[k].indexOf('kifsBridge') \u003c 0) pages[k] = pages[k].replace('\u003c/head>', inject);\n        });\n      } catch (e) {}\n    }\n    // Modul 4: Fortschritt (Station 1 freigeschaltet, Achievements, aktuelle Station) sichern und\n    // nach dem Neuladen wiederherstellen. Die Stationen selbst beginnen – wie beim Stationswechsel\n    // im Original – jeweils von vorn.\n    if (MODE === 'm4') {\n      try {\n        /* global station1Complete, completed, awarded, updateLocks, updateAchievements, show */\n        var K4 = 'kifs_m4_state', r4 = JSON.parse(localStorage.getItem(K4) || 'null');\n        if (r4 && r4.v === 1) {\n          if (r4.s1) station1Complete = true;\n          (r4.completed || []).forEach(function(x){ completed.add(x); });\n          (r4.awarded || []).forEach(function(x){ awarded.add(x); });\n          updateLocks(); updateAchievements();\n          if (r4.station && r4.station !== 'home') show(r4.station);\n        }\n        var save4 = function(){\n          var m = location.hash.match(/^#station([12345])$/);\n          try { localStorage.setItem(K4, JSON.stringify({ v:1, s1:!!station1Complete, completed:Array.from(completed), awarded:Array.from(awarded), station: m ? m[1] : 'home' })); } catch(e){}\n        };\n        setInterval(save4, 1000); window.addEventListener('pagehide', save4);\n      } catch (e) {}\n    }\n    tick();\n    setInterval(tick, 700);\n  });\n})\n/* Aufruf (MODE, SKIN) wird beim Bauen angehängt */\n(\"m1\", {\"m1\": \"/* Modul 1 \\u00b7 Was ist KI? \\u2013 nur Optik */\\n.progress>div{background:linear-gradient(90deg,#063b81,#3c9dd7)!important}\\nheader .logo{color:#00295f}\\n\", \"m2\": \"/* Modul 2 \\u00b7 KI sinnvoll nutzen \\u2013 nur Optik: SLZB-B\\u00f6gen im Kopfbereich */\\n.hero{position:relative;over er aus Beispielen und muss nicht jedes mögliche Pferdefoto einzeln kennen.'],\n  ['Wenn die KI ein weißes Pferd nicht erkennt, braucht sie nur noch mehr braune Pferdefotos.','Noch mehr ähnliche Fotos helfen nicht unbedingt. Hier braucht die Mini-KI vielfältigere Beispiele.']\n ];\n if(s1Conclusion===1){main.innerHTML=`\u003cdiv class=\"eyebrow\">Station 1 · Abschlussfrage\u003c/div>\u003ch2>Was hat die Mini-KI gelernt? 🐴\u003c/h2>\u003cp class=\"lead\">Du hast zweimal trainiert und getestet. \u003cstrong>Was ist dabei wichtig?\u003c/strong>\u003c/p>\u003cdiv class=\"scene\">\u003cp>\u003cstrong>Wähle eine Antwort:\u003c/strong>\u003c/p>${s1Order.map((answerId,i)=>`\u003cbutton type=\"button\" class=\"wm-quiz-option ${s1QuizChoice===String(answerId)?'selected':''}\" data-action=\"s1-quiz:${answerId}\" aria-pressed=\"${s1QuizChoice===String(answerId)}\">${String.fromCharCode(65+i)} · ${answers[answerId][0]}\u003c/button>`).join('')}\u003cdiv class=\"actions\">${btn('✓ Antwort prüfen','s1-quiz-check','primary')}\u003c/div>${s1QuizFeedback?`\u003cdiv class=\"feedback ${s1QuizChoice==='1'?'good':''}\" role=\"status\">${s1QuizFeedback}\u003c/div>`:''}${s1QuizChoice==='1'&&s1QuizFeedback.startsWith('✅')?`\u003cdiv class=\"actions\">${btn('Zum Merksatz →','s1-show-takeaway','primary')}\u003c/div>`:''}\u003c/div>\u003cdiv class=\"actions\">${btn('← Bilder noch einmal ansehen','s1-review-back')}\u003c/div>`;return}\n if(s1Conclusion===2){main.innerHTML=`\u003cdiv class=\"wm-takeaway-page\">\u003cdiv class=\"eyebrow\">Station 1 · Das hast du herausgefunden\u003c/div>\u003ch1>💡 Merksatz\u003c/h1>\u003cdiv class=\"wm-big-takeaway\">KI lernt Muster aus Beispielen.\u003cbr>Wichtig sind \u003cspan style=\"color:var(--blue)\">viele und vielfältige Trainingsbilder.\u003c/span>\u003c/div>\u003cdiv class=\"scene\">\u003cp>Eine Million ähnliche Pferdebilder zeigen der Mini-KI nicht unbedingt alle Arten von Pferden. Unterschiedliche Beispiele helfen ihr, mehr Pferdearten zu erkennen.\u00
