ackground:#d6ad4b;border:4px solid #94752d;border-radius:50%;width:34px;height:34px;margin:auto;box-shadow:0 3px 5px #0003}.chain.pull{animation:pull .45s ease-in-out}@keyframes pull{50%{transform:translateY(30px)}}.splash{position:absolute;bottom:105px;font-size:3.3rem;opacity:0;pointer-events:none}.splash.active{animation:splash .65s ease-out}@keyframes splash{20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.7)}}.big{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;color:#087f87}.water{height:185px;border:5px solid #a4c4d0;border-radius:16px 16px 23px 23px;position:relative;overflow:hidden;background:#f5fafc;max-width:210px;margin:15px auto}.water .fill{position:absolute;bottom:0;width:100%;height:0%;background:linear-gradient(#64d4e8,#2096c6);transition:height .4s}.water .txt{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:1.6rem;text-shadow:0 1px white}.compare{display:grid;grid-template-columns:1fr 1fr;gap:13px}.comparison{background:#eaf6f5;border-radius:16px;padding:17px}.comparison h3{margin:0 0 7px}.comparison strong{font-size:1.5rem;color:#087c83}.small{font-size:.88rem}.footer{margin:23px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#076b78}a.btn{text-decoration:none;display:inline-block}button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid #ffbd59;outline-offset:3px}@media(max-width:650px){.controls,.toiletArea,.compare{grid-template-columns:1fr}.panel{padding:19px}.person{font-size:1.25rem}.toiletScene{min-height:340px}.chain{left:65%}}\\n\u003c\\/style>\u003c\\/head>\u003cbody>\u003cmain>\u003cheader class=\\\"hero\\\">\u003cdiv class=\\\"tag\\\">KI & Nachhaltigkeit · Station 3\u003c\\/div>\u003ch1>💧 KI, Wasser und die Toilettenspülung\u003c\\/h1>\u003cp>Wie aus wenigen KI-Fragen ganz schnell Tausende werden – und was das mit Wasser zu tun hat.\u003c\\/p>\u003cdiv class=\\\"progress\\\" aria-label=\\\"Fortschritt\\\">\u003cspan id=\\\"progress\\\">\u003c\\/span>\u003c\\/div>\u003c\\/header>\\n\u003csection class=\\\"panel\\\" id=\\\"classPanel\\\">\u003ch2>👩‍🎓 Experiment 1: Deine Klasse nutzt KI\u003c\\/h2>\u003cp>Stell dir vor, jeder Schüler stellt \u003cb>10 KI-Textanfragen pro Tag\u003c\\/b>. Wie schnell erreicht eure Klasse 1.000 Anfragen? Probiere es aus!\u003c\\/p>\u003cp class=\\\"muted small\\\">\u003cb>Klicke jede Person einzeln an\u003c\\/b>, um sie zur KI-Gruppe hinzuzufügen. Ein erneuter Klick entfernt sie wieder.\u003c\\/p>\u003cdiv class=\\\"people\\\" id=\\\"people\\\" aria-label=\\\"30 einzeln anklickbare Schülerinnen und Schüler\\\">\u003c\\/div>\u003cdiv class=\\\"controls\\\">\u003cdiv>\u003clabel>Wie viele Schüler machen mit? \u003cstrong id=\\\"studentLabel\\\">0\u003c\\/strong> von 30\u003c\\/label>\u003cdiv class=\\\"buttons\\\">\u003cbutton class=\\\"btn secondary\\\" type=\\\"button\\\" onclick=\\\"selectAll()\\\">Alle 30 auswählen\u003c\\/button>\u003cbutton class=\\\"btn secondary\\\" type=\\\"button\\\" onclick=\\\"clearStudents()\\\">Auswahl löschen\u003c\\/button>\u003c\\/div>\u003c\\/div>\u003cdiv>\u003clabel>Wie viele Tage in einer Woche wird KI genutzt? \u003cstrong id=\\\"dayLabel\\\">1\u003c\\/strong>\u003c\\/label>\u003cdiv class=\\\"buttons\\\" id=\\\"dayButtons\\\" role=\\\"group\\\" aria-label=\\\"Tage pro Woche wählen\\\">\u003c\\/div>\u003c\\/div>\u003c\\/div>\u003cdiv class=\\\"row\\\">\u003cdiv class=\\\"stat\\\">\u003cspan>KI-Anfragen insgesamt\u003c\\/span>\u003cstrong id=\\\"queryCount\\\">10\u003c\\/strong>\u003c\\/div>\u003cdiv class=\\\"stat\\\">\u003cspan>Bis zu 1.000 fehlen noch\u003c\\/span>\u003cstrong id=\\\"remaining\\\">990\u003c\\/strong>\u003c\\/div>\u003c\\/div>\u003cp>\u003cb>Fortschritt bis 1.000 Anfragen\u003c\\/b>\u003c\\/p>\u003cdiv class=\\\"meter\\\">\u003cspan id=\\\"meter\\\">\u003c\\/span>\u003c\\/div>\u003cdiv id=\\\"reached\\\" class=\\\"notice hidden\\\">🎉 \u003cb>Geschafft!\u003c\\/b> Ihr habt mindestens 1.000 Anfragen erreicht! Das geht sogar innerhalb einer einzigen Woche. Schaut auf euren Zähler!\u003c\\/div>\u003cdiv class=\\\"footer\\\">\u003cspan class=\\\"muted small\\\">Beispielklasse: 30 Personen · jede stellt 10 Anfragen pro Nutzungstag.\u003c\\/span>\u003cbutton id=\\\"next\\\" class=\\\"btn\\\" disabled onclick=\\\"startToilet()\\\">Weiter zum Toiletten-Experiment →\u003c\\/button>\u003c\\/div>\u003c\\/section>\\n\u003csection class=\\\"panel hidden\\\" id=\\\"toiletPanel\\\">\u003ch2>🚽 Experiment 2: Zieh an der Spülkette!\u003c\\/h2>\u003cp>Jetzt vergleichen wir \u003cb>1.000 KI-Textanfragen\u003c\\/b> mit dem Wasserverbrauch einer Toilette. Ein Spülgang verbraucht in unserem Beispiel \u003cb>4,5 Liter Wasser\u003c\\/b>.\u003c\\/p>\u003cp>\u003cb>Deine Aufgabe:\u003c\\/b> Wie oft könnte man die Toilette spülen, um ungefähr so viel Wasser zu verbrauchen wie bei 1.000 KI-Textanfragen? \u003cb>Zieh so oft an der Kette, wie du vermutest!\u003c\\/b>\u003c\\/p>\u003cdiv class=\\\"toiletArea\\\">\u003cdiv class=\\\"toiletScene\\\">\u003csvg class=\\\"toilet\\\" viewBox=\\\"0 0 240 285\\\" role=\\\"img\\\" aria-label=\\\"Weiße Toilette mit hohem Spülkasten und Sitz\\\">\u003crect x=\\\"62\\\" y=\\\"5\\\" width=\\\"116\\\" height=\\\"77\\\" rx=\\\"12\\\" fill=\\\"#fefefe\\\" stroke=\\\"#7196a7\\\" stroke-width=\\\"6\\\"/>\u003crect x=\\\"78\\\" y=\\\"17\\\" width=\\\"84\\\" height=\\\"12\\\" rx=\\\"6\\\" fill=\\\"#e6f3f7\\\"/>\u003cpath d=\\\"M95 80h50v44H95z\\\" fill=\\\"#fdfefe\\\" stroke=\\\"#7196a7\\\" stroke-width=\\\"6\\\"/>\u003cpath d=\\\"M38 120q4-17 22-17h120q22 0 22 17v18H38z\\\" fill=\\\"#f9ffff\\\" stroke=\\\"#7196a7\\\" stroke-width=\\\"6\\\"/>\u003cellipse cx=\\\"120\\\" cy=\\\"144\\\" rx=\\\"82\\\" ry=\\\"25\\\" fill=\\\"#fdfefe\\\" stroke=\\\"#7196a7\\\" stroke-width=\\\"6\\\"/>\u003cellipse cx=\\\"120\\\" cy=\\\"147\\\" rx=\\\"54\\\" ry=\\\"14\\\" fill=\\\"#c7e9f1\\\"/>\u003cpath d=\\\"M54 149q0 56 35 91v26h84v-26q27-37 26-91\\\" fill=\\\"#f9ffff\\\" stroke=\\\"#7196a7\\\" stroke-width=\\\"6\\\"/>\u003cpath d=\\\"M87 262h91v16H79z\\\" fill=\\\"#edf8fb\\\" stroke=\\\"#7196a7\\\" stroke-width=\\\"5\\\"/>\u003c\\/svg>\u003cbutton id=\\\"chain\\\" class=\\\"chain\\\" onclick=\\\"flush()\\\" aria-label=\\\"An der Spülkette ziehen\\\">\u003cspan class=\\\"line\\\">\u003c\\/span>\u003cspan class=\\\"handle\\\">\u003c\\/span>\u003c\\/button>\u003cdiv id=\\\"splash\\\" class=\\\"splash\\\">💦\u003c\\/div>\u003c\\/div>\u003cdiv style=\\\"text-align:center\\\">\u003cp class=\\\"muted\\\">Du hast gespült:\u003c\\/p>\u003cdiv class=\\\"big\\\" id=\\\"flushCount\\\" aria-live=\\\"polite\\\">0-mal\u003c\\/div>\u003cp class=\\\"muted\\\">Das entspricht\u003c\\/p>\u003cdiv class=\\\"big\\\" id=\\\"waterCount\\\">0 Liter\u003c\\/div>\u003cdiv class=\\\"water\\\" aria-hidden=\\\"true\\\">\u003cdiv id=\\\"waterFill\\\" class=\\\"fill\\\">\u003c\\/div>\u003cdiv id=\\\"waterText\\\" class=\\\"txt\\\">0 L\u003c\\/div>\u003c\\/div>\u003cdiv class=\\\"buttons\\\" style=\\\"justify-content:center\\\">\u003cbutton class=\\\"btn secondary\\\" onclick=\\\"undo()\\\">↶ Eine Spülung zurück\u003c\\/button>\u003cbutton class=\\\"btn secondary\\\" onclick=\\\"resetFlush()\\\">Neu schätzen\u003c\\/button>\u003c\\/div>\u003c\\/div>\u003c\\/div>\u003cdiv class=\\\"notice\\\">💡 \u003cb>Für unser Experiment\u003c\\/b> verwenden wir einen vereinfachten Vergleichswert. Wie viel Wasser genau gebraucht wird, hängt von der KI und der Berechnung ab. Schätze zunächst selbst!\u003c\\/div>\u003cdiv class=\\\"footer\\\">\u003cbutton class=\\\"btn\\\" onclick=\\\"reveal()\\\">Meine Schätzung überprüfen →\u003c\\/button>\u003c\\/div>\u003c\\/section>\\n\u003csection class=\\\"panel hidden\\\" id=\\\"resultPanel\\\">\u003ch2>🔎 Auflösung: Wie nah war deine Schätzung?\u003c\\/h2>\u003cp>Du hast \u003cb id=\\\"resultFlush\\\">0-mal\u003c\\/b> gespült. Das sind \u003cb id=\\\"resultLiters\\\">0 Liter\u003c\\/b>.\u003c\\/p>\u003cdiv class=\\\"compare\\\">\u003cdiv class=\\\"comparison\\\">\u003ch3>💧 Unser Vergleichswert\u003c\\/h3>\u003cstrong>15 Liter\u003c\\/strong>\u003cp>Für \u003cb>1.000 KI-Textanfragen\u003c\\/b> rechnen wir in diesem Spiel vereinfacht mit \u003cb>15 Litern Wasser\u003c\\/b>.\u003c\\/p>\u003cp>Das entspricht ungefähr \u003cb>3 bis 4 Toilettenspülungen\u003c\\/b> mit je 4,5 Litern.\u003c\\/p>\u003c\\/div>\u003cdiv class=\\\"comparison\\\">\u003ch3>🚽 Deine Schätzung\u003c\\/h3>\u003cstrong id=\\\"guessVerdict\\\">–\u003c\\/strong>\u003cp id=\\\"guessExplanation\\\">Vergleiche deine Spülungen mit dem Modellwert.\u003c\\/p>\u003cp class=\\\"small muted\\\">Drei Spülungen: 13,5 Liter. Vier Spülungen: 18 Liter.\u003c\\/p>\u003c\\/div>\u003c\\/div>\u003cdiv class=\\\"notice\\\">\u003cb>Beachte!\u003c\\/b> Hierbei handelt es sich um einen Mittelwert. Die Werte hängen stark vom Standort und vom verwendeten KI-Modell ab.\u003c\\/div>\u003cp class=\\\"small muted\\\">\u003cb>Quellen und Einordnung:\u003c\\/b> Google (2025), „Measuring the environmental impact of delivering AI at Google Scale“; Li et al., „Making AI Less Thirsty“ (GPT-3); \u003ca href=\\\"https://www.fiegenbaum.solutions/blog/ki-wasserverbrauch-wie-viel-wasser-verbraucht-eine-anfrage\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Zusammenstellung zum KI-Wasserverbrauch (September 2026)\u003c\\/a>. Der Unterrichtswert von 15 Litern ist eine didaktische Näherung, keine Prognose für eine bestimmte KI.\u003c\\/p>\u003cdiv class=\\\"footer\\\">\u003cbutton class=\\\"btn secondary\\\" onclick=\\\"retry()\\\">↶ Noch einmal ausprobieren\u003c\\/button>\u003ca class=\\\"btn\\\" href=\\\"#\\\" onclick=\\\"parent.postMessage('go4','*');return false\\\">Weiter zu Station 4 →\u003c\\/a>\u003c\\/div>\u003c\\/section>\\n\u003c\\/main>\u003cscript>\\nconst $=id=>document.getElementById(id);let flushes=0;let shown=false;let selected=new Set();let days=1;const nf=n=>n.toLocaleString('de-DE');\\n$('people').innerHTML=Array.from({length:30},(_,i)=>`\u003cbutton type=\\\"button\\\" class=\\\"person\\\" id=\\\"p${i}\\\" aria-pressed=\\\"false\\\" aria-label=\\\"Person ${i+1} auswählen\\\" onclick=\\\"toggleStudent(${i})\\\">🧑‍🎓\u003c\\/button>`).join('');\\n$('dayButtons').innerHTML=Array.from({length:7},(_,i)=>`\u003cbutton type=\\\"button\\\" class=\\\"btn secondary day-button\\\" id=\\\"d${i+1}\\\" aria-pressed=\\\"false\\\" onclick=\\\"setDays(${i+1})\\\">${i+1}\u003c\\/button>`).join('');\\nfunction updateClass(){const count=selected.size,q=count*10*days;$('studentLabel').textContent=count;$('dayLabel').textContent=days;$('queryCount').textContent=nf(q);$('remaining').textContent=nf(Math.max(0,1000-q));$('meter').style.width=Math.min(100,q/1000*100)+'%';for(let i=0;i\u003c30;i++){const active=selected.has(i),p=$('p'+i);p.classList.toggle('on',active);p.setAttribute('aria-pressed',String(active));p.setAttribute('aria-label',`Person ${i+1} ${active?'abwählen':'auswählen'}`)}for(let i=1;i\u003c=7;i++){const btn=$('d'+i);btn.classList.toggle('active',i===days);btn.setAttribute('aria-pressed',String(i===days))}$('reached').classList.toggle('hidden',q\u003c1000);$('next').disabled=q\u003c1000;$('progress').style.width=q>=1000?'38%':'15%'}\\nfunction toggleStudent(i){if(selected.has(i))selected.delete(i);else selected.add(i);updateClass()}\\nfunction selectAll(){selected=new Set(Array.from({length:30},(_,i)=>i));updateClass()}\\nfunction clearStudents(){selected.clear();updateClass()}\\nfunction setDays(n){days=n;updateClass()}\\nfunction startToilet(){$('toiletPanel').classList.remove('hidden');$('progress').style.width='65%';$('toiletPanel').scrollIntoView({behavior:'smooth',block:'start'})}function updateFlush(){$('flushCount').textContent=flushes+'-mal';let v=flushes*4.5;$('waterCount').textContent=nf(v)+' Liter';$('waterText').textContent=nf(v)+' L';$('waterFill').style.height=Math.min(100,v/50*100)+'%'}function flush(){if(flushes>=30)return;flushes++;updateFlush();$('chain').classList.remove('pull');$('splash').classList.remove('active');void $('chain').offsetWidth;$('chain').classList.add('pull');$('splash').classList.add('active')}function undo(){flushes=Math.max(0,flushes-1);updateFlush()}function resetFlush(){flushes=0;updateFlush()}function reveal(){parent.postMessage('station3-complete','*');$('resultFlush').textContent=flushes+'-mal';$('resultLiters').textContent=nf(flushes*4.5)+' Liter';$('guessVerdict').textContent=(flushes===3||flushes===4)?'Sehr nah dran!':(flushes\u003c3?'Etwas niedrig geschätzt':'Etwas hoch geschätzt');$('guessExplanation').textContent='Du hast '+flushes+' Spülungen gewählt. Unser Vergleichswert liegt bei etwa 3 bis 4 Spülungen.';$('resultPanel').classList.remove('hidden');$('progress').style.width='100%';$('resultPanel').scrollIntoView({behavior:'smooth',block:'start'})}function retry(){$('resultPanel').classList.add('hidden');resetFlush();$('progress').style.width='65%';$('toiletPanel').scrollIntoView({behavior:'smooth',block:'start'})}updateClass();\\n\u003c\\/script>\u003c\\/body>\u003c\\/html>\\n\",\"4\":\"\u003c!doctype html>\u003chtml lang=\\\"de\\\">\u003chead>\u003cmeta charset=\\\"utf-8\\\">\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">\u003ctitle>Station 4 · KI und Handy-Akku\u003c\\/title>\u003cstyle>\\n:root{--ink:#163348;--muted:#526b73;--blue:#087f83;--light:#e8f7f4;--green:#087f83;--bg:#eaf5f6;--line:#cce5e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}.wrap{max-width:960px;margin:auto;padding:26px 18px 60px}.top{background:linear-gradient(115deg,#103d54,#087f83);color:white;border-radius:22px;padding:28px 32px;border-bottom:5px solid #ffda76}.eyebrow{font-weight:750;letter-spacing:.09em;font-size:13px;text-transform:uppercase;opacity:.9}h1{font-size:clamp(29px,4vw,42px);line-height:1.15;margin:8px 0 10px}h2{font-size:23px;line-height:1.25;margin:0 0 14px}p{margin:8px 0 14px}.top p{max-width:720px;margin-bottom:0}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin-top:18px;box-shadow:0 6px 18px #103d5410}.tag{display:inline-block;background:#dff5f1;color:#095c6b;border-radius:30px;padding:4px 12px;font-weight:750;font-size:13px;margin-bottom:12px}.note{background:#e8f7f4;border-left:5px solid #087f83;border-radius:9px;padding:14px 17px;font-size:15px}.sim{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(240px,.7fr);gap:24px;align-items:center}.control label{display:block;font-weight:750;margin:12px 0 8px}input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button{font:inherit;cursor:pointer;border:2px solid #b7e1e5;border-radius:11px;background:white;color:var(--ink);font-weight:700;padding:9px 16px}button:hover,button:focus-visible{border-color:var(--blue);outline-offset:3px}button.active{background:#dff5f1;border-color:var(--blue);color:#095c6b}.battery-panel{background:#f0fafb;border-radius:17px;padding:20px;text-align:center}.battery{height:98px;width:min(100%,260px);border:6px solid #16495b;border-radius:16px;position:relative;margin:8px auto 18px;padding:5px;background:white}.battery:after{content:'';position:absolute;right:-15px;top:27px;height:32px;width:10px;background:#16495b;border-radius:0 6px 6px 0}.fill{height:100%;width:100%;border-radius:7px;background:#21a78b;transition:width .25s,background .25s}.battery-label{font-size:30px;font-weight:850}.muted{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.metric{background:#f0fafb;border-radius:12px;padding:13px;text-align:center}.metric strong{display:block;font-size:23px;color:#087f83}.metric span{font-size:13px;color:var(--muted)}fieldset{border:0;padding:0;margin:0}legend{font-weight:750;margin-bottom:10px}.options{display:grid;gap:10px}.option{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px 15px;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:#e8f7f4}.option input{margin-top:6px;accent-color:var(--blue)}.primary{background:var(--blue);border-color:var(--blue);color:white;margin-top:16px}.primary:hover{background:#095c6b}.feedback{margin-top:14px;border-radius:12px;padding:14px 16px;background:#dff5f1;border:1px solid #9bd9cb}.feedback.bad{background:#fff6e8;border-color:#f0c885}.hidden{display:none}.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}@media(max-width:700px){.sim{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.card{padding:20px}.top{padding:24px}}\\n\u003c\\/style>\u003c\\/head>\u003cbody>\u003cmain class=\\\"wrap\\\">\u003cheader class=\\\"top\\\">\u003cdiv class=\\\"eyebrow\\\">KI & Nachhaltigkeit · Station 4\u003c\\/div>\u003ch1>Wie viel Handy-Akku steckt in KI?\u003c\\/h1>\u003cp>Entdecke mit einem interaktiven Rechenmodell, warum viele kleine KI-Anfragen zusammen Energie benötigen.\u003c\\/p>\u003c\\/header>\\n\u003csection class=\\\"card\\\">\u003cspan class=\\\"tag\\\">1 · Verstehen\u003c\\/span>\u003ch2>Eine KI-Anfrage braucht Strom\u003c\\/h2>\u003cp>Wenn du eine KI um eine Antwort bittest, arbeiten dafür Computer in einem Rechenzentrum. Sie verbrauchen elektrische Energie. Wir vergleichen diese Energie mit der Speicherkapazität eines Handy-Akkus.\u003c\\/p>\u003cdiv class=\\\"note\\\">\u003cstrong>Unser Rechenbeispiel:\u003c\\/strong> Ein Handy-Akku speichert \u003cstrong>15 Wattstunden (Wh)\u003c\\/strong>. Für eine kurze KI-Textanfrage setzen wir beispielhaft \u003cstrong>0,3 Wh\u003c\\/strong> an. Das sind \u003cstrong>Modellannahmen für diese Aufgabe\u003c\\/strong>, keine festen Verbrauchswerte aller Handys oder KI-Systeme. Der echte Verbrauch kann stark abweichen.\u003c\\/div>\u003c\\/section>\\n\u003csection class=\\\"card\\\">\u003cspan class=\\\"tag\\\">2 · Ausprobieren\u003c\\/span>\u003ch2>Du bestimmst die Zahl der KI-Anfragen\u003c\\/h2>\u003cdiv class=\\\"sim\\\">\u003cdiv class=\\\"control\\\">\u003clabel for=\\\"queries\\\">Anzahl der KI-Textanfragen: \u003coutput id=\\\"queryOut\\\">10\u003c\\/output>\u003c\\/label>\u003cinput id=\\\"queries\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"150\\\" step=\\\"1\\\" value=\\\"10\\\">\u003cdiv class=\\\"ticks\\\">\u003cspan>0\u003c\\/span>\u003cspan>75\u003c\\/span>\u003cspan>150\u003c\\/span>\u003c\\/div>\u003cdiv class=\\\"quick\\\" aria-label=\\\"Schnellauswahl\\\">\u003cbutton type=\\\"button\\\" data-count=\\\"10\\\" class=\\\"active\\\">10\u003c\\/button>\u003cbutton type=\\\"button\\\" data-count=\\\"25\\\">25\u003c\\/button>\u003cbutton type=\\\"button\\\" data-count=\\\"50\\\">50\u003c\\/button>\u003cbutton type=\\\"button\\\" data-count=\\\"100\\\">100\u003c\\/button>\u003c\\/div>\u003cp class=\\\"muted\\\" style=\\\"margin-top:17px;font-size:15px\\\">Stell dir vor: So viel Energie würde für diese Zahl von Anfragen im Rechenmodell benötigt.\u003c\\/p>\u003c\\/div>\u003cdiv class=\\\"battery-panel\\\">\u003cdiv class=\\\"muted\\\">Verbleibende Vergleichsenergie\u003c\\/div>\u003cdiv class=\\\"battery\\\" role=\\\"img\\\" aria-label=\\\"Vergleichs-Akku\\\">\u003cdiv id=\\\"batteryFill\\\" class=\\\"fill\\\">\u003c\\/div>\u003c\\/div>\u003cdiv id=\\\"batteryPercent\\\" class=\\\"battery-label\\\">80 %\u003c\\/div>\u003cdiv class=\\\"muted\\\" id=\\\"batteryNote\\\">entspricht 20 % eines Akkus verbraucht\u003c\\/div>\u003c\\/div>\u003c\\/div>\u003cdiv class=\\\"metrics\\\">\u003cdiv class=\\\"metric\\\">\u003cstrong id=\\\"energy\\\">3,0 Wh\u003c\\/strong>\u003cspan>Energie für KI-Anfragen\u003c\\/span>\u003c\\/div>\u003cdiv class=\\\"metric\\\">\u003cstrong id=\\\"equivalent\\\">20 %\u003c\\/strong>\u003cspan>eines 15-Wh-Akkus\u003c\\/span>\u003c\\/div>\u003cdiv class=\\\"metric\\\">\u003cstrong id=\\\"batteries\\\">0,2\u003c\\/strong>\u003cspan>Akku-Ladungen als Energievergleich\u003c\\/span>\u003c\\/div>\u003c\\/div>\u003cp class=\\\"note\\\" style=\\\"margin-top:16px\\\">\u003cstrong>Wichtig:\u003c\\/strong> Der Akku wird hier \u003cem>nur als Vergleichsmaßstab\u003c\\/em> verwendet. Deine KI-Anfragen entladen nicht unmittelbar deinen Handy-Akku um diesen Betrag – der Strom wird überwiegend in Rechenzentren verbraucht.\u003c\\/p>\u003c\\/section>\\n\u003csection class=\\\"card\\\">\u003cspan class=\\\"tag\\\">3 · Nachdenken\u003c\\/span>\u003ch2>Knacke die Akku-Frage\u003c\\/h2>\u003cfieldset>\u003clegend>Wie viele Anfragen entsprechen in unserem Rechenbeispiel ungefähr der Energie einer vollständigen Handy-Akkuladung?\u003c\\/legend>\u003cdiv class=\\\"options\\\">\u003clabel class=\\\"option\\\">\u003cinput type=\\\"radio\\\" name=\\\"answer\\\" value=\\\"10\\\">10 Anfragen\u003c\\/label>\u003clabel class=\\\"option\\\">\u003cinput type=\\\"radio\\\" name=\\\"answer\\\" value=\\\"50\\\">50 Anfragen\u003c\\/label>\u003clabel class=\\\"option\\\">\u003cinput type=\\\"radio\\\" name=\\\"answer\\\" value=\\\"100\\\">100 Anfragen\u003c\\/label>\u003c\\/div>\u003c\\/fieldset>\u003cbutton class=\\\"primary\\\" type=\\\"button\\\" id=\\\"check\\\">Antwort prüfen\u003c\\/button>\u003cdiv id=\\\"feedback\\\" class=\\\"feedback hidden\\\" role=\\\"status\\\" aria-live=\\\"polite\\\">\u003c\\/div>\u003c\\/section>\\n\u003csection class=\\\"card\\\">\u003cspan class=\\\"tag\\\">4 · Mitnehmen\u003c\\/span>\u003ch2>Was bedeutet das für unseren Alltag?\u003c\\/h2>\u003cp>Eine einzelne Anfrage kann wenig Energie benötigen. Wenn aber sehr viele Menschen KI häufig verwenden, summiert sich der Energiebedarf. Besonders aufwendige Aufgaben können deutlich mehr Energie benötigen als kurze Textantworten.\u003c\\/p>\u003cp>\u003cstrong>Dein Merksatz:\u003c\\/strong> Nutze KI dort, wo sie dir wirklich hilft – und überlege, ob du eine einfache Frage manchmal auch ohne KI beantworten kannst.\u003c\\/p>\u003c\\/section>\u003cdiv class=\\\"foot\\\">Eigenständige Station · funktioniert offline · keine weiteren Dateien erforderlich\u003c\\/div>\u003c\\/main>\\n\u003cscript>\\n(()=>{'use strict';const q=document.getElementById('queries'),out=document.getElementById('queryOut'),energy=document.getElementById('energy'),eq=document.getElementById('equivalent'),batteries=document.getElementById('batteries'),fill=document.getElementById('batteryFill'),pct=document.getElementById('batteryPercent'),note=document.getElementById('batteryNote'),buttons=[...document.querySelectorAll('[data-count]')];const fmt=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1,minimumFractionDigits:1});function update(){const n=Number(q.value),wh=n*.3,share=wh/15,remaining=Math.max(0,100-share*100);out.textContent=n;energy.textContent=fmt(wh)+' Wh';eq.textContent=Math.round(share*100)+' %';batteries.textContent=fmt(share);fill.style.width=remaining+'%';fill.style.background=remaining>35?'#21a78b':remaining>10?'#f0b84b':'#e66d60';pct.textContent=Math.round(remaining)+' %';note.textContent=share\u003c=1?'entspricht '+Math.round(share*100)+' % eines Akkus verbraucht':'Energievergleich: '+fmt(share)+' ganze Akkuladungen';buttons.forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===n));}q.addEventListener('input',update);buttons.forEach(b=>b.addEventListener('click',()=>{q.value=b.dataset.count;update()}));document.getElementById('check').addEventListener('click',()=>{const selected=document.querySelector('input[name=\\\"answer\\\"]:checked'),f=document.getElementById('feedback');f.classList.remove('hidden','bad');if(!selected){f.classList.add('bad');f.textContent='Bitte wähle zuerst eine Antwort aus.';return}if(selected.value==='50'){parent.postMessage('station4-complete','*');f.innerHTML='\u003cstrong>Richtig!\u003c\\/strong> 50 × 0,3 Wh = 15 Wh. Das entspricht der Energie einer vollständigen Akkuladung in unserem Modell.';}else{f.classList.add('bad');f.innerHTML='\u003cstrong>Noch nicht ganz.\u003c\\/strong> Rechne: 15 Wh ÷ 0,3 Wh pro Anfrage. Probiere es noch einmal!';}});update()})();\\n\u003c\\/script>\u003cdiv style=\\\"max-width:960px;margin:15px auto 45px;padding:15px 20px;background:#fff;border:1px solid #cce5e4;border-radius:16px;font:700 16px system-ui,sans-serif;display:flex;gap:12px;flex-wrap:wrap\\\">\u003cbutton type=\\\"button\\\" onclick=\\\"parent.postMessage('go3','*')\\\" style=\\\"background:#eef8f7;color:#087f83;border:1px solid #a7d8d5;border-radius:13px;padding:14px 20px;font:800 16px system-ui,sans-serif;cursor:pointer\\\">← Vorherige Station\u003c\\/button>\u003cbutton type=\\\"button\\\" onclick=\\\"parent.postMessage('station4-next','*')\\\" style=\\\"background:#087f83;color:white;border:0;border-radius:13px;padding:14px 20px;font:800 16px system-ui,sans-serif;cursor:pointer;margin-left:auto\\\">Weiter zu Station 5 →\u003c\\/button>\u003c\\/div>\u003c\\/body>\u003c\\/html>\\n\",\"5\":\"\u003c!doctype html>\u003chtml lang=\\\"de\\\">\u003chead>\u003cmeta charset=\\\"utf-8\\\">\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">\u003ctitle>KI-Führerschein – KI im Alltag\u003c\\/title>\u003cstyle>\\n:root{--ink:#103c46;--teal:#087e86;--mint:#e8f8f3;--yellow:#ffd96b;--line:#c9e6e2}*{box-sizing:border-box}body{margin:0;background:#f2faf8;color:var(--ink);font:17px/1.5 system-ui,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}header{background:linear-gradient(115deg,#103c46,#07858b);color:white;padding:32px 24px;border-radius:22px;box-shadow:0 10px 30px #164d4d18}header .tag{display:inline-block;background:var(--yellow);color:#213c3e;padding:5px 13px;border-radius:40px;font-weight:800;font-size:13px}h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:14px 0 8px}h2{font-size:23px}p{margin:8px 0 14px}.intro,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.cat{padding:14px;border-radius:14px;background:var(--mint);border:1px solid var(--line);font-size:15px}.cat strong{display:block;font-size:17px;margin-bottom:5px}.progress{height:13px;background:#dcefeb;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#12a49d;transition:width .3s}.small{font-size:14px;color:#527179}.situation{font-size:22px;font-weight:750;margin:12px 0 22px}.choices{display:grid;gap:11px}.choice{font:inherit;text-align:left;padding:15px 18px;background:#fff;border:2px solid #bedbd8;border-radius:13px;cursor:pointer;color:var(--ink);font-weight:700}.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--teal);background:#f1fcf8}.choice:disabled{cursor:default}.choice.correct{background:#d7f5e5;border-color:#14845c}.choice.wrong{background:#fff0e5;border-color:#d87d43}.feedback{padding:16px;border-radius:14px;background:#f0f9f5;border-left:5px solid #14977b;margin-top:18px}.btn{background:var(--teal);color:white;border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e6f3f1;color:var(--ink)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.result{background:#fff8e0;border:1px solid #efd47d;border-radius:15px;padding:17px}.eco{background:#e8f8f3;border:2px solid #65c9b2;border-radius:16px;padding:18px;margin-top:18px}.eco strong{font-size:23px}.decision{margin-top:19px;padding:17px;background:#f7fbf7;border:1px solid var(--line);border-radius:15px}.decision .choices{grid-template-columns:repeat(2,minmax(0,1fr))}.decision:not(.hidden){display:block}.decision .choice{min-height:58px;touch-action:manipulation}.decision .choice:disabled{opacity:.55}.decision .choice:not(:disabled){box-shadow:0 3px 10px #087e8620}.choice.avoid{background:#dcf8e7;border-color:#48a67b}.eco-note{font-size:14px;color:#456b70}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.count{border-radius:13px;background:var(--mint);text-align:center;padding:12px}.count b{font-size:27px;display:block}textarea{width:100%;min-height:100px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit}footer{font-size:13px;color:#5a7679;margin:25px 0}@media(max-width:650px){.categories,.counts,.decision .choices{grid-template-columns:1fr}.wrap{padding:12px}header{padding:23px 18px}.intro,.panel{padding:17px}}\\n\u003c\\/style>\u003c\\/head>\u003cbody>\u003cmain class=\\\"wrap\\\">\u003cheader>\u003cspan class=\\\"tag\\\">KI-FÜHRERSCHEIN · ALLTAGS-CHECK\u003c\\/span>\u003ch1>🤖 KI im Alltag: Brauche ich sie wirklich?\u003c\\/h1>\u003cp>13 gemischte Alltagssituationen: Wann hilft KI wirklich – und wann sparst du durch einen Verzicht Strom und Wasser?\u003c\\/p>\u003c\\/header>\u003csection class=\\\"intro\\\">\u003ch2>Deine Aufgabe\u003c\\/h2>\u003cp>Lies jede Situation und wähle zuerst die passendste Einschätzung. Entscheide danach selbst, ob du KI dafür nutzen möchtest. Du erhältst eine Erklärung und siehst, welche Ressourcen du durch einen Verzicht sparen kannst. Es geht nicht darum, KI grundsätzlich gut oder schlecht zu finden, sondern sie \u003cstrong>bewusst und verantwortungsvoll\u003c\\/strong> einzusetzen.\u003c\\/p>\u003cdiv class=\\\"categories\\\">\u003cdiv class=\\\"cat\\\">\u003cstrong>🚫 Überflüssig\u003c\\/strong>Eine einfache Lösung ohne KI ist hier sinnvoller.\u003c\\/div>\u003cdiv class=\\\"cat\\\">\u003cstrong>💡 Wirklich hilfreich\u003c\\/strong>KI kann dich bei einer passenden Aufgabe sinnvoll unterstützen.\u003c\\/div>\u003cdiv class=\\\"cat\\\">\u003cstrong>⚖️ Erst nachdenken!\u003c\\/strong>KI spart Zeit, kann aber Lernen oder Eigenleistung ersetzen.\u003c\\/div>\u003c\\/div>\u003c\\/section>\u003csection class=\\\"panel\\\" id=\\\"game\\\">\u003cdiv class=\\\"small\\\" id=\\\"progressText\\\" aria-live=\\\"polite\\\">Situation 1 von 13\u003c\\/div>\u003cdiv class=\\\"progress\\\" role=\\\"progressbar\\\" aria-label=\\\"Fortschritt\\\">\u003cdiv class=\\\"bar\\\" id=\\\"bar\\\">\u003c\\/div>\u003c\\/div>\u003ch2 id=\\\"headline\\\">Was würdest du tun?\u003c\\/h2>\u003cdiv class=\\\"situation\\\" id=\\\"situation\\\">\u003c\\/div>\u003cdiv class=\\\"choices\\\" id=\\\"choices\\\">\u003c\\/div>\u003cdiv class=\\\"feedback hidden\\\" id=\\\"feedback\\\" role=\\\"status\\\">\u003c\\/div>\u003cdiv class=\\\"decision\\\" id=\\\"decision\\\">\u003cstrong>🌍 Und wie entscheidest du dich persönlich?\u003c\\/strong>\u003cp>Beide Entscheidungen sind möglich. Überlege, ob der Nutzen den zusätzlichen Ressourcenverbrauch rechtfertigt.\u003c\\/p>\u003cp class=\\\"small\\\" id=\\\"decisionHint\\\">Wähle zuerst oben deine Einschätzung der Situation. Danach kannst du dich für oder gegen KI entscheiden.\u003c\\/p>\u003cdiv class=\\\"choices\\\">\u003cbutton type=\\\"button\\\" disabled class=\\\"choice avoid\\\" id=\\\"avoid\\\">🌱 Ich verzichte auf KI\u003c\\/button>\u003cbutton type=\\\"button\\\" disabled class=\\\"choice\\\" id=\\\"use\\\">🤖 Ich nutze KI bewusst\u003c\\/button>\u003c\\/div>\u003cp class=\\\"small\\\" id=\\\"decisionFeedback\\\" aria-live=\\\"polite\\\">\u003c\\/p>\u003c\\/div>\u003cdiv class=\\\"eco\\\" aria-live=\\\"polite\\\">\u003cdiv>🌿 \u003cstrong>Deine Umweltbilanz\u003c\\/strong>\u003c\\/div>\u003cdiv id=\\\"ecoLive\\\">0 vermiedene KI-Anfragen · ca. 0,0 ml Wasser · ca. 0,0 Wh Strom\u003c\\/div>\u003cdiv class=\\\"eco-note\\\">Vereinfachtes Rechenmodell: 1 vermiedene Textanfrage ≈ 0,3 ml Wasser und 0,3 Wh Strom. Tatsächliche Werte variieren stark nach KI-Modell, Rechenzentrum und Berechnungsmethode. Es sind keine exakt messbaren persönlichen Einsparungen.\u003c\\/div>\u003c\\/div>\u003cdiv class=\\\"controls\\\">\u003cbutton class=\\\"btn\\\" id=\\\"next\\\" disabled>Nächste Situation →\u003c\\/button>\u003cbutton class=\\\"btn secondary\\\" id=\\\"restart\\\">Neu beginnen\u003c\\/button>\u003c\\/div>\u003c\\/section>\u003csection class=\\\"panel hidden\\\" id=\\\"end\\\">\u003ch2>🎉 Geschafft! Dein KI-Kompass\u003c\\/h2>\u003cp>Du hast alle 13 Situationen durchdacht. Entscheidend ist nicht nur, ob KI etwas \u003cem>kann\u003c\\/em>, sondern ob ihr Einsatz \u003cstrong>sinnvoll, fair und lernförderlich\u003c\\/strong> ist.\u003c\\/p>\u003cdiv class=\\\"counts\\\">\u003cdiv class=\\\"count\\\">\u003cb>5\u003c\\/b>überflüssig\u003c\\/div>\u003cdiv class=\\\"count\\\">\u003cb>5\u003c\\/b>hilfreich\u003c\\/div>\u003cdiv class=\\\"count\\\">\u003cb>3\u003c\\/b>erst nachdenken\u003c\\/div>\u003c\\/div>\u003cdiv class=\\\"result\\\" id=\\\"score\\\">\u003c\\/div>\u003cdiv class=\\\"eco\\\">\u003cstrong>🌍 Deine Entscheidung für die Umwelt\u003c\\/strong>\u003cp id=\\\"ecoFinal\\\">\u003c\\/p>\u003cp class=\\\"eco-note\\\">Diese Modellrechnung berücksichtigt nur angenommene Textanfragen. Andere Nutzungen können deutlich mehr oder weniger verbrauchen.\u003c\\/p>\u003c\\/div>\u003cdiv class=\\\"result\\\" style=\\\"margin-top:16px\\\">\u003cstrong>Unser Merksatz für den KI-Führerschein:\u003c\\/strong>\u003cp>„KI soll mir helfen, besser zu lernen und zu arbeiten – nicht das Denken und Lernen für mich übernehmen.“\u003c\\/p>\u003c\\/div>\u003ch2>Deine persönliche Regel\u003c\\/h2>\u003cp>Vervollständige den Satz: \u003cstrong>Bevor ich KI nutze, frage ich mich …\u003c\\/strong>\u003c\\/p>\u003ctextarea id=\\\"reflection\\\" placeholder=\\\"Zum Beispiel: Kann ich es selbst lösen? Lerne ich dabei noch etwas? Darf ich das Ergebnis als meine Arbeit abgeben?\\\">\u003c\\/textarea>\u003cdiv class=\\\"controls\\\">\u003cbutton class=\\\"btn\\\" id=\\\"copy\\\">Meine Regel kopieren\u003c\\/button>\u003cbutton class=\\\"btn secondary\\\" id=\\\"again\\\">Alle Situationen erneut spielen\u003c\\/button>\u003c\\/div>\u003cp class=\\\"small\\\" id=\\\"copyStatus\\\" aria-live=\\\"polite\\\">\u003c\\/p>\u003cdiv class=\\\"controls\\\" style=\\\"margin-top:22px\\\">\u003cbutton type=\\\"button\\\" class=\\\"btn\\\" id=\\\"backToStart\\\">← Zurück zum Start\u003c\\/button>\u003c\\/div>\u003c\\/section>\u003cfooter>Hinweis: Umweltwerte sind illustrative Rechenannahmen, keine gesicherten Durchschnittswerte. Die Situationen sind bewusst vereinfacht. Je nach Aufgabe, Datenschutz und Schulregeln kann eine andere Entscheidung ebenfalls begründet sein.\u003c\\/footer>\u003c\\/main>\u003cscript>\\nconst items=[\\n{t:'Du möchtest wissen, wie viel 7 × 8 ist. Du hast das Einmaleins bereits gelernt.',a:0,e:'Hier brauchst du keine KI. Kopfrechnen geht schnell, verbraucht keine zusätzliche Rechenzentrumsleistung und trainiert dein Wissen.'},\\n{t:'Du möchtest wissen, wie das Wetter gerade draußen ist, und kannst aus dem Fenster schauen.',a:0,e:'Ein Blick aus dem Fenster genügt. Für eine einfache Beobachtung brauchst du kein KI-System.'},\\n{t:'Du willst herausfinden, wie spät es ist. Die Uhr hängt direkt vor dir.',a:0,e:'Die Uhr liefert die Antwort sofort. KI wäre ein unnötiger Umweg.'},\\n{t:'Du möchtest die Bedeutung eines einzelnen Wortes nachschlagen und hast ein Wörterbuch zur Hand.',a:0,e:'Ein Wörterbuch reicht völlig aus. Du kannst die Bedeutung direkt nachschlagen.'},\\n{t:'Du willst ausrechnen, wie viel Wechselgeld du für einen Einkauf bekommst. Du kannst die Beträge einfach abziehen.',a:0,e:'Selbst rechnen oder ein einfacher Taschenrechner sind hier naheliegender als generative KI.'},\\n{t:'Du verstehst einen schwierigen Sachtext nicht und möchtest dir die wichtigsten Begriffe in einfacher Sprache erklären lassen.',a:1,e:'KI kann einen Text verständlicher erklären. Prüfe die Aussagen am Original und frage bei Unklarheiten nach.'},\\n{t:'Du übst für eine Englisch-Arbeit und möchtest zusätzliche Vokabel-Fragen, die zu deinem Lernstand passen.',a:1,e:'KI kann passende Übungsfragen erstellen und dir Rückmeldung geben. Lernen und Antworten übernimmst du selbst.'},\\n{t:'Du möchtest verschiedene Ideen sammeln, wie eure Klasse beim Schulfest Müll vermeiden kann.',a:1,e:'Beim Brainstorming kann KI neue Anregungen liefern. Entscheiden und umsetzen muss eure Klasse selbst.'},\\n{t:'Du hast eine eigene Geschichte geschrieben und möchtest Hinweise, wie du sie spannender gestalten kannst.',a:1,e:'Feedback zu deinem eigenen Text kann helfen. Du entscheidest selbst, welche Vorschläge du übernimmst.'},\\n{t:'Du möchtest dir einen komplizierten biologischen Vorgang schrittweise erklären und danach mit eigenen Worten wiedergeben.',a:1,e:'Eine schrittweise Erklärung kann beim Verstehen helfen. Wichtig ist, dass du sie kritisch prüfst und den Vorgang selbst erklären kannst.'},\\n{t:'Du sollst einen Aufsatz als Hausaufgabe schreiben. KI könnte den fertigen Text in Sekunden für dich verfassen.',a:2,e:'Das spart Zeit, aber du übst das Schreiben nicht. Einen KI-Text darfst du nicht als eigene Leistung ausgeben. Besser: selbst schreiben und KI höchstens für erlaubtes Feedback nutzen.'},\\n{t:'Du sollst ein Referat vorbereiten. KI bietet dir an, alle Folien und den Vortrag komplett zu übernehmen.',a:2,e:'Das wäre bequem, aber du musst die Inhalte verstehen, Quellen prüfen und deine eigene Leistung erbringen. Nutze KI lieber für eine Gliederung oder Verständnisfragen, sofern erlaubt.'},\\n{t:'Du sollst Matheaufgaben selbst lösen. KI könnte dir einfach alle fertigen Ergebnisse und Rechenwege geben.',a:2,e:'Du wärst schneller fertig, hättest aber kaum geübt. Sinnvoller: erst selbst rechnen und KI bei Bedarf um einen Hinweis statt der vollständigen Lösung bitten.'}\\n];\\nconst labels=['🚫 Überflüssig','💡 Wirklich hilfreich','⚖️ Erst nachdenken!'];\\n// Abwechslungsreiche feste Reihenfolge: einfach, hilfreich, kritisch, hilfreich usw.\\nconst order=[0,5,10,1,6,11,2,7,12,3,8,4,9];\\nconst situations=order.map(i=>items[i]);\\nlet index=0,correct=0,answered=false,decided=false,avoided=0,used=0;\\nconst $=id=>document.getElementById(id);\\nconst fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});\\nfunction updateEco(){ $('ecoLive').textContent=`${avoided} vermiedene KI-Anfrage${avoided===1?'':'n'} · ca. ${fmt(avoided*0.3)} ml Wasser · ca. ${fmt(avoided*0.3)} Wh Strom`; }\\nfunction show(){answered=false;decided=false;const item=situations[index];$('progressText').textContent=`Situation ${index+1} von ${situations.length}`;$('bar').style.width=`${index/situations.length*100}%`;$('situation').textContent=item.t;$('choices').innerHTML='';labels.forEach((label,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>answer(i);$('choices').appendChild(b)});$('feedback').classList.add('hidden');$('decision').classList.remove('hidden');$('decisionFeedback').textContent='';$('decisionHint').textContent='Wähle zuerst oben deine Einschätzung der Situation. Danach kannst du dich für oder gegen KI entscheiden.';$('avoid').disabled=true;$('use').disabled=true;$('next').disabled=true;$('next').textContent=index===situations.length-1?'Ergebnis ansehen →':'Nächste Situation →';updateEco()}\\nfunction answer(choice){if(answered)return;answered=true;const item=situations[index];if(choice===item.a)correct++;[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('feedback').innerHTML=`\u003cstrong>${choice===item.a?'✓ Gut eingeschätzt!':'↪ Eine andere Einschätzung passt hier besser.'}\u003c\\/strong>\u003cp>${item.e}\u003c\\/p>`;$('feedback').classList.remove('hidden');$('decision').classList.remove('hidden');$('decisionHint').textContent='Jetzt bist du dran: Wähle eine der beiden Entscheidungen.';$('avoid').disabled=false;$('use').disabled=false;requestAnimationFrame(()=>{reportReadingHeight();setTimeout(()=>{const target=$('decision');parent.postMessage({type:'station-reading-focus',y:Math.max(0,target.getBoundingClientRect().top+window.scrollY-18)},'*');},80);})}\\nfunction decide(avoid){if(!answered||decided)return;decided=true;if(avoid){avoided++;$('decisionFeedback').textContent='🌱 Gut überlegt! Du hast dich bewusst gegen eine zusätzliche KI-Anfrage entschieden – auch wenn KI hier helfen könnte. Im Rechenmodell sparst du 0,3 ml Wasser und 0,3 Wh Strom.';}else{used++;$('decisionFeedback').textContent=situations[index].a===0?'🤔 Überlege noch einmal: Hier wäre eine einfache Lösung ohne KI möglich gewesen.':'👍 Eine bewusste Entscheidung! Nutze KI gezielt, prüfe die Ergebnisse und übernimm das Denken selbst.';}$('avoid').disabled=true;$('use').disabled=true;$('decisionHint').textContent='Deine Entscheidung ist gespeichert. Weiter geht es mit der nächsten Situation.';$('next').disabled=false;updateEco()}\\nfunction end(){parent.postMessage('station5-complete','*'); $('game').classList.add('hidden');$('end').classList.remove('hidden');$('bar').style.width='100%';$('score').textContent=`Du hast ${correct} von 13 Situationen passend eingeordnet. Du hast dich ${avoided}-mal gegen und ${used}-mal für KI entschieden. Wichtig ist vor allem, dass du deine Entscheidungen begründen kannst.`;$('ecoFinal').textContent=`Du hast ${avoided} zusätzliche Textanfragen vermieden. Das entspricht im vereinfachten Modell ungefähr ${fmt(avoided*0.3)} ml Wasser und ${fmt(avoided*0.3)} Wh Strom. Auch der Verzicht auf eine grundsätzlich hilfreiche KI-Anwendung zählt!`;readingAtTop()}\\nfunction reset(){index=0;correct=0;avoided=0;used=0;$('end').classList.add('hidden');$('game').classList.remove('hidden');show();readingAtTop()}\\n$('backToStart').onclick=()=>parent.postMessage('home','*');\\n$('avoid').onclick=()=>decide(true);$('use').onclick=()=>decide(false);\\n$('next').onclick=()=>{if(!decided)return;if(++index===situations.length)end();else {show();readingAtTop()}};$('restart').onclick=reset;$('again').onclick=reset;$('copy').onclick=async()=>{const value=$('reflection').value.trim();if(!value){$('copyStatus').textContent='Schreibe zuerst deine Regel auf.';return}try{await navigator.clipboard.writeText('Bevor ich KI nutze, frage ich mich: '+value);$('copyStatus').textContent='Deine Regel wurde kopiert.'}catch(e){$('reflection').select();$('copyStatus').textContent='Markiere und kopiere deinen Text mit Strg+C.'}};show();\\n\\n// iPad-freundliche, durchgehende Leserichtung: keine zweite Scrollfläche im iframe.\\nfunction reportReadingHeight(){\\n  const height=Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight));\\n  parent.postMessage({type:'station-reading-height',height},'*');\\n}\\nfunction readingAtTop(){\\n  window.scrollTo(0,0);\\n  parent.postMessage({type:'station-reading-top'},'*');\\n  requestAnimationFrame(reportReadingHeight);\\n}\\nnew ResizeObserver(reportReadingHeight).observe(document.body);\\nwindow.addEventListener('load',reportReadingHeight);\\n\u003c\\/script>\u003cdiv style=\\\"max-width:960px;margin:15px auto 45px;padding:15px 20px;background:#fff;border:1px solid #cce5e4;border-radius:16px;font:700 16px system-ui,sans-serif;display:flex;gap:12px;flex-wrap:wrap\\\">\u003ca style=\\\"color:#087f83\\\" href=\\\"#\\\" onclick=\\\"parent.postMessage('go4','*');return false\\\">← Vorherige Station\u003c\\/a>\u003cbutton type=\\\"button\\\" style=\\\"background:#087f83;color:#fff;border:0;border-radius:11px;padding:11px 18px;font:700 16px system-ui,sans-serif;cursor:pointer;margin-left:auto\\\" onclick=\\\"parent.postMessage('home','*')\\\">← Zurück zum Start\u003c\\/button>\u003c\\/div>\u003c\\/body>\u003c\\/html>\"};\nconst achievements={\n  1:{icon:'🔎',name:'Ressourcen-Profi',description:'Du hast die Ressourcen gefunden und alle Verständnisfragen gelöst.',sentence:'KI braucht Rohstoffe, Energie, Wasser und technische Anlagen – und belastet dadurch unsere Umwelt.'},\n  2:{icon:'🎬',name:'KI-Durchblicker',description:'Du hast den Filmcheck erfolgreich bestanden.',sentence:'Auch digitale Anwendungen haben Auswirkungen auf die reale Umwelt.'},\n  3:{icon:'💧',name:'Wasser-Detektiv',description:'Du hast den Wasserverbrauch mit dem Toiletten-Experiment verglichen.',sentence:'Auch kleine Verbrauchsmengen können sich bei sehr vielen KI-Anfragen summieren.'},\n  4:{icon:'🔋',name:'Energie-Checker',description:'Du hast die Akku-Rechenaufgabe richtig gelöst.',sentence:'Jede KI-Anfrage benötigt Energie – deshalb lohnt sich ein bewusster Umgang.'},\n  5:{icon:'🧠',name:'KI-Zukunftsgestalter',description:'Du hast alle Alltagssituationen bearbeitet.',sentence:'KI soll mir helfen, besser zu lernen und zu arbeiten – nicht das Denken und Lernen für mich übernehmen.'}\n};\nconst completed=new Set(),awarded=new Set();let pendingNavigation=null;\nfunction updateAchievements(){document.getElementById('achievementsProgress').textContent='🏅 '+awarded.size+' / 5 Erfolge'}\nfunction award(station,next){\n if(!completed.has(station)||awarded.has(station)){if(next)show(next);return}\n awarded.add(station);updateAchievements();pendingNavigation=next||null;\n const a=achievements[station];\n document.getElementById('achievementIcon').textContent=a.icon;\n document.getElementById('achievementEyebrow').textContent=station===5?'Modul erfolgreich abgeschlossen!':'Achievement freigeschaltet!';\n document.getElementById('achievementTitle').textContent=a.name;\n document.getElementById('achievementDescription').textContent=a.description;\n document.getElementById('achievementSentence').textContent='Das nehme ich mit: '+a.sentence;\n document.getElementById('achievementContinue').textContent=next?'Weiter zu Station '+next+' →':'🎉 KI-Nachhaltigkeitsprofi – geschafft!';\n document.getElementById('achievementOverlay').classList.add('open');\n document.getElementById('achievementContinue').focus();\n}\ndocument.getElementById('achievementContinue').addEventListener('click',()=>{\n document.getElementById('achievementOverlay').classList.remove('open');\n const next=pendingNavigation;pendingNavigation=null;if(next)show(next);\n});\nlet station1Complete=false;\nfunction updateLocks(){\n for(const id of ['2','3','4','5']){\n  const b=document.getElementById('b'+id);\n  b.disabled=!station1Complete;\n  b.title=station1Complete?'':'Erst alle 12 Informationskarten in Station 1 lesen';\n  b.style.opacity=station1Complete?'1':'.45';\n  b.style.cursor=station1Complete?'pointer':'not-allowed';\n }\n document.getElementById('resourceLockNote').style.display=(station1Complete||location.hash==='#start')?'none':'block';\n}\nfunction show(n){if(!station1Complete&&['2','3','4','5'].includes(n)){alert('🔒 Bitte lies zuerst alle 12 Informationskarten in Station 1. Danach kannst du weitermachen.');return;}document.getElementById('achievementsProgress').style.display=n==='home'?'none':'inline';document.getElementById('resourceLockNote').style.display=(n==='home'||station1Complete)?'none':'block';document.getElementById('intro').style.display=n==='home'?'block':'none';const frame=document.getElementById('content');frame.style.display=n==='home'?'none':'block';if(n!=='home'){frame.style.height='calc(100dvh - 75px)';frame.srcdoc=pages[n];}for(const x of ['home','1','2','3','4','5'])document.getElementById(x==='home'?'home':'b'+x).classList.toggle('active',x===n);history.replaceState(null,'',n==='home'?'#start':'#station'+n);window.scrollTo(0,0)}\nwindow.addEventListener('message',e=>{if(e.source!==document.getElementById('content').contentWindow)return;if(e.data&&e.data.type==='station-reading-height'){const h=Number(e.data.height);if(Number.isFinite(h)&&h>200&&h\u003c200000){document.getElementById('content').style.height=Math.ceil(h+8)+'px';}return;}if(e.data&&e.data.type==='station-reading-top'){requestAnimationFrame(()=>document.getElementById('content').scrollIntoView({block:'start',behavior:'instant'}));return;}if(e.data&&e.data.type==='station-reading-focus'){const y=Number(e.data.y);if(Number.isFinite(y)&&y>=0){const frame=document.getElementById('content');const top=frame.getBoundingClientRect().top+window.scrollY;window.scrollTo({top:top+y,behavior:'smooth'});}return;}if(e.data==='station4-next'){if(completed.has(4)){if(!awarded.has(4))award(4,'5');else show('5');}else alert('Bitte löse zuerst die Akku-Rechenaufgabe richtig. Danach erscheint dein Achievement mit dem Zwischenstand.');return;}if(e.data==='station1-complete'){station1Complete=true;completed.add(1);updateLocks();return;}if(/^station[2345]-complete$/.test(e.data)){const st=Number(e.data[7]);completed.add(st);if(st===5)award(5,null);return;}if(/^go[12345]$/.test(e.data)){const target=e.data.slice(-1);const current=(location.hash.match(/^#station([12345])$/)||[])[1];if(current&&Number(target)>Number(current))award(Number(current),target);else show(target);}else if(e.data==='home')show('home')});\nupdateLocks();const match=location.hash.match(/^#station([12345])$/);if(match)show(match[1]);else show('home');\n\u003c/script>\u003c/body>\u003c/html>"};

</script>
<script>
/* ===== Unser verbessertes Modul 3 ===== */
window.KIFS_MODULE_HTML["m3"] = `<!doctype html>
<html lang="de">
<head><base href="about:srcdoc">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KI-Führerschein · Modul 3 – Kennzeichnung & Datenschutz</title>
<style>
:root{--blue:#063b81;--blue-dark:#00295f;--sky:#3c9dd7;--ink:#17243b;--muted:#4a5a70;--line:#d5e0ee;--paper:#f4f8fd;--pale:#eef5fc;
  --ok:#2b7a26;--ok-bg:#e6f5e4;--bad:#c0262d;--bad-bg:#fdeaea;--warn:#8a5a00;--warn-bg:#fff4dc;--gold:#ffb225;--red:#d0121a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 'Fira Sans',system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px 18px 50px}
.mission-header{background:linear-gradient(135deg,#00295f,#063b81 60%,#1d6fb8);color:#fff;border-radius:18px;padding:24px 26px;margin-bottom:20px}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:8px}
.mission-header h1{margin:0 0 6px;font-size:clamp(24px,4vw,34px);line-height:1.15}
.mission-header p{margin:0;color:rgba(255,255,255,.85)}
.prog-label{display:flex;justify-content:space-between;margin:16px 0 6px;font-size:13px;color:rgba(255,255,255,.75)}
.progress-track{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.mnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.mnav button{font:inherit;font-size:14px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.mnav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.mnav button.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.mnav button.locked{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px;box-shadow:0 4px 14px rgba(6,59,129,.06)}
.card h2{font-size:22px;color:var(--blue-dark);margin-bottom:10px}
.lead{font-size:18px;margin-bottom:16px;color:var(--muted)}
.box-info{background:var(--pale);border-left:4px solid var(--sky);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px}
.box-warning{background:var(--warn-bg);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px}
.box-memory{background:#f0fdf4;border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px;font-weight:700}
.box-task{background:#fff8e6;border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px}
.merksatz{background:#fffbeb;border:2px solid var(--gold);border-left:6px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 16px;margin:12px 0}
.merksatz::before{content:"📋 Auf Arbeitsblatt übertragen!";display:block;font-size:11px;font-weight:800;color:#92400e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.merksatz p{font-weight:700;color:#78350f;line-height:1.5;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;border:none;border-radius:999px;padding:11px 20px;cursor:pointer;font-size:16px;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
.btn-xp{background:var(--gold);color:#17243b}
.btn-success{background:var(--ok);color:#fff}
.btn-ghost{background:#fff;color:var(--blue);border:2px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions.bottom{margin-top:24px}
input.f,textarea.f{width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:16px;margin-bottom:8px}
input.f:focus,textarea.f:focus{border-color:var(--sky);outline:none}
textarea.f{resize:vertical}
.option{display:flex;align-items:flex-start;gap:10px;padding:12px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:15px}
.option input{margin-top:2px;width:18px;height:18px;flex-shrink:0}
.feedback{border-radius:10px;padding:10px 14px;margin-top:8px;font-weight:700;font-size:15px}
.feedback.correct{background:var(--ok-bg);color:var(--ok)}
.feedback.wrong{background:var(--bad-bg);color:var(--bad)}
.done-badge{display:inline-flex;align-items:center;gap:6px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px;margin:8px 0}
.phone{background:#1a1a2e;border-radius:20px;padding:12px;max-width:320px;margin:12px auto}
.phone-hdr{background:#1a1a2e;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:800}
.phone-body{height:220px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#0d0d1a;border-radius:0 0 12px 12px}
.bub-ben{background:#2859d8;color:#fff;border-radius:12px 12px 3px 12px;padding:8px 12px;align-self:flex-end;max-width:85%;font-size:13px}
.bub-ki{background:#1e1e3a;color:#fff;border-radius:12px 12px 12px 3px;padding:8px 12px;max-width:85%;font-size:13px}
.clue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.clue-card{border:2px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:#fff;transition:all .2s}
.clue-card.found{border-color:var(--ok);background:var(--ok-bg)}
.clue-card:hover:not(.found){border-color:var(--sky)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.overlay[hidden]{display:none}
.popup{background:#fff;border-radius:24px;padding:28px 26px 24px;text-align:center;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.popup .icon{font-size:3.5rem;margin-bottom:12px}
.popup .kicker{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.popup h2{font-size:24px;margin:4px 0 16px;color:var(--blue-dark)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mission-header">
    <div class="eyebrow">KI-Führerschein · Modul 3</div>
    <h1>🛡️ Kennzeichnung & Datenschutz</h1>
    <p>Ben plant eine Party · Digitale Privatsphäre · Kennzeichnungspflicht</p>
    <div class="prog-label"><span>Fortschritt</span><span id="progText">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <nav class="mnav" id="mnav" aria-label="Missionen"></nav>
  <main id="main" aria-live="polite"></main>
  <div class="actions bottom" id="bottom"></div>
</div>

<div class="overlay" id="achOverlay" role="dialog" aria-modal="true" aria-labelledby="achTitle" hidden>
  <div class="popup">
    <div class="icon">🛡️</div>
    <div class="kicker">Achievement freigeschaltet!</div>
    <h2 id="achTitle">KI-Verantwortliche:r</h2>
    <button type="button" class="btn btn-xp" id="achClose">Weiter →</button>
  </div>
</div>

<script>
(function(){'use strict';
var STORAGE_KEY='ki_m03_v4';
var MISSIONS=[
  {n:1,title:'Ben-Chat',icon:'💬'},
  {n:2,title:'Ermittlungsakte',icon:'🔍'},
  {n:3,title:'Konsequenzen',icon:'⚠️'},
  {n:4,title:'KI als Freund?',icon:'🤖'},
  {n:5,title:'Filmstation',icon:'🎬'},
  {n:6,title:'Kennzeichnung',icon:'🏷️'},
  {n:7,title:'Datenschutz',icon:'🔒'},
  {n:8,title:'Abschluss',icon:'🏆'}
];
var BEN_MSGS=[
  {w:'Ben',t:'Hey, ich werde nächste Woche 13! Hilfst du mir bei meiner Geburtstagsparty?'},
  {w:'KI',t:'Klar! Was hast du vor?'},
  {w:'Ben',t:'Wir feiern bei uns in der Lindenstraße 18 in Berlin. Wir haben einen großen Garten.'},
  {w:'Ben',t:'Ich gehe auf die Sonnenberg-Schule, in die 7b. Meine Freunde kommen direkt nach der Schule.'},
  {w:'KI',t:'Klingt gut! Wie viele Gäste kommen?'},
  {w:'Ben',t:'Ungefähr zwölf. Meine Eltern sind freitags bis 19 Uhr arbeiten, also muss ich vorher alles vorbereiten.'},
  {w:'Ben',t:'Hier ist noch ein Foto von unserem Haus und Garten. Kannst du Dekorationen vorschlagen?'}
];
var HUMAN_MSGS=[
  {w:'Ben',t:'Übrigens, ich habe mich heute mit meinem besten Freund gestritten. Jetzt bin ich total traurig.'},
  {w:'KI',t:'Das klingt wirklich schwierig. Möchtest du mir erzählen, was passiert ist?'},
  {w:'Ben',t:'Vielleicht … Er hat etwas Peinliches über mich weitererzählt.'},
  {w:'KI',t:'Du kannst mir mehr davon erzählen, wenn du möchtest.'}
];
var CLUES=[
  {icon:'📍',label:'Wohnort',desc:'Lindenstraße 18, Berlin'},
  {icon:'🏫',label:'Schule',desc:'Sonnenberg-Schule, Klasse 7b'},
  {icon:'🕖',label:'Tagesablauf',desc:'Eltern freitags bis 19 Uhr weg'},
  {icon:'🎂',label:'Alter',desc:'Bald 13 Jahre alt'},
  {icon:'🏠',label:'Haus',desc:'Foto von Haus und Garten'}
];
var CONSEQUENCES=[
  {q:'Eine fremde Person kennt Bens Adresse und weiß, wann seine Eltern nicht da sind. Welche Information macht das möglich?',
   opts:['Nur die Anzahl seiner Gäste.','Die Kombination aus Adresse und Tagesablauf.'],c:1,
   ex:'Genau! Verschiedene Angaben zusammen können Rückschlüsse auf Bens Aufenthaltsort ermöglichen.'},
  {q:'Jemand erstellt ein falsches Profil mit Bens Namen und seinem Hausfoto. Warum könnte das glaubwürdig wirken?',
   opts:['Weil persönliche Details und Bilder eine falsche Identität überzeugender machen können.','Weil jedes Foto automatisch öffentlich ist.'],c:0,
   ex:'Richtig. Persönliche Angaben können für Identitätsmissbrauch genutzt werden.'},
  {q:'Ein Screenshot von Bens Chat landet in einer Klassengruppe. Was wäre jetzt eine gute Reaktion?',
   opts:['Weiterleiten, damit alle Bescheid wissen.','Nicht weiterverbreiten, Ben informieren und bei Bedarf Hilfe holen.'],c:1,
   ex:'Genau. Private Informationen gehören nicht ohne Erlaubnis weitergegeben.'}
];
var KP_QUIZ=[
  {id:'kp1',q:'Du schreibst ein Referat und nutzt KI für eine Zusammenfassung. Musst du das kennzeichnen?',
   opts:['Ja, wenn die Schule es verlangt','Nein, das ist nicht nötig','Nur wenn der Text länger als eine Seite ist'],ans:0,
   explain:'Richtig! Wenn die Schule KI-Nutzung kennzeichnen lässt, ist das Pflicht.'},
  {id:'kp2',q:'Du lässt eine KI dein Referat komplett schreiben und gibst es ohne Kennzeichnung ab. Ist das in Ordnung?',
   opts:['Ja, das ist erlaubt','Nein, das ist nicht in Ordnung','Kommt auf die Lehrkraft an'],ans:1,
   explain:'Richtig! KI-generierte Inhalte als eigene Arbeit auszugeben ist unehrlich.'},
  {id:'kp3',q:'Du nutzt KI, um Ideen zu sammeln, und formulierst dann selbst. Musst du kennzeichnen?',
   opts:['Immer – auch wenn ich selbst formuliert habe','Das kommt auf die Schulregeln an','Nie – weil ich selbst geschrieben habe'],ans:1,
   explain:'Richtig! Es kommt auf die Schulregeln an. Im Zweifel: kennzeichnen.'}
];
var DS_SCENARIOS=[
  {id:'ds1',text:'Du gibst deinen vollen Namen und deine Adresse in eine KI ein.',correct:'nein',explain:'Persönliche Daten wie Name und Adresse nicht in KI eingeben!'},
  {id:'ds2',text:'Du fragst eine KI: „Erkläre mir, wie Photosynthese funktioniert."',correct:'ja',explain:'Unbedenklich – keine persönlichen Daten enthalten.'},
  {id:'ds3',text:'Du gibst Informationen über eine Mitschülerin in eine KI ein.',correct:'nein',explain:'Daten anderer Personen nicht ohne Einwilligung weitergeben!'},
  {id:'ds4',text:'Du nutzt eine KI, um Vokabeln zu üben.',correct:'ja',explain:'Kein Problem – keine persönlichen Daten beteiligt.'}
];

function loadState(){try{var r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r)}catch(e){}
  return{done:{},mission:1,clues:[],conAnswers:{},conChecked:{},privBefore:'',footBefore:''}}
function saveState(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch(e){}}

var state=loadState();

function update(u){Object.assign(state,u);saveState(state);render()}
function markDone(id,extra){state.done[id]=true;if(extra)Object.assign(state,extra);saveState(state);render()}
function goMission(n){update({mission:n});window.scrollTo(0,0)}

function render(){
  var done=state.done,m=state.mission;
  var total=MISSIONS.length;
  var doneCount=Object.keys(done).length;
  var pct=Math.round(doneCount/total*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progText').textContent=pct+'%';

  // Nav
  var nav=document.getElementById('mnav');
  nav.innerHTML=MISSIONS.map(function(mi){
    var isDone=!!done['m'+mi.n];
    var isCurrent=m===mi.n;
    var isLocked=mi.n>1&&!done['m'+(mi.n-1)];
    var cls=isDone?'done':isCurrent?'active':isLocked?'locked':'';
    return '<button type="button" class="'+cls+'" '+(isLocked?'disabled':'')+' onclick="goMission('+mi.n+')">'+(isDone?'✓ ':'')+mi.icon+' '+mi.title+'</button>';
  }).join('');

  // Content
  var main=document.getElementById('main');
  var bottom=document.getElementById('bottom');
  bottom.innerHTML='';

  if(m===1) renderBenChat(main,bottom,done);
  else if(m===2) renderErmittlung(main,bottom,done);
  else if(m===3) renderKonsequenzen(main,bottom,done);
  else if(m===4) renderKIFreund(main,bottom,done);
  else if(m===5) renderFilm(main,bottom,done);
  else if(m===6) renderKennzeichnung(main,bottom,done);
  else if(m===7) renderDatenschutz(main,bottom,done);
  else if(m===8) renderAbschluss(main,bottom,done);
}

// ── Mission 1: Ben-Chat ──────────────────────────────────────────────────────
function renderBenChat(main,bottom,done){
  var ch=BEN_MSGS.map(function(m){
    return '<div class="'+( m.w==='Ben'?'bub-ben':'bub-ki')+'">'+m.t+'</div>';
  }).join('');
  main.innerHTML='<div class="card"><h2>💬 Ben plant eine Party</h2>'+
    '<p class="lead">Schau Ben über die Schulter. <strong>Achte darauf, was Ben nebenbei über sich verrät.</strong></p>'+
    '<div class="phone"><div class="phone-hdr"><span style="font-size:18px;">🤖</span> KI-Assistent · Online</div>'+
    '<div class="phone-body">'+ch+'</div></div>'+
    '<div style="background:#fef2f2;border:2px solid #fca5a5;border-radius:10px;padding:14px;margin:12px 0;">'+
    '<strong style="color:#991b1b;">Was hat Ben verraten?</strong><br>'+
    '📍 Adresse: Lindenstraße 18, Berlin<br>🏫 Schule: Sonnenberg-Schule, Klasse 7b<br>'+
    '🕖 Tagesablauf: Eltern freitags bis 19 Uhr weg<br>🎂 Alter: Bald 13 Jahre<br>🏠 Foto von Haus und Garten'+
    '</div>'+
    '<div class="merksatz"><p>Einzelne Informationen wirken harmlos. Zusammen können sie verraten, wo du wohnst, wann du allein bist und wie man dich findet.</p></div>'+
    (done['m1']?'<div class="done-badge">✓ Mission 1 abgeschlossen</div>':'')+'</div>';
  if(!done['m1'])bottom.innerHTML='<button class="btn btn-xp" onclick="markDone('m1');goMission(2)">Jetzt Daten-Detektiv werden →</button>';
  else bottom.innerHTML='<button class="btn btn-ghost" onclick="goMission(2)">Weiter →</button>';
}

// ── Mission 2: Ermittlungsakte ───────────────────────────────────────────────
function renderErmittlung(main,bottom,done){
  var found=state.clues||[];
  var clueHtml=CLUES.map(function(c){
    var isFnd=found.indexOf(c.label)>=0;
    return '<div class="clue-card'+(isFnd?' found':'')+'" onclick="findClue(''+c.label+'')">'+
      '<div style="font-size:28px;margin-bottom:4px;">'+c.icon+'</div>'+
      '<div style="font-weight:800;font-size:14px;">'+c.label+'</div>'+
      (isFnd?'<div style="font-size:12px;color:#2b7a26;margin-top:2px;">'+c.desc+'</div>':'<div style="font-size:11px;color:#9aa9bf;margin-top:4px;">👆 Aufdecken</div>')+
      '</div>';
  }).join('');
  var pct=Math.round(found.length/CLUES.length*100);
  main.innerHTML='<div class="card"><h2>🔍 Deine Ermittlungsakte</h2>'+
    '<div class="box-task"><strong>Aufgabe:</strong> Welche Informationen über Ben könnte eine unbefugte Person herausfinden? <strong>Klicke alle fünf Spuren an.</strong></div>'+
    '<div class="clue-grid">'+clueHtml+'</div>'+
    '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px;"><span>'+found.length+' von 5 Spuren entdeckt</span><span>'+pct+'%</span></div>'+
    '<div class="progress-track" style="background:#e5edf5;"><div class="progress-fill" style="width:'+pct+'%;background:#d0121a;"></div></div></div>'+
    (found.length>=5?'<div class="box-info">💡 Aus vielen kleinen Angaben entsteht ein erstaunlich genaues Bild von Ben.</div>'+
    '<div class="merksatz"><p>Einzelne Informationen wirken harmlos. Zusammen können sie verraten, wo du wohnst, wann du allein bist und wie man dich findet.</p></div>':'')+
    (done['m2']?'<div class="done-badge">✓ Mission 2 abgeschlossen</div>':'')+'</div>';
  if(found.length>=5&&!done['m2'])bottom.innerHTML='<button class="btn btn-xp" onclick="markDone('m2');goMission(3)">Weiter: Welche Folgen könnte das haben? →</button>';
  else if(done['m2'])bottom.innerHTML='<button class="btn btn-ghost" onclick="goMission(3)">Weiter →</button>';
}
function findClue(label){
  var f=state.clues||[];
  if(f.indexOf(label)<0){f.push(label);state.clues=f;saveState(state);render()}
}

// ── Mission 3: Konsequenzen ──────────────────────────────────────────────────
function renderKonsequenzen(main,bottom,done){
  var ans=state.conAnswers||{},chk=state.conChecked||{};
  var html='<div class="card"><h2>⚠️ Ein Klick, viele Folgen</h2>'+
    '<p class="lead">Entscheide bei drei möglichen Situationen, warum Bens Daten problematisch werden könnten.</p>';
  var allDone=true;
  CONSEQUENCES.forEach(function(c,i){
    var k='c'+i,a=ans[k];
    if(a===undefined)allDone=false;
    var bc=a!==undefined?(a===c.c?'#4ade80':'#fca5a5'):'#d5e0ee';
    var bg=a!==undefined?(a===c.c?'#e6f5e4':'#fdeaea'):'white';
    html+='<div style="border:2px solid '+bc+';border-radius:10px;padding:12px;margin-bottom:8px;background:'+bg+';">'+
      '<p style="margin-bottom:8px;font-weight:600;">'+c.q+'</p>';
    c.opts.forEach(function(opt,j){
      html+='<label class="option"><input type="radio" name="con'+i+'" value="'+j+'"'+(a===j?' checked':'')+' onchange="setConAns('+i+','+j+')"> '+opt+'</label>';
    });
    if(a!==undefined)html+='<div class="feedback '+(a===c.c?'correct':'wrong')+'">'+(a===c.c?'✅':'❌')+' '+c.ex+'</div>';
    html+='</div>';
  });
  if(allDone)html+='<div class="merksatz"><p>Einzelne Informationen wirken harmlos. Zusammen können sie verraten, wo du wohnst, wann du allein bist und wie man dich findet.</p></div>';
  if(done['m3'])html+='<div class="done-badge">✓ Mission 3 abgeschlossen</div>';
  html+='</div>';
  main.innerHTML=html;
  if(allDone&&!done['m3'])bottom.innerHTML='<button class="btn btn-xp" onclick="markDone('m3');goMission(4)">Weiter →</button>';
  else if(done['m3'])bottom.innerHTML='<button class="btn btn-ghost" onclick="goMission(4)">Weiter →</button>';
}
function setConAns(i,j){var a=state.conAnswers||{};a['c'+i]=j;state.conAnswers=a;saveState(state);render()}

// ── Mission 4: KI als Freund? ────────────────────────────────────────────────
function renderKIFreund(main,bottom,done){
  var hm=[
    {w:'Ben',t:'Übrigens, ich habe mich heute mit meinem besten Freund gestritten. Jetzt bin ich total traurig.'},
    {w:'KI',t:'Das klingt wirklich schwierig. Möchtest du mir erzählen, was passiert ist?'},
    {w:'Ben',t:'Vielleicht … Er hat etwas Peinliches über mich weitererzählt.'},
    {w:'KI',t:'Du kannst mir mehr davon erzählen, wenn du möchtest.'}
  ];
  var ch=hm.map(function(m){return '<div class="'+(m.w==='Ben'?'bub-ben':'bub-ki')+'">'+m.t+'</div>';}).join('');
  main.innerHTML='<div class="card"><h2>🤖 Die KI fragt weiter …</h2>'+
    '<p class="lead">Nach der Detektivarbeit schauen wir noch einmal auf Bens Handy.</p>'+
    '<div class="phone"><div class="phone-hdr"><span style="font-size:18px;">🤖</span> KI-Assistent · Online</div>'+
    '<div class="phone-body">'+ch+'</div></div>'+
    '<div style="background:#fef2f2;border:2px solid #fca5a5;border-radius:10px;padding:14px;margin:12px 0;">'+
    '<h3 style="color:#991b1b;margin-bottom:6px;">🤖 Klingt wie ein Freund – ist aber keiner!</h3>'+
    '<p style="font-size:14px;color:#7f1d1d;">Eine KI kann freundlich antworten und immer weitere Fragen stellen. Aber sie ist kein Mensch: Sie hat keine eigenen Gefühle und kann menschliches Mitgefühl nicht ersetzen. Wenn dich etwas belastet, sprich mit Freunden, Familie oder einer Vertrauensperson.</p>'+
    '</div>'+
    '<div class="merksatz"><p>Eine KI kann wie ein Freund schreiben. Sie ist aber kein Mensch und kein Ersatz für echte Vertrauenspersonen.</p></div>'+
    (done['m4']?'<div class="done-badge">✓ Mission 4 abgeschlossen</div>':'')+'</div>';
  if(!done['m4'])bottom.innerHTML='<button class="btn btn-xp" onclick="markDone('m4');goMission(5)">Weiter zur Filmstation →</button>';
  else bottom.innerHTML='<button class="btn btn-ghost" onclick="goMission(5)">Weiter →</button>';
}

// ── Mission 5: Filmstation ───────────────────────────────────────────────────
function renderFilm(main,bottom,done){
  var pb=state.privBefore||'',fb=state.footBefore||'';
  main.innerHTML='<div class="card"><h2>🎬 Filmstation: Deine Spuren im Netz</h2>'+
    '<div class="box-info"><strong>Dein Lernweg:</strong> ① Vorwissen aufschreiben → ② Film ansehen → ③ Gedanken ergänzen</div>'+
    '<label style="font-weight:700;display:block;margin:8px 0 4px;">Was bedeutet für dich digitale Privatsphäre?</label>'+
    '<textarea class="f" id="privBefore" rows="2" placeholder="Ich denke, digitale Privatsphäre bedeutet, dass …">'+pb+'</textarea>'+
    '<label style="font-weight:700;display:block;margin:8px 0 4px;">Was verstehst du unter einem digitalen Fußabdruck?</label>'+
    '<textarea class="f" id="footBefore" rows="2" placeholder="Ein digitaler Fußabdruck ist für mich …">'+fb+'</textarea>'+
    '<div style="background:#111827;border-radius:10px;overflow:hidden;margin:12px 0;aspect-ratio:16/9;">'+
    '<video controls style="width:100%;height:100%;display:block;" src="without-consent.mp4">'+
    '<p style="color:white;padding:16px;">Video nicht verfügbar.</p></video></div>'+
    '<div class="merksatz"><p>Deine Bilder und Informationen gehören zu deiner Privatsphäre. Digitale Privatsphäre bedeutet, dass du mitbestimmen kannst, wer persönliche Informationen über dich sieht und verwendet.</p></div>'+
    (done['m5']?'<div class="done-badge">✓ Mission 5 abgeschlossen</div>':'')+'</div>';
  if(!done['m5'])bottom.innerHTML='<button class="btn btn-xp" onclick="saveFilm();markDone('m5');goMission(6)">Filmstation abschließen →</button>';
  else bottom.innerHTML='<button class="btn btn-ghost" onclick="goMission(6)">Weiter →</button>';
}
function saveFilm(){
  var pb=document.getElementById('privBefore');var fb=document.getElementById('footBefore');
  if(pb)state.privBefore=pb.value;if(fb)state.footBefore=fb.value;saveState(state);
}

// ── Mission 6: Kennzeichnung ─────────────────────────────────────────────────
function renderKennzeichnung(main,bottom,done){
  var answers=state.kpAnswers||{},feedback=state.kpFeedback||{};
  var allCorrect=KP_QUIZ.every(function(q){return answers[q.id]===q.ans});
  var html='<div class="card"><h2>🏷️ Wann muss ich kennzeichnen?</h2>'+
    '<div class="box-info"><strong>Grundregel:</strong> Wenn du KI-generierte Inhalte verwendest, musst du das in vielen Situationen kenntlich machen.</div>'+
    '<div class="box-info"><strong>Warum?</strong> Andere sollen wissen, ob ein Inhalt von einem Menschen oder einer KI erstellt wurde. Das ist eine Frage der <strong>Ehrlichkeit und Transparenz</strong>.</div>'+
    '<div class="box-warning">KI-generierte Inhalte als eigene Arbeit auszugeben, ohne sie zu kennzeichnen, ist unehrlich – und in der Schule nicht erlaubt.</div>';
  KP_QUIZ.forEach(function(q){
    var a=answers[q.id],fb=feedback[q.id];
    html+='<div style="margin-bottom:16px;padding:16px;background:var(--pale);border-radius:12px;border:2px solid '+(fb==='correct'?'var(--ok)':fb==='wrong'?'var(--bad)':'var(--line)')+';">'+
      '<p style="font-weight:700;margin-bottom:10px;">'+q.q+'</p>';
    q.opts.forEach(function(opt,i){
      html+='<label class="option"><input type="radio" name="'+q.id+'" value="'+i+'"'+(a===i?' checked':'')+' onchange="setKPAns(''+q.id+'','+i+','+q.ans+')"> '+opt+'</label>';
    });

function renderDatenschutz(main,bottom,done){

<script>

(function(){
'use strict';

var app = document.getElementById('app'), top = document.getElementById('topbar'), stage = document.getElementById('modstage');

/* ---------------- Hilfsfunktionen ---------------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* Toast */
var toastEl = document.getElementById('toast'), toastTimer, toastAt = 0;
function toast(icon, title, text, btnLabel, btnHash){

/* ---------------- Belohnung: Konfetti + Stempel ---------------- */
var REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var cv = document.getElementById('confetti'), cx = cv.getContext('2d'), parts = [], running = false;
var CCOL = ['#ffb225','#e70c14','#3aa533','#3c9dd7','#063b81','#ffffff'];
function cvSize(){ var d = window.devicePixelRatio || 1; cv.width = innerWidth*d; cv.height = innerHeight*d; cx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize', cvSize); cvSize();
function burst(o){
  if (REDUCE) return;
  for (var i=0;i<(o.n||140);i++){
    var p = { x:o.x, y:o.y, w:6+Math.random()*7, h:8+Math.random()*10, c:CCOL[i%CCOL.length],
      vx:(o.vx||0)+(Math.random()-.5)*(o.spread||10), vy:(o.vy||0)+(Math.random()-.5)*(o.spread||10)*.6,
      r:Math.random()*6, vr:(Math.random()-.5)*.3, life:0, max:o.max||220, round:Math.random()<.25 };
    if (o.rain){ p.x=Math.random()*innerWidth; p.y=-20-Math.random()*innerHeight*.5; p.vx=(Math.random()-.5)*2; p.vy=2+Math.random()*3; }
    parts.push(p);
  }
  if (!running){ running = true; requestAnimationFrame(confettiLoop); }
}
function confettiLoop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for (var i=parts.length-1;i>=0;i--){ var p = parts[i];
    p.vy+=.18; p.vx*=.99; p.vy*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    if (p.life>p.max || p.y>innerHeight+40){ parts.splice(i,1); continue; }
    cx.save(); cx.globalAlpha=Math.min(1,(p.max-p.life)/40); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    if (p.round){ cx.beginPath(); cx.arc(0,0,p.w/2,0,7); cx.fill(); } else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life/8)));
    cx.restore(); }
  if (parts.length) requestAnimationFrame(confettiLoop); else { running=false; cx.clearRect(0,0,innerWidth,innerHeight); }
}
function cannons(){ burst({x:0,y:innerHeight*.75,vx:14,vy:-15,spread:9,n:110}); burst({x:innerWidth,y:innerHeight*.75,vx:-14,vy:-15,spread:9,n:110}); }
function rain(n){ burst({rain:true,n:n,max:320}); }

/* Feier beim Zurückkehren zur Übersicht (Variante B) */
function celebrate(m){

  toastEl.classList.remove('show');

  var fields = MODS.map(function(x){
    var ok = p[x.id] && p[x.id].passed, isNew = x.key === m.key;

  }).join('');

  el.style.setProperty('--c', m.farbe);

    '<div class="lic shake"><div class="ph">'+esc(initial(s.student.display_name))+'</div><div><small>KI-Führerschein · '+(final?'erteilt':'in Ausbildung')+'</small><b>'+esc(s.student.display_name)+'</b><span class="k">Klasse '+esc(s.cls.name)+'</span></div>'+
    '<div class="fields">'+fields+'</div><div class="bigstamp">'+(final?'Erteilt':'Bestanden')+'</div></div>'+
    '<div class="ptsgain">+'+PPE+' Punkte ⭐</div>'+
    '<h2 id="celTitle">'+(final ? '🎓 Dein KI-Führerschein ist erteilt!' : m.abzeichen.icon+' Abzeichen: '+esc(m.abzeichen.name))+'</h2>'+
    '<p>'+(final ? 'Du hast alle vier Abzeichen gesammelt. Jetzt noch deinen persönlichen Merksatz eintragen!' : esc(m.abzeichen.text))+'</p>'+
    '<div class="acts">'+(final ? '<button class="btn blue" data-go="#/fuehrerschein">Zum Führerschein →</button><button class="btn ghost" data-go="">Später</button>' : '<button class="btn blue" data-go="">Weiter →</button>')+'</div></div>';
  document.body.appendChild(el);

  document.addEventListener('keydown', esc1);

  setTimeout(function(){ rain(final ? 420 : 240); }, 900);
  var now = points(), before = Math.max(0, now - PPE), pt = document.getElementById('ptsTop'), pb = document.getElementById('ptsTopBar');
  if (pt && !REDUCE) { pt.textContent = before; if (pb) pb.style.width = Math.round(before/PMAX*100)+'%'; }

/* ---------------- Server (Supabase) – optional ---------------- */
var sb = null;

  try { sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey); } catch(e){ sb = null; }
}
var REMOTE = !!sb;
function sha256(text){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'x'+Date.now()+Math.random().toString(16).slice(2)); }

var Remote = {
  /* Schüler-Anmeldung – gleiche Logik wie auth.js der Pfeiffer-Plattform */
  join: async function(code, name){
    if (!navigator.onLine) return { error:'Kein Internet. Bitte zuerst online anmelden.' };
    code = code.toUpperCase().trim(); name = name.trim();

  },
  upsert: function(studentId, moduleId, data){

      .then(function(r){ return !r.error; }, function(){ return false; });
  },
  load: function(studentId){
    return sb.from('student_module_progress').select('*').eq('student_id', studentId)
      .then(function(r){ return r.data || []; }, function(){ return []; });
  },
  deleteStudent: async function(studentId){

  /* Lehrkraft-Anmeldung – gleiche Logik wie auth.js der Pfeiffer-Plattform */
  teacherLogin: async function(username, password){

  classes: function(t){

/* ---------------- Sitzung & Fortschritt ---------------- */
// Speicherschlüssel der Originalmodule + persönlicher Merksatz (werden beim Abmelden
// im Profil gesichert und geleert, damit am selben PC niemand fremde Antworten sieht)
var MODULE_STORE_KEYS = ['kiModuleState', 'ki_m03_v3', 'kifs_m1_state', 'kifs_m4_state', 'kifs_merksatz'];
var MERKSATZ_MAX = 200;
function merksatz(){ return LS.raw('kifs_merksatz') || ''; }
function session(){ return LS.get('kifs_session'); }
function progress(){ return LS.get('kifs_progress') || {}; }
function saveProgress(p){ LS.set('kifs_progress', p); }
function profileId(s){ return s.mode === 'remote' ? 'r:' + s.student.id : 'l:' + (s.student.display_name + '|' + s.cls.name).toLowerCase(); }
function passedCount(){ var p = progress(); return MODS.filter(function(m){ return p[m.id] && p[m.id].passed; }).length; }
function allPassed(){ return passedCount() === MODS.length; }
var PPE = CFG.punkteProEtappe || 250, PMAX = PPE * MODS.length;
function points(){ return passedCount() * PPE; }
function ptsChip(id){
  var pts = points(), pct = Math.round(pts / PMAX * 100);
  return '<span class="pts" title="Punkte: '+pts+' von '+PMAX+'"><span class="star">⭐</span><span class="pn"><b id="'+id+'">'+pts+'</b> / '+PMAX+' Punkte</span>'+
    '<span class="pbar"><i id="'+id+'Bar" style="width:'+pct+'%"></i></span></span>';
