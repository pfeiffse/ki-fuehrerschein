function countUp(id, from, to){
  var el = document.getElementById(id), bar = document.getElementById(id + 'Bar'); if (!el) return;
  if (REDUCE) { el.textContent = to; if (bar) bar.style.width = Math.round(to/PMAX*100)+'%'; return; }
  el.textContent = from; if (bar) bar.style.width = Math.round(from/PMAX*100)+'%';
  var t0 = null;
  function step(t){ if (!t0) t0 = t; var k = Math.min(1, (t - t0) / 1200), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = v; if (bar) bar.style.width = (v/PMAX*100)+'%';
    if (k < 1) requestAnimationFrame(step); else el.parentNode.parentNode.classList.add('bump'); }
  requestAnimationFrame(step);

function lernwegHtml(){
  var L = CFG.lernweg || []; if (!L.length) return '';
  var done = allPassed() && session();
  return '<h2 class="sec">Dein Lernweg bis Klasse 10</h2><ol class="grades">'+L.map(function(g){
    var st = g.verfuegbar ? (done ? '<span class="gs ok">✓ KI-Führerschein</span>' : '<span class="gs now">Jetzt: KI-Führerschein</span>') : '<span class="gs">🔒 In Entwicklung</span>';
    return '<li class="grade'+(g.verfuegbar?' now':'')+'"><span class="gi">'+g.icon+'</span><div><span class="gk">Klasse '+g.klasse+'</span><b>'+esc(g.titel)+'</b><span class="gu">'+esc(g.unter)+'</span>'+st+'</div></li>';
  }).join('')+'</ol>';
}
function status(m){ var p = progress()[m.id]; return p ? (p.passed ? 'passed' : 'in_progress') : 'not_started'; }
function isUnlocked(m){
  if (!CFG.reihenfolgePflicht) return true;
  var i = MODS.indexOf(m); if (i <= 0) return true;
  return status(MODS[i-1]) === 'passed' || status(m) !== 'not_started';
}

function startSession(s){
  LS.set('kifs_session', s);
  var profiles = LS.get('kifs_profiles') || {}, prof = profiles[profileId(s)];
  saveProgress(prof ? prof.progress : {});
  MODULE_STORE_KEYS.forEach(function(k){ LS.del(k); if (prof && prof.store && prof.store[k] != null) LS.setRaw(k, prof.store[k]); });
  if (REMOTE && s.mode === 'remote') syncFromServer();
}
function endSession(){
  var s = session();
  if (s) {
    var profiles = LS.get('kifs_profiles') || {}, store = {};
    MODULE_STORE_KEYS.forEach(function(k){ var v = LS.raw(k); if (v != null) store[k] = v; });
    profiles[profileId(s)] = { name: s.student.display_name, cls: s.cls.name, progress: progress(), store: store, saved: new Date().toISOString() };
    LS.set('kifs_profiles', profiles);
  }
  ['kifs_session','kifs_progress','kifs_new'].forEach(LS.del);
  MODULE_STORE_KEYS.forEach(LS.del);
  // Module mit ihrem Bearbeitungsstand im Arbeitsspeicher schließen
  Array.prototype.slice.call(stage.querySelectorAll('iframe')).forEach(function(f){ f.remove(); });
}
function syncFromServer(){
  var s = session(); if (!REMOTE || !s || s.mode !== 'remote') return Promise.resolve();
  return Remote.load(s.student.id).then(function(rows){
    var p = progress(), changed = false;
    rows.forEach(function(r){
      var cur = p[r.module_id];
      if (!cur || (r.passed && !cur.passed)) { p[r.module_id] = { status:r.status, passed:!!r.passed, score:r.score, started_at:r.started_at, completed_at:r.completed_at, synced:true }; changed = true; }
    });
    // noch nicht übertragene Einträge nachreichen
    Object.keys(p).forEach(function(id){ if (!p[id].synced) pushProgress(id); });
    if (changed) { saveProgress(p); if (/^#\/(uebersicht)?$/.test(location.hash) || location.hash === '') route(); }
  });
}
function pushProgress(moduleId){
  var s = session(); if (!REMOTE || !s || s.mode !== 'remote') return;
  var e = progress()[moduleId]; if (!e) return;
  Remote.upsert(s.student.id, moduleId, { status:e.passed ? 'passed' : 'in_progress', passed:!!e.passed, score:e.score||0, max_score:100, started_at:e.started_at, completed_at:e.completed_at || null })
    .then(function(ok){ if (ok) { var p = progress(); if (p[moduleId]) { p[moduleId].synced = true; saveProgress(p); } } });
}
function markStarted(m){
  var p = progress(); if (p[m.id]) return;
  p[m.id] = { status:'in_progress', passed:false, score:0, started_at:new Date().toISOString() };
  saveProgress(p); pushProgress(m.id);
}
function markPassed(m, score){
  var p = progress(); if (p[m.id] && p[m.id].passed) return;
  p[m.id] = Object.assign({ started_at:new Date().toISOString() }, p[m.id] || {}, { status:'passed', passed:true, score:score || 100, completed_at:new Date().toISOString(), synced:false });
  saveProgress(p); LS.set('kifs_new', m.key); pushProgress(m.id);
  var last = allPassed();
  toast('🎉', last ? 'Alle vier Etappen geschafft!' : 'Etappe ' + m.nr + ' bestanden!',
    last ? 'Auf der Übersicht wird dein KI-Führerschein erteilt.' : 'Auf der Übersicht wartet dein Abzeichen.',
    'Zur Übersicht', '#/uebersicht');
}

    '<div class="tblwrap"><table class="tbl"><thead><tr><th>Etappe</th><th>Status</th><th>Bestanden am</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h2>Herunterladen</h2><button class="btn ghost" id="dlBtn">📥 Daten als Datei speichern</button></div>'+
    '<div class="card"><h2>Löschen</h2><p class="muted">Löscht deinen Namen, deinen Fortschritt und deine Antworten in den Modulen'+(s.mode==='remote'?' – auch auf dem Server':'')+'. Das kann nicht rückgängig gemacht werden.</p><button class="btn danger" id="delBtn">🗑️ Alle meine Daten löschen</button><div id="delMsg"></div></div>'+
    '<a class="btn ghost" href="#/uebersicht">← Zur Übersicht</a></div>';
  document.getElementById('dlBtn').onclick = function(){
    var data = { exportiert:new Date().toISOString(), name:s.student.display_name, klasse:s.cls.name, fortschritt:progress(), merksatz:merksatz() };
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], { type:'application/json' }));
    a.download = 'ki-fuehrerschein-meine-daten.json'; a.click();
  };
  document.getElementById('delBtn').onclick = async function(){
    if (!confirm('Wirklich alle deine Daten löschen?')) return;
    if (s.mode === 'remote') { var ok = false; try { ok = await Remote.deleteStudent(s.student.id); } catch(e){}
      if (!ok) { document.getElementById('delMsg').innerHTML = '<div class="err">Löschen auf dem Server hat nicht geklappt. Bitte die Lehrkraft fragen.</div>'; return; } LS.del('ki_token'); }
    var profiles = LS.get('kifs_profiles') || {}; delete profiles[profileId(s)]; LS.set('kifs_profiles', profiles);
    ['kifs_session','kifs_progress','kifs_new'].forEach(LS.del); MODULE_STORE_KEYS.forEach(LS.del);
    Array.prototype.slice.call(stage.querySelectorAll('iframe')).forEach(function(f){ f.remove(); });
    go('#/');
  };
}

/* ---------------- Lehrkraft-Bereich ---------------- */
var tState = { classes:[], sel:null, detail:null };
function viewTeacher(){
  showApp();
  if (!REMOTE) {
    app.innerHTML = '<div class="page container" style="max-width:820px"><h1 style="color:var(--navy);margin-bottom:16px">👩‍🏫 Lehrkraft-Bereich</h1>'+
      '<div class="card"><h2>Noch nicht mit dem Server verbunden</h2><p>Diese Fassung läuft im <b>Offline-Modus</b>: Der Fortschritt bleibt auf dem jeweiligen Gerät, eine Klassenübersicht ist deshalb nicht möglich.</p>'+
      '<p>Für Klassencodes, Fortschrittsübersicht und CSV-Export muss in <code>src/config.js</code> die Server-Adresse eingetragen und das Paket neu gebaut werden (siehe Anleitung im Ordner <i>Gesamtpaket</i>).</p></div><a class="btn ghost" href="#/">← Zurück</a></div>';
    return;
  }
  var t = LS.get('kifs_teacher');
  if (!t) {
    app.innerHTML = '<div class="page container" style="max-width:480px"><form class="card" id="tForm"><h2>👩‍🏫 Lehrkraft-Anmeldung</h2>'+
      '<label class="f" for="tu">Benutzername</label><input class="f" id="tu" autocomplete="username">'+
      '<label class="f" for="tp">Passwort</label><input class="f" id="tp" type="password" autocomplete="current-password"><div id="tErr"></div>'+
      '<div style="margin-top:16px;display:flex;gap:10px"><button class="btn blue" type="submit">Anmelden</button><a class="btn ghost" href="#/">Abbrechen</a></div></form></div>';
    document.getElementById('tForm').onsubmit = async function(ev){
      ev.preventDefault();
      var r; try { r = await Remote.teacherLogin(document.getElementById('tu').value, document.getElementById('tp').value); } catch(e){ r = { error:'Verbindungsfehler.' }; }
      if (r.error) { document.getElementById('tErr').innerHTML = '<div class="err">'+esc(r.error)+'</div>'; return; }
      LS.set('kifs_teacher', r.teacher); tState = { classes:[], sel:null, detail:null }; route();
    };
    return;
  }
  renderTeacher(t);
  Remote.classes(t).then(function(c){ tState.classes = c; renderTeacher(t); });
}
function renderTeacher(t){
  var list = tState.classes.map(function(c){ return '<button class="classitem'+(tState.sel===c.id?' on':'')+'" data-cid="'+c.id+'"><b>'+esc(c.name)+'</b><span class="muted">Jahrgang '+esc(c.grade)+' · Code '+esc(c.join_code)+'</span></button>'; }).join('') || '<p class="muted">Noch keine Klassen angelegt.</p>';
  var detail = '';
  if (tState.sel) {
    var c = tState.classes.filter(function(x){ return x.id === tState.sel; })[0], d = tState.detail;
    if (!d) detail = '<div class="card"><p class="muted">Lade …</p></div>';
    else {
      var rows = d.students.map(function(st){
        var cells = MODS.map(function(m){ var p = d.progress.filter(function(x){ return x.student_id === st.id && x.module_id === m.id; })[0];
          return '<td class="c" title="'+(p&&p.completed_at?fmtDate(p.completed_at):'')+'">'+(p ? (p.passed ? '✅' : '🟡') : '–')+'</td>'; }).join('');
        var n = d.progress.filter(function(x){ return x.student_id === st.id && x.passed; }).length;
        return '<tr><td>'+esc(st.display_name)+'</td>'+cells+'<td class="c">'+(n===MODS.length?'🎓':n+'/'+MODS.length)+'</td></tr>';
      }).join('') || '<tr><td colspan="'+(MODS.length+2)+'" class="muted">Noch niemand angemeldet. Code an die Klasse weitergeben: <b>'+esc(c.join_code)+'</b></td></tr>';
      detail = '<div class="card"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">Klasse '+esc(c.name)+'</h2><span class="muted">Klassencode für die Anmeldung</span></div><span class="code">'+esc(c.join_code)+'</span>'+
        '<div style="margin-left:auto;display:flex;gap:8px"><button class="btn ghost small" id="refBtn">↻ Aktualisieren</button><button class="btn ghost small" id="csvBtn">📥 CSV</button></div></div>'+
        '<div class="tblwrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Name</th>'+MODS.map(function(m){ return '<th class="c" title="'+esc(m.titel)+'">M'+m.nr+'</th>'; }).join('')+'<th class="c">Führerschein</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '<p class="hint">✅ bestanden · 🟡 begonnen · – noch nicht begonnen</p></div>';
    }
  }
  app.innerHTML = '<div class="page container"><h1 style="color:var(--navy);margin-bottom:16px">👩‍🏫 Lehrkraft-Bereich</h1>'+
    '<div class="grid2"><div class="card"><h2>Meine Klassen</h2><div class="classlist">'+list+'</div></div>'+
    '<form class="card" id="ncForm"><h2>Neue Klasse anlegen</h2><label class="f" for="ncn">Name</label><input class="f" id="ncn" placeholder="z. B. 7b"><label class="f" for="ncg">Jahrgang</label>'+
    '<select class="f" id="ncg">'+[7,8,9,10,11,12,13].map(function(g){ return '<option>'+g+'</option>'; }).join('')+'</select><div id="ncMsg"></div><div style="margin-top:14px"><button class="btn blue" type="submit">Klasse anlegen</button></div></form></div>'+
    detail+'</div>';
  Array.prototype.forEach.call(app.querySelectorAll('[data-cid]'), function(b){ b.onclick = function(){ tState.sel = b.getAttribute('data-cid'); tState.detail = null; renderTeacher(t); loadDetail(t); }; });
  document.getElementById('ncForm').onsubmit = async function(ev){
    ev.preventDefault(); var n = document.getElementById('ncn').value.trim(), g = Number(document.getElementById('ncg').value), msg = document.getElementById('ncMsg');
    if (!n) { msg.innerHTML = '<div class="err">Bitte einen Namen eingeben.</div>'; return; }
    var r = await Remote.createClass(t, n, g);
    if (r.error) { msg.innerHTML = '<div class="err">'+esc(r.error)+'</div>'; return; }
    tState.classes = await Remote.classes(t); tState.sel = r.cls.id; tState.detail = null; renderTeacher(t); loadDetail(t);
  };
  var rb = document.getElementById('refBtn'); if (rb) rb.onclick = function(){ tState.detail = null; renderTeacher(t); loadDetail(t); };
  var cb = document.getElementById('csvBtn'); if (cb) cb.onclick = function(){ exportCSV(); };
}
function loadDetail(t){ var id = tState.sel; Remote.classDetail(id).then(function(d){ if (tState.sel === id) { tState.detail = d; renderTeacher(t); } }); }
function exportCSV(){
  var c = tState.classes.filter(function(x){ return x.id === tState.sel; })[0], d = tState.detail; if (!c || !d) return;
  var head = ['Name'].concat(MODS.map(function(m){ return 'M'+m.nr+' '+m.titel; })).concat(['Bestanden gesamt']);
  var lines = [head].concat(d.students.map(function(st){
    var cells = MODS.map(function(m){ var p = d.progress.filter(function(x){ return x.student_id === st.id && x.module_id === m.id; })[0];
      return p ? (p.passed ? 'bestanden ' + fmtDate(p.completed_at) : 'begonnen') : ''; });
    return [st.display_name].concat(cells).concat([d.progress.filter(function(x){ return x.student_id === st.id && x.passed; }).length + '/' + MODS.length]);
  }));
  var csv = '﻿' + lines.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(';'); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = 'KI-Fuehrerschein_' + c.name + '.csv'; a.click();
}

/* ---------------- Router ---------------- */
function route(){
  var h = location.hash || '#/', m;
  if (Date.now() - toastAt > 600) toastEl.classList.remove('show');
  Array.prototype.forEach.call(document.querySelectorAll('.cel'), function(x){ x.remove(); });
  renderTop();
  if (h === '#/' || h === '#') { return session() ? go('#/uebersicht') : viewLanding(); }
  if (h === '#/uebersicht') return viewDashboard();
  if ((m = h.match(/^#\/modul\/(\d)$/))) return viewModule(m[1]);
  if (h === '#/fuehrerschein') return viewCertificate();
  if (h === '#/datenschutz') return viewPrivacy();
  if (h === '#/meine-daten') return viewMyData();
  if (h === '#/lehrkraft') return viewTeacher();
  go('#/');
}
window.addEventListener('hashchange', route);
window.addEventListener('online', function(){ syncFromServer(); });
route();
})();


</script>
