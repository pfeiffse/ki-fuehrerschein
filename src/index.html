<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="KI-Führerschein Klasse 7 – Schulische KI-Kompetenzplattform" name="description"/>
<meta content="#103d54" name="theme-color"/>
<title>KI-Führerschein</title>
<script>
    // Alle Service Worker deregistrieren (verhindert Caching-Probleme)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) { r.unregister() }
      })
    }
    // GitHub Pages SPA-Redirect
    (function() {
      var redirect = sessionStorage.redirect
      delete sessionStorage.redirect
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect)
      }
    })()
  </script>
</head>
<body>

<div id="root"></div>
<script src="/app/main.jsx" type="module"></script>
</body>
