<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KI-Detektive – Wie funktioniert KI?</title>
<style>
:root{--bg:#f4f7ff;--ink:#17243b;--blue:#2859d8;--light:#e7eeff;--good:#16734a;--pink:#ffe3bd;--line:#cbd6ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;border:2px solid var(--blue);background:white;color:var(--ink);border-radius:15px;padding:13px 18px;min-height:52px;font-weight:750}button:hover,button:focus-visible{background:var(--light);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.primary{background:var(--blue);color:white}.primary:hover,.primary:focus-visible{background:#153ca8}.wrap{max-width:960px;margin:auto;padding:18px 18px 50px}header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.logo{font-weight:900;font-size:clamp(23px,4vw,34px)}.tiny{font-size:14px;color:#52617b}.pill{display:inline-block;background:#dce8ff;border-radius:30px;padding:7px 13px;font-weight:700}.progress{height:12px;background:#dce5f7;border-radius:20px;overflow:hidden;margin:17px 0 28px}.progress>div{height:100%;background:var(--blue);transition:width .2s}.card{background:white;border:2px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 7px 22px #263f6810}.eyebrow{font-weight:850;color:var(--blue);font-size:16px;text-transform:uppercase;letter-spacing:.04em}h1{font-size:clamp(29px,5vw,44px);line-height:1.12;margin:12px 0 20px}h2{font-size:clamp(24px,4vw,31px);margin:0 0 15px}.lead{font-size:clamp(19px,2.5vw,23px);max-width:760px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.scene{background:#eef3ff;border:2px dashed #b7c7ea;border-radius:20px;padding:20px;margin:20px 0}.choices{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.choice{flex:1 1 155px}.feedback{border-left:6px solid var(--blue);background:#eef3ff;padding:15px 18px;border-radius:12px;margin-top:20px;font-weight:650}.feedback.good{border-color:var(--good);background:#e8f7ee}.big{font-size:clamp(26px,4vw,42px);font-weight:850}.sub{color:#53627a;font-size:16px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.picture{border:2px solid #cbd6ec;border-radius:16px;background:white;padding:15px 7px;text-align:center;position:relative}.emoji{font-size:clamp(43px,7vw,72px);line-height:1.5}.star{position:absolute;top:4px;right:9px;color:#b35b00;font-size:27px;filter:drop-shadow(0 1px 1px white)}.tag{font-size:15px;font-weight:800}.prob{display:grid;grid-template-columns:105px 1fr 50px;align-items:center;gap:9px;margin:12px 0}.bar{background:#dbe4f5;border-radius:20px;height:23px;overflow:hidden}.bar span{display:block;background:#5880eb;height:100%;transition:width .25s}.mini-note{font-size:14px;color:#52617b}.hidden{display:none!important}.number{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#dce8ff;color:#234cbb;font-weight:900;margin-right:8px}.context-btn.active{background:var(--blue);color:white}.sentence{background:white;border-radius:15px;padding:18px;font-size:clamp(22px,3vw,31px);font-weight:800;min-height:78px;overflow-wrap:anywhere}.word{display:inline-block;background:#dbe6ff;border:2px solid #a9c2ff;border-radius:9px;padding:3px 9px;margin:3px}.final-list{font-size:22px;line-height:1.9}footer{font-size:13px;color:#52617b;margin-top:22px}@media(max-width:520px){.cards{gap:6px}.picture{padding:8px 3px}.tag{font-size:13px}.prob{grid-template-columns:85px 1fr 45px}.wrap{padding:12px 10px 35px}.card{padding:17px}}
.train-top{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}.train-meter{height:19px;background:#dbe4f5;border-radius:30px;overflow:hidden;flex:1 1 200px}.train-meter>div{height:100%;background:#5880eb;transition:width .3s}.horse-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:20px}.train-tile{background:white;border:1px solid #b7c7ea;border-radius:12px;min-width:0;text-align:center;padding:8px 2px}.train-tile span{display:block;font-size:clamp(24px,4vw,42px)}.train-tile small{display:block;font-size:12px;color:#16734a;font-weight:700}.empty-train{padding:25px 10px;color:#53627a}.test-animal{font-size:84px;text-align:center;background:white;border:2px solid #cbd6ec;border-radius:16px;max-width:220px;margin:auto}@media(max-width:520px){.horse-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.photo-card{min-width:0;background:#fff;border:2px solid #cbd6ec;border-radius:15px;overflow:hidden;text-align:center}.photo-card img{display:block;width:100%;height:155px;object-fit:cover;background:#e3e9f3}.photo-card .caption{padding:9px;font-size:15px;font-weight:750}.photo-card button{border:0;border-top:2px solid #cbd6ec;border-radius:0;width:100%;font-size:15px;padding:11px 5px}.photo-card button:focus-visible{outline:3px solid #2859d8;outline-offset:-3px}.photo-card.selected{border-color:#2859d8;background:#e7eeff;box-shadow:inset 0 0 0 2px #2859d8}.photo-card .fallback{height:155px;display:none;align-items:center;justify-content:center;font-size:65px;background:#eaf0fa}.small-divider{border:0;border-top:2px solid #d6e0f2;margin:30px 0}.photo-note{font-size:14px;color:#53627a}.train-chip{display:inline-block;background:#dce8ff;border-radius:15px;padding:7px 12px;font-size:15px;font-weight:750}.stage-label{font-size:16px;font-weight:850;color:#2859d8}.photo-card button:disabled{opacity:.75}@media(max-width:580px){.photo-grid{gap:7px}.photo-card img,.photo-card .fallback{height:112px}.photo-card .caption{font-size:13px;padding:7px 3px}.photo-card button{font-size:13px;min-height:54px}}
.wm-discovery{max-width:560px;margin:18px auto}.wm-pin-tray{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0}.wm-pin{touch-action:none;user-select:none;cursor:grab;border-radius:50%;font-size:27px;width:64px;height:64px;padding:0;background:#fff7e6;border-color:#b46b1d;z-index:10}.wm-pin.dragging{cursor:grabbing;opacity:.85;position:relative}.wm-drop-photo{cursor:crosshair;touch-action:pan-y}.wm-drop-photo .wm-stamp{pointer-events:none}.wm-search-feedback{font-weight:700;color:#234cbb;min-height:25px;margin:8px 0}.wm-discovery .wm-photo img{height:315px;object-fit:cover}.wm-discovery .wm-photo img{height:315px;object-fit:cover}.wm-hotspot{position:absolute;right:8%;bottom:29px;width:66px;height:66px;border:2px dashed rgba(255,255,255,.85);border-radius:50%;background:rgba(15,35,65,.12);color:white;cursor:pointer;font-size:14px;z-index:3}.wm-hotspot:focus-visible{outline:4px solid #2859d8}.wm-discovery-note{padding:14px;background:#e7eeff;border-radius:12px;margin:12px 0}.wm-photo{position:relative;background:#e8eef6;border:2px solid #cbd6ec;border-radius:14px;overflow:hidden;min-width:0}.wm-photo img{display:block;width:100%;height:165px;object-fit:cover}.wm-photo .wm-fallback{display:none;height:165px;align-items:center;justify-content:center;text-align:center;padding:12px;color:#46536b}.wm-stamp{position:absolute;right:10px;bottom:40px;padding:2px 5px;background:rgba(255,255,255,.38);color:rgba(30,42,54,.65);border:1px solid rgba(30,42,54,.25);border-radius:3px;font-size:clamp(11px,1.8vw,15px);font-weight:600;transform:none;pointer-events:none}.wm-caption{background:white;text-align:center;padding:7px;font-size:15px;font-weight:800}.wm-test-single{max-width:340px;margin:16px auto}.wm-test-single .wm-photo img,.wm-test-single .wm-fallback{height:215px}@media(max-width:580px){.wm-photo img,.wm-photo .wm-fallback{height:120px}.wm-test-single .wm-photo img,.wm-test-single .wm-fallback{height:195px}}

/* Station 1: Trainingsmengen anschaulich machen */
.data-flow{margin:18px 0;padding:15px;background:#eef3ff;border:2px solid #cbd6ec;border-radius:17px}
.data-flow-heading{font-weight:800;margin-bottom:9px}
.data-flow-track{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center}
.data-flow-tiles{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;min-height:130px;align-content:center}
.data-flow-tiles .mini-photo{aspect-ratio:1;border:1px solid #bcc9df;border-radius:3px;display:grid;place-items:center;font-size:clamp(9px,1.7vw,16px);background:#fff;opacity:.22;transform:scale(.85);transition:opacity .16s,transform .16s,background .16s}
.data-flow-tiles .mini-photo.seen{opacity:1;transform:scale(1);background:#d7e6ff}
.data-flow-tiles .mini-photo.flash{background:#b9e9ce}
.data-flow-computer{font-size:40px;text-align:center;line-height:1.15}
.data-flow-computer small{display:block;font-size:12px;font-weight:800}
.data-flow-count{font-weight:900;font-size:clamp(25px,5vw,36px);color:#2048a7;font-variant-numeric:tabular-nums}
.data-flow-caption{font-size:14px;margin-top:8px;color:#344562}
.data-flow.busy .data-flow-computer{animation:computer-pulse .5s ease-in-out infinite alternate}
@keyframes computer-pulse{from{transform:scale(1)}to{transform:scale(1.09)}}
@media(prefers-reduced-motion:reduce){.data-flow.busy .data-flow-computer{animation:none}.data-flow-tiles .mini-photo{transition:none}}

/* Station 2: eigenständige Abschlussfrage und Merksatz-Seite */
.wm-quiz-option{display:block;width:100%;margin:10px 0;padding:17px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;font-weight:650;cursor:pointer}
.wm-quiz-option.selected{border-color:var(--blue);background:var(--light)}
.wm-quiz-option:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wm-takeaway-page{padding:24px 8px;text-align:center}
.wm-big-takeaway{font-size:clamp(27px,5vw,47px);line-height:1.25;font-weight:900;margin:25px auto;max-width:760px}
.wm-takeaway-page .scene{max-width:720px;margin:22px auto}
/* Station 2: Übersicht nach den vier Bildtests */
.wm-review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:18px 0}
.wm-review-item{min-width:0;background:#fff;border:2px solid #cbd6ec;border-radius:15px;padding:10px}
.wm-review-number{font-weight:800;margin-bottom:8px}
.wm-review-item .wm-photo img{height:160px;object-fit:cover}
.wm-review-answer{font-size:16px;padding:10px;margin-top:8px;border-radius:10px;line-height:1.5}
.wm-review-answer.correct{background:#ddf4e7;color:#145c39}
.wm-review-answer.wrong{background:#ffe4df;color:#8c2920}
.wm-review-takeaway{font-weight:750}
@media(max-width:520px){.wm-review-grid{grid-template-columns:1fr}}

/* STATION-4-MODUL: Alle Styles sind auf #ki-satzwerkstatt begrenzt. */
#ki-satzwerkstatt{--ink:#1d2d43;--blue:#2563eb;--soft:#eef5ff;--line:#cdddf2;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);max-width:950px;margin:0 auto;padding:clamp(16px,4vw,38px);line-height:1.5}#ki-satzwerkstatt *{box-sizing:border-box}#ki-satzwerkstatt .sw-eyebrow{font-weight:800;color:#1d5cb6;letter-spacing:.04em}#ki-satzwerkstatt h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.12;margin:.35em 0}#ki-satzwerkstatt .sw-lead{font-size:1.16rem;max-width:760px}#ki-satzwerkstatt .sw-card{border:2px solid var(--line);background:#fff;border-radius:22px;padding:clamp(18px,3vw,30px);margin-top:20px;box-shadow:0 10px 28px #17365b0d}#ki-satzwerkstatt .sw-counter{font-weight:800;color:#315f9d}#ki-satzwerkstatt .sw-sentence{background:var(--soft);border-radius:18px;padding:20px;min-height:96px;font-size:clamp(1.4rem,3vw,2.15rem);font-weight:800;display:flex;flex-wrap:wrap;gap:8px;align-items:center}#ki-satzwerkstatt .sw-word{display:inline-block;background:white;border:1px solid #bad1f4;border-radius:10px;padding:2px 9px}#ki-satzwerkstatt .sw-cursor{color:var(--blue);animation:swblink 1s steps(2) infinite}@keyframes swblink{50%{opacity:0}}#ki-satzwerkstatt .sw-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}#ki-satzwerkstatt button{font:inherit;cursor:pointer}#ki-satzwerkstatt .sw-option{border:2px solid #9fc0ec;background:#fff;color:var(--ink);border-radius:15px;min-height:64px;padding:12px;font-size:1.1rem;font-weight:750;text-align:left;transition:background .15s,border-color .15s,opacity .15s}#ki-satzwerkstatt .sw-option:not(:disabled):hover,#ki-satzwerkstatt .sw-option:not(:disabled):focus-visible{background:#e8f2ff;border-color:var(--blue)}#ki-satzwerkstatt .sw-option:disabled{color:#929ba7;background:#edf0f4;border-color:#e1e5ea;opacity:.65;text-decoration:line-through;cursor:not-allowed}#ki-satzwerkstatt .sw-option:disabled::after{content:' · passt grammatikalisch nicht';font-size:.75rem;display:block;text-decoration:none;font-weight:500}#ki-satzwerkstatt .sw-note{background:#fff7e6;border-left:5px solid #f4b542;padding:12px 16px;border-radius:10px;margin-top:18px}#ki-satzwerkstatt .sw-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}#ki-satzwerkstatt .sw-action{background:var(--blue);color:white;border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:1rem;min-height:48px}#ki-satzwerkstatt .sw-action.sw-secondary{background:#e6effd;color:#1c4c8b}#ki-satzwerkstatt .sw-done{background:#e9f8ee;border:2px solid #80cda0;padding:16px;border-radius:14px;font-size:1.12rem}#ki-satzwerkstatt .sw-foot{font-size:.93rem;color:#536276;margin-top:20px}#ki-satzwerkstatt .sw-explain{font-size:1rem;margin-top:8px}#ki-satzwerkstatt .sw-step{margin-top:20px;font-size:1.16rem;font-weight:800}#ki-satzwerkstatt .sw-hint{color:#4c5b6f;margin:5px 0 0}@media(prefers-reduced-motion:reduce){#ki-satzwerkstatt .sw-cursor{animation:none}}

</style>

<body><div class="wrap">
<header><div class="logo">🕵️ KI-Detektive</div><div><span class="pill" id="counter">Start</span> <button id="speak" aria-label="Text dieser Station vorlesen" title="Text vorlesen">🔊 Vorlesen</button></div></header>
<div class="progress" aria-label="Fortschritt"><div id="progress" style="width:0%"></div></div>
<main id="main" class="card" tabindex="-1" aria-live="polite"></main>
<footer>Für Klasse 7 · Ohne Anmeldung · Bilder benötigen Internet · Alle Beispiele und Zahlen sind vereinfachte Simulationen, keine echte KI.</footer>
</div>
<script>
(()=>{'use strict';let page=0,trained=0,horseStage=0,horseAnswer='',phase1Choice=[],phase1Checked=false,firstSolved=false,phase2Choice=[],phase2Checked=false,expanded=false,starOn=false,wmStep=0,wmChoice='',wmChecked=false,wmDiscovery=0,wmConclusion=0,s1Conclusion=0,s1QuizChoice='',s1QuizFeedback='',wmQuizChoice='',wmQuizFeedback='',context='pause',built=[],step=0,s4Conclusion=0,s4QuizChoice='',s4QuizFeedback='',s4Order=[0,1,2,3],s1Order=[0,1,2,3],wmOrder=[0,1,2,3];const main=document.getElementById('main'),counter=document.getElementById('counter'),progress=document.getElementById('progress');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function btn(label,fn,cls=''){return `<button type="button" class="${cls}" data-action="${fn}">${label}</button>`}function nav(back=true,next=true,label='Weiter →'){return `<div class="actions">${back?btn('← Zurück','back'):''}${next?btn(label,'next','primary'):''}</div>`}function shuffledOrder(){const a=[0,1,2,3];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){counter.textContent=page===0?'Start':page===5?'Geschafft!':`Station ${page} von 4`;progress.style.width=(page/5*100)+'%';if(page===0){main.innerHTML=`<div class="eyebrow">Deine Mission</div><h1>Wie denkt eigentlich eine KI? 🤖</h1><p class="lead">Du wirst zum KI-Detektiv. Du findest heraus, wie KI lernt und wie sie Sätze schreibt.</p><div class="scene big" style="text-align:center">🐴 🧠 💬</div><p>Vier kurze Spiele. Du brauchst kein Vorwissen.</p>${nav(false,true,'Los geht’s! 🚀')}`}
if(page===1&&s1Conclusion>0){
 const answers=[
  ['Wenn eine KI sehr viele Bilder sieht, erkennt sie danach automatisch jedes Pferd.','Viele Bilder allein reichen nicht. Wenn die Beispiele sehr ähnlich sind, fehlen wichtige Unterschiede.'],
  ['Die KI lernt aus Beispielen. Dabei sind sowohl die Menge als auch die Vielfalt der Bilder wichtig.',''],
  ['Eine KI muss jedes Pferdebild genau einmal sehen, damit sie Pferde erkennen kann.','Die KI lernt Muster aus Beispielen und muss nicht jedes mögliche Pferdefoto einzeln kennen.'],
  ['Wenn die KI ein weißes Pferd nicht erkennt, braucht sie nur noch mehr braune Pferdefotos.','Noch mehr ähnliche Fotos helfen nicht unbedingt. Hier braucht die Mini-KI vielfältigere Beispiele.']
 ];
 if(s1Conclusion===1){main.innerHTML=`<div class="eyebrow">Station 1 · Abschlussfrage</div><h2>Was hat die Mini-KI gelernt? 🐴</h2><p class="lead">Du hast zweimal trainiert und getestet. <strong>Was ist dabei wichtig?</strong></p><div class="scene"><p><strong>Wähle eine Antwort:</strong></p>${s1Order.map((answerId,i)=>`<button type="button" class="wm-quiz-option ${s1QuizChoice===String(answerId)?'selected':''}" data-action="s1-quiz:${answerId}" aria-pressed="${s1QuizChoice===String(answerId)}">${String.fromCharCode(65+i)} · ${answers[answerId][0]}</button>`).join('')}<div class="actions">${btn('✓ Antwort prüfen','s1-quiz-check','primary')}</div>${s1QuizFeedback?`<div class="feedback ${s1QuizChoice==='1'?'good':''}" role="status">${s1QuizFeedback}</div>`:''}${s1QuizChoice==='1'&&s1QuizFeedback.startsWith('✅')?`<div class="actions">${btn('Zum Merksatz →','s1-show-takeaway','primary')}</div>`:''}</div><div class="actions">${btn('← Bilder noch einmal ansehen','s1-review-back')}</div>`;return}
 if(s1Conclusion===2){main.innerHTML=`<div class="wm-takeaway-page"><div class="eyebrow">Station 1 · Das hast du herausgefunden</div><h1>💡 Merksatz</h1><div class="wm-big-takeaway">KI lernt Muster aus Beispielen.<br>Wichtig sind <span style="color:var(--blue)">viele und vielfältige Trainingsbilder.</span></div><div class="scene"><p>Eine Million ähnliche Pferdebilder zeigen der Mini-KI nicht unbedingt alle Arten von Pferden. Unterschiedliche Beispiele helfen ihr, mehr Pferdearten zu erkennen.</p><p class="photo-note">Unser Pferdetraining ist ein vereinfachtes Lernspiel – keine echte KI.</p></div><div class="actions">${btn('← Zur Abschlussfrage','s1-quiz-back')}${btn('Weiter zum Pferde-Rätsel →','next','primary')}</div></div>`;return}
}
if(page===1){
const photos={
 a:['Chestnut_Thoroughbred.jpg','Fuchs · Vollblut'],
 b:['Chestnut_Thoroughbred_Horse_(3433223374).jpg','Fuchs · Vollblut'],
 c:['Chestnut_horse_in_a_paddock.jpg','Fuchs · Vollblut'],
 d:['Lichtenwald_Pferd.jpg','Fuchs · neues Foto'],
 e:['Chestnut_Horse_-_52929673268.jpg','Fuchs · neues Foto'],
 white:['USER_WHITE_HORSE','Schimmel · Ganzkörperfoto'],
 white2:['White_Horse_of_the_Camargue.jpg','Schimmel · neues Testfoto'],
 pony2:['Shetland_Pony_at_Avon_Valley.jpg','Pony · neues Testfoto'],
 draft2:['Draft_horses_4.jpg','Kaltblut · neues Testfoto'],
 car:['CAR_TEST_IMAGE','Auto · neues Testfoto'],

let trainingBusy=false;
function animateTraining(){
 if(trainingBusy||page!==1||trained>=3)return;
 trainingBusy=true;
 const next=trained+1,goal=[0,100,10000,1000000][next],previous=[0,100,10000,1000000][trained];
 const flow=document.getElementById('data-flow'),count=document.getElementById('data-flow-count'),meter=document.getElementById('data-flow-meter');
 const tiles=Array.from(document.querySelectorAll('#data-flow-tiles .mini-photo'));
 const startFilled=[0,12,48,96][trained],endFilled=[0,12,48,96][next];
 const button=document.querySelector('button[data-action="train"]');if(button){button.disabled=true;button.textContent='⏳ Die KI sieht viele Bilder …'}
 flow?.classList.add('busy');
 const start=performance.now(),duration=1500;
 function tick(now){
  if(page!==1){trainingBusy=false;return}
  const t=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-t,2);
  const shown=Math.round(previous+(goal-previous)*eased);
  if(count)count.textContent=shown.toLocaleString('de-DE')+' Bilder';
  if(meter)meter.style.width=(startFilled+(endFilled-startFilled)*eased)/96*100+'%';
  const filled=Math.round(startFilled+(endFilled-startFilled)*eased);
  tiles.forEach((tile,i)=>{tile.classList.toggle('seen',i<filled);tile.classList.toggle('flash',i>=Math.max(startFilled,filled-5)&&i<filled)});
  if(t<1){requestAnimationFrame(tick)}else{trained=next;horseAnswer='';trainingBusy=false;render()}
 }
 requestAnimationFrame(tick);
}
