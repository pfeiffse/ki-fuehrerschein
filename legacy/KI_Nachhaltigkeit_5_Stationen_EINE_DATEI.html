const pages={"1": "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Ressourcen-Detektive | KI & Nachhaltigkeit<\/title><style>\n:root{--ink:#163348;--teal:#087f83;--mint:#dff4ec;--blue:#e6f4ff;--paper:#f5f9fc;--gold:#ffcb66}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#dff5f1,#eaf2ff 55%,#fff7e8);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}main{max-width:1120px;margin:25px auto 70px;padding:0 18px}.hero{background:linear-gradient(120deg,#095c6b,#167e8a);color:white;border-radius:28px;padding:30px 36px;box-shadow:0 12px 35px #15546825}.eyebrow{font-weight:800;letter-spacing:.12em;font-size:.78rem;text-transform:uppercase;color:#bff5e5}h1{font-size:clamp(1.8rem,4vw,3rem);margin:8px 0}h2{font-size:clamp(1.4rem,3vw,2.1rem);margin:8px 0}p{line-height:1.6}.progress{height:11px;background:#ffffff50;border-radius:99px;overflow:hidden;margin-top:20px}.progress>div{height:100%;background:#ffc963;width:0%;transition:width .35s}.panel{background:white;border-radius:25px;padding:27px;margin-top:20px;box-shadow:0 10px 35px #24516d14}.lead{font-size:1.1rem}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}.tile{height:165px;perspective:900px;border:0;background:transparent;cursor:pointer;padding:0;color:inherit}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s}.tile.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #c9e3e8;background:linear-gradient(155deg,#fff,#eaf8f5);border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 13px #2a5d6a12}.face.back{transform:rotateY(180deg);color:white}.tile.selected .front{border-color:#0a8b91;background:#d9f6ed;box-shadow:0 0 0 3px #70d7c477}.tile.good .back{background:#21875d;border-color:#21875d}.tile.bad .back{background:#c9434d;border-color:#c9434d}.tile.faded{opacity:.24;filter:grayscale(1)}.tile .emoji{font-size:2.65rem}.tile strong{font-size:1.08rem}.tile small{font-size:.79rem}.tile:focus-visible,.btn:focus-visible{outline:4px solid #ffb638;outline-offset:3px}.btn{background:#087e83;color:white;border:0;border-radius:13px;padding:14px 21px;font-weight:800;font-size:1rem;cursor:pointer}.btn:hover{background:#075c66}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#e8f3f6;color:#16495b}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}.note{padding:13px 17px;background:#e8f5fc;border-left:5px solid #2484bb;border-radius:12px;margin:16px 0}.warning{background:#fff3d8;border-left-color:#e7a32a}.muted{color:#536f7c}.detail-head{display:flex;align-items:center;gap:20px}.detail-icon{width:100px;height:100px;border-radius:23px;background:#e1f6ed;display:grid;place-items:center;font-size:3.6rem;flex-shrink:0}.compare{border-radius:19px;background:#fff2cf;padding:20px;margin:20px 0;border:1px solid #ffdf8b}.compare .big{font-size:clamp(1.5rem,3vw,2.25rem);font-weight:900;color:#825300}.factgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fact{background:#f2f8fa;padding:18px;border-radius:17px}.fact h3{margin:0 0 7px}.source{font-size:.82rem;color:#587181}.source a{color:#086e80}.minescene{height:230px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#b9e9fa 0 60%,#9acb80 60%);border:2px solid #b7d3d8;margin:16px 0}.minescene:before{content:'☁️       ☁️';position:absolute;top:15px;left:20%;font-size:30px}.hill{position:absolute;bottom:0;width:120%;left:-10%;height:95px;background:#65ad72;border-radius:50% 50% 0 0}.minepit{position:absolute;bottom:-30px;left:17%;width:66%;height:185px;border-radius:50% 50% 15% 15%;background:repeating-linear-gradient(170deg,#aa7859 0 15px,#cf9c71 15px 29px,#89624b 29px 33px);transform:scale(.01);transition:transform .6s;transform-origin:center bottom}.minescene.active .minepit{transform:scale(1)}.minescene.active .hill{background:#b3a07c}.waterpond{position:absolute;right:6%;bottom:7px;width:120px;height:36px;background:#74a9ae;border-radius:50%;opacity:0;transition:opacity .4s}.minescene.active .waterpond{opacity:1}.caption{font-size:.85rem;color:#4c6775}table{border-collapse:collapse;width:100%;font-size:.94rem}th,td{text-align:left;padding:13px;border-bottom:1px solid #dce9ec;vertical-align:top}th{background:#e5f3f1}tr:nth-child(even){background:#f7fbfc}.done{display:inline-block;background:#d8f4e5;color:#11613e;border-radius:30px;padding:8px 14px;font-weight:800}.counter{font-weight:800;color:#077783}.hidden{display:none!important}@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}.factgrid{grid-template-columns:1fr}.panel{padding:18px}.tile{height:142px}.hero{padding:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n.mine-photo{background:#dce9ed;border-radius:20px;overflow:hidden;min-height:250px;display:flex;align-items:center;justify-content:center;margin-top:12px}.mine-photo img{display:block;width:100%;height:360px;object-fit:cover}.mine-fallback{padding:28px;text-align:center;line-height:1.6}.mine-fallback a{color:#087f83}.caption{line-height:1.5}\n.resource-photo{margin:18px 0 22px;background:#edf5f6;border-radius:20px;overflow:hidden}.resource-photo img{display:block;width:100%;height:270px;object-fit:cover}.resource-photo figcaption{padding:11px 16px;font-size:.85rem;color:#4b6470}.resource-photo a{color:#087e83}.photo-fallback{padding:35px;text-align:center}\n<\/style><\/head><body><main><header class=\"hero\"><div class=\"eyebrow\">KI & Nachhaltigkeit · Klasse 7<\/div><h1>🔎 Ressourcen-Detektive<\/h1><div id=\"subtitle\">Was steckt wirklich hinter einer KI-Antwort?<\/div><div class=\"progress\"><div id=\"bar\"><\/div><\/div><\/header><section class=\"panel\" id=\"app\" aria-live=\"polite\"><\/section><\/main><script>\nconst choices=[['⚡','Strom',1],['💧','Wasser',1],['🪨','Rohstoffe',1],['🏞️','Fläche',1],['❄️','Kühlung',1],['🔌','Kupfer',1],['🧲','Seltene Erden',1],['🌐','Datennetze',1],['👩‍🔧','Menschen',1],['🏢','Gebäude',1],['📚','Trainingsdaten',1],['🚚','Transport',1],['🌳','Bäume',0],['📄','Papier',0],['🍫','Schokolade',0],['⏰','Uhrzeit',0],['🧸','Spielzeug',0],['🧴','Shampoo',0]];\nconst cards=[\n{icon:'⚡',name:'Strom',what:'KI-Modelle laufen auf leistungsfähigen Computern. Ihre Chips benötigen Strom – ebenso die Netzwerktechnik und Kühlung.',impact:'Je nachdem, wie der Strom erzeugt wird, entstehen dabei Treibhausgase. Große Rechenzentren benötigen besonders viel Energie.',number:'415 Milliarden kWh',compare:'So viel Strom verbrauchten Rechenzentren weltweit im Jahr 2024 nach Schätzung der Internationalen Energieagentur (IEA). Das entspricht rund 1,5 % des weltweiten Stromverbrauchs – nicht nur KI, sondern allen Rechenzentren zusammen.',source:'IEA, Energy and AI (2025)',url:'https://www.iea.org/reports/energy-and-ai'},\n{icon:'💧',name:'Wasser',what:'Einige Rechenzentren nutzen Wasser zum Kühlen. Zusätzlich kann bei der Erzeugung ihres Stroms Wasser benötigt werden.',impact:'Verdunstetes Kühlwasser steht vor Ort nicht sofort wieder zur Verfügung. In trockenen Regionen kann das problematisch sein.',number:'21 Milliarden Liter',compare:'Ungefähr diese Wassermenge verbrauchten Googles Rechenzentren und Büros zusammen 2022. Das wären rechnerisch rund 175 Millionen Badewannen à 120 Liter. Achtung: nicht nur KI und nicht nur Rechenzentren!',source:'Google Environmental Report 2023, Angaben für 2022',url:'https://www.gstatic.com/gumdrop/sustainability/google-2023-environmental-report.pdf'},\n{icon:'🪨',name:'Rohstoffe',what:'Für Chips, Platinen, Gehäuse, Kabel und Bauwerke braucht man mineralische Rohstoffe und andere Materialien.',impact:'Abbau, Transport und Verarbeitung verändern Landschaften, benötigen Energie und können Böden oder Gewässer belasten.',number:'Nicht nur ein Chip',compare:'Ein KI-Rechenzentrum besteht aus Tausenden Einzelteilen. Deshalb zählen nicht nur die Rohstoffe im Chip, sondern auch Kabel, Stromversorgung, Kühlung und Gebäude.',source:'UNEP, Global Resources Outlook 2024',url:'https://www.unep.org/resources/Global-Resource-Outlook-2024'},\n{icon:'🏞️',name:'Fläche',what:'Rechenzentren brauchen Grundstücke für Gebäude, Kühltechnik, Leitungen und manchmal Umspannwerke.',impact:'Versiegelte Flächen nehmen Pflanzen und Tieren Lebensraum und erschweren das Versickern von Regenwasser.',number:'Mehrere Fußballfelder',compare:'Große Rechenzentrums-Campus können Flächen in dieser Größenordnung oder deutlich darüber belegen. Es gibt aber auch kleine Anlagen; die Größe ist kein fester KI-Wert.',source:'Einordnung anhand verschiedener Rechenzentrumsbauweisen',url:''},\n{icon:'❄️',name:'Kühlung',what:'Computerchips werden beim Rechnen heiß. Luftkühlung, Flüssigkeitskühlung und andere Verfahren führen die Wärme ab.',impact:'Kühlung benötigt technische Anlagen und häufig zusätzlichen Strom; bei manchen Systemen auch Wasser.',number:'Auch nachts',compare:'Viele Rechenzentren arbeiten rund um die Uhr. Deshalb muss die Wärme kontinuierlich abgeführt werden – anders als etwa bei einem Schulcomputer, der nach Unterrichtsschluss ausgeschaltet wird.',source:'IEA, Energy and AI (2025)',url:'https://www.iea.org/reports/energy-and-ai'},\n{icon:'🔌',name:'Kupfer',what:'Kupfer leitet Strom gut. Es steckt in Kabeln, Leiterplatten, Transformatoren und der Stromversorgung von Rechenzentren.',impact:'Kupfer wird häufig im Tagebau gewonnen. Gestein wird gesprengt, transportiert, zerkleinert und chemisch oder metallurgisch verarbeitet. Abraum und Rückstände können Gewässer belasten.',number:'Riesige Tagebaue',compare:'Chile, Peru und die Demokratische Republik Kongo sind bedeutende Förderländer. Die Mine Chuquicamata in Chile zeigt, wie stark der Abbau eine Landschaft verändern kann.',source:'USGS Mineral Commodity Summaries: Copper',url:'https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-copper.pdf',mine:true},\n{icon:'🧲',name:'Seltene Erden',what:'„Seltene Erden“ bezeichnet 17 chemische Elemente, darunter Neodym und Lanthan. Viele sind nicht besonders selten, aber ihre Trennung und Verarbeitung ist schwierig.',impact:'Der Abbau und die chemische Trennung können viel Material und Wasser beanspruchen. Manche Lagerstätten enthalten problematische Begleitstoffe.',number:'17 Elemente',compare:'Seltene Erden stecken etwa in starken Magneten von Motoren und anderen technischen Komponenten. Sie sind nicht der Hauptrohstoff von KI-Chips. Nicht mit Kupfer verwechseln: Kupfer gehört nicht zu den Seltenen Erden.',source:'USGS Mineral Commodity Summaries: Rare Earths',url:'https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-rare-earths.pdf'},\n{icon:'🌐',name:'Datennetze',what:'Eine Frage wird oft über das Internet an ein Rechenzentrum geschickt; die Antwort gelangt über Netze zurück.',impact:'Router, Glasfaserkabel, Mobilfunkanlagen und andere Netztechnik benötigen Geräte, Rohstoffe und Strom.',number:'Mehr als dein Handy',compare:'Bei einer KI-Anfrage arbeiten nicht nur dein Gerät, sondern auch Netztechnik und Computer an anderen Orten zusammen.',source:'IEA, Energy and AI (2025)',url:'https://www.iea.org/reports/energy-and-ai'},\n{icon:'👩‍🔧',name:'Menschen',what:'Menschen entwickeln KI, beschaffen Rohstoffe, bauen Chips und Rechenzentren, prüfen Ergebnisse und warten Anlagen.',impact:'Auch Arbeitsbedingungen und die Auswirkungen auf Gemeinden in Bergbauregionen gehören zur Nachhaltigkeit.',number:'Viele Berufe',compare:'Vom Bergbau über die Chipfertigung bis zur Programmierung und Reparatur: KI entsteht durch die Arbeit vieler Menschen.',source:'UNEP, Global Resources Outlook 2024',url:'https://www.unep.org/resources/Global-Resource-Outlook-2024'},\n{icon:'🏢',name:'Gebäude',what:'Server benötigen sichere Gebäude mit Stromversorgung, Brandschutz und Kühlsystemen.',impact:'Beim Bauen werden etwa Beton, Stahl und Dämmstoffe eingesetzt. Ihre Herstellung verbraucht Ressourcen und verursacht Emissionen.',number:'Eine echte Fabrik für Daten',compare:'Obwohl KI digital wirkt, benötigt sie reale Gebäude und große technische Anlagen.',source:'IEA, Energy and AI (2025)',url:'https://www.iea.org/reports/energy-and-ai'},\n{icon:'📚',name:'Trainingsdaten',what:'Viele KI-Modelle werden mit großen Mengen an Texten, Bildern und anderen Daten trainiert.',impact:'Die Verarbeitung dieser Daten benötigt Rechenleistung. Außerdem stellen sich Fragen zu Urheberrecht, Datenschutz und Qualität.',number:'Training und Nutzung',compare:'Beim Training lernt ein Modell Muster aus Daten. Bei deiner späteren Frage wird das bereits trainierte Modell erneut berechnet. Beides benötigt Ressourcen, aber nicht gleich viel.',source:'IEA, Energy and AI (2025)',url:'https://www.iea.org/reports/energy-and-ai'},\n{icon:'🚚',name:'Transport',what:'Erze, Chips, Computer, Kühlgeräte und Baumaterialien werden oft über weite Strecken transportiert.',impact:'Schiffe, Lkw und andere Transportmittel benötigen Energie und verursachen je nach Antrieb Emissionen.',number:'Globale Lieferketten',compare:'Ein Chip kann aus Rohstoffen verschiedener Länder entstehen und mehrere Produktionsorte durchlaufen, bevor er im Rechenzentrum eingesetzt wird.',source:'UNEP, Global Resources Outlook 2024',url:'https://www.unep.org/resources/Global-Resource-Outlook-2024'}];\nconst minePhotos=[\n{title:'1. Blick in den Tagebau',url:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Chuquicamata_copper_mine_chile.jpg?width=1280',alt:'Luftaufnahme der terrassenförmigen Kupfermine Chuquicamata',caption:'Luftaufnahme von 2004: Die stufenförmigen Abbauflächen sind deutlich zu erkennen.',source:'https://commons.wikimedia.org/wiki/File:Chuquicamata_copper_mine_chile.jpg',credit:'Owen Cliffe',license:'CC BY-SA 3.0'},\n{title:'2. Blick aus dem All',url:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Chuquicamata_copper_mine_-_Chuquicamata-Kupfermine.jpg?width=1280',alt:'Aufnahme der Chuquicamata-Kupfermine aus dem Weltraum',caption:'Aufnahme von 2018: Auch aus dem All ist der Eingriff in die Landschaft erkennbar.',source:'https://commons.wikimedia.org/wiki/File:Chuquicamata_copper_mine_-_Chuquicamata-Kupfermine.jpg',credit:'Alexander Gerst / ESA',license:'CC BY-SA 2.0'},\n{title:'3. Rückstände der Kupfergewinnung',url:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Escondida_Copper_Mine%2C_Atacama_Desert%2C_Chile_2009-12-09_lrg.jpg?width=1280',alt:'Rückhaltebecken mit grünlich gefärbten flüssigen Rückständen der Escondida-Kupfermine',caption:'NASA-Aufnahme (2009) der Escondida-Mine: Grünlich erscheint der flüssige Teil eines Rückhaltebeckens mit Rückständen der Erzverarbeitung. Das Foto allein belegt keine Gewässerverschmutzung außerhalb des Beckens.',source:'https://science.nasa.gov/earth/earth-observatory/escondida-copper-mine-atacama-desert-chile-43394/',credit:'NASA / ISS Expedition 22',license:'Public Domain'}\n];\nlet selected=new Set(),stage='choose',idx=0,read=new Set(),mineStep=0;const app=document.getElementById('app');const bar=document.getElementById('bar');const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function progress(n){bar.style.width=n+'%'}function render(){if(stage==='choose'||stage==='check'){progress(stage==='choose'?10:25);app.innerHTML=`<h2>1. Was braucht KI wirklich?<\/h2><p class=\"lead\">Klicke <b>alle<\/b> Ressourcen und Voraussetzungen an, die für die Herstellung oder Nutzung von KI wichtig sind. Manche Antworten sind absichtlich falsch.<\/p><div class=\"tiles\">${choices.map(([ic,name,yes],i)=>{let pick=selected.has(i),correct=pick===!!yes,fade=stage==='check'&&!yes&&!pick;return `<button aria-label=\"${name}, ${pick?'ausgewählt':'nicht ausgewählt'}\" aria-pressed=\"${pick}\" class=\"tile ${pick?'selected':''} ${stage==='check'?'flip '+(correct?'good':'bad'):''} ${fade?'faded':''}\" ${stage==='check'?'disabled':''} onclick=\"toggle(${i})\"><div class=\"inner\"><div class=\"face front\"><span class=\"emoji\">${ic}<\/span><strong>${name}<\/strong><small>${pick?'✓ Ausgewählt':'Zum Auswählen klicken'}<\/small><\/div><div class=\"face back\"><span class=\"emoji\">${ic}<\/span><strong>${name}<\/strong><small>${correct?'✓ Richtig eingeschätzt':'✕ Noch nicht richtig'}<\/small><\/div><\/div><\/button>`}).join('')}<\/div>${stage==='check'?`<div class=\"note\">Du hast <b>${choices.filter((x,i)=>selected.has(i)===!!x[2]).length} von ${choices.length}<\/b> Kacheln richtig eingeschätzt. <b>Grün<\/b> = richtig entschieden, <b>Rot<\/b> = falsch entschieden, <b>Blass<\/b> = richtigerweise nicht angeklickt.<\/div><div class=\"actions\"><button class=\"btn alt\" onclick=\"stage='choose';render()\">↶ Noch einmal versuchen<\/button><button class=\"btn\" onclick=\"stage='detail';idx=0;render()\">Alle wichtigen Ressourcen entdecken →<\/button><\/div>`:`<button class=\"btn\" onclick=\"stage='check';render()\">Auswahl überprüfen ↻<\/button>`}`;return}\nif(stage==='detail'){progress(30+Math.round(read.size/cards.length*60));let c=cards[idx];app.innerHTML=`<div class=\"counter\">Informationskarte ${idx+1} von ${cards.length} · ${read.size} gelesen<\/div><div class=\"detail-head\"><div class=\"detail-icon\">${c.icon}<\/div><div><h2>${c.name}<\/h2><p class=\"muted\">Was steckt hinter dieser Ressource?<\/p><\/div><\/div><div class=\"factgrid\"><div class=\"fact\"><h3>🔎 Wofür wird sie benötigt?<\/h3><p>${c.what}<\/p><\/div><div class=\"fact\"><h3>🌍 Welche Umweltfolgen gibt es?<\/h3><p>${c.impact}<\/p><\/div><\/div><div class=\"compare\"><div class=\"eyebrow\" style=\"color:#8b630d\">Der Alltagsvergleich<\/div><div class=\"big\">${c.number}<\/div><p>${c.compare}<\/p><\/div>${c.mine?`<h3>⛏️ Entdecke den Kupfer-Tagebau<\/h3><p>Wie verändert sich die Landschaft, wenn eine große Mine entsteht? Klicke auf „Tagebau zeigen“.<\/p><div class=\"mine-photo\"><img id=\"mine-image\" src=\"${minePhotos[mineStep].url}\" alt=\"${minePhotos[mineStep].alt}\" onerror=\"this.style.display='none';this.nextElementSibling.style.display='block'\"><div class=\"mine-fallback\" style=\"display:none\">Das Foto konnte nicht geladen werden. Für diese Bildansicht ist eine Internetverbindung nötig. <a href=\"${minePhotos[mineStep].source}\" target=\"_blank\" rel=\"noopener\">Foto auf Wikimedia Commons ansehen ↗<\/a><\/div><\/div><p class=\"caption\"><strong>${minePhotos[mineStep].title}<\/strong> · ${minePhotos[mineStep].caption}<br>Foto: <a href=\"${minePhotos[mineStep].source}\" target=\"_blank\" rel=\"noopener\">${minePhotos[mineStep].credit} / Wikimedia Commons ↗<\/a> · ${minePhotos[mineStep].license}<\/p><div class=\"actions\"><button class=\"btn alt\" onclick=\"mineStep=(mineStep+minePhotos.length-1)%minePhotos.length;render()\">← Vorheriges Foto<\/button><button class=\"btn\" onclick=\"mineStep=(mineStep+1)%minePhotos.length;render()\">Nächstes Foto →<\/button><\/div><p class=\"caption\">Die ersten beiden Fotos zeigen Chuquicamata, das dritte Foto das Rückhaltebecken der Escondida-Mine – beides in Chile. Es sind keine Vorher-Nachher-Aufnahmen. Rückstände in einem Becken belegen nicht automatisch eine Verschmutzung umliegender Gewässer.<\/p>`:''}<p class=\"source\">Quelle / Vertiefung: ${c.url?`<a target=\"_blank\" rel=\"noopener\" href=\"${c.url}\">${esc(c.source)} ↗<\/a>`:esc(c.source)}<\/p><div class=\"note ${read.has(idx)?'':'warning'}\">${read.has(idx)?'✓ Diese Informationskarte hast du gelesen.':'Lies die Informationen aufmerksam. Bestätige danach, dass du die Karte gelesen hast.'}<\/div><div class=\"actions\"><button class=\"btn alt\" ${idx===0?'disabled':''} onclick=\"idx--;render()\">← Zurück<\/button><button class=\"btn\" onclick=\"read.add(idx);if(idx<cards.length-1)idx++;else if(read.size===cards.length)stage='summary';render()\">${idx===cards.length-1?'Gelesen – Zusammenfassung öffnen ✓':'Gelesen – nächste Karte →'}<\/button><\/div>`;return}\nprogress(100);app.innerHTML=`<div class=\"done\">✓ Alle ${cards.length} Informationskarten gelesen<\/div><h2>Das Wichtigste auf einen Blick<\/h2><p>Du hast entdeckt: KI ist digital – ihre Voraussetzungen sind es nicht. Hier findest du die wichtigsten Größenordnungen und Vergleiche.<\/p><div style=\"overflow:auto\"><table><thead><tr><th>Ressource<\/th><th>Vergleich / Erkenntnis<\/th><th>Wichtig zu wissen<\/th><\/tr><\/thead><tbody>${[['⚡ Strom','415 TWh weltweit (2024)','Alle Rechenzentren, nicht nur KI'],['💧 Wasser','21 Mrd. Liter (Google, 2022)','Rechenzentren und Büros; nicht nur KI'],['🔌 Kupfer','Große Tagebaue verändern Landschaften','Abbau kann Böden und Gewässer belasten'],['🧲 Seltene Erden','Gruppe von 17 Elementen','Nicht mit Kupfer verwechseln'],['🏞️ Fläche','Große Anlagen: mehrere Fußballfelder','Größe variiert je nach Standort'],['❄️ Kühlung','Auch nachts und am Wochenende','Je nach Technik Strom und Wasser'],['🪨 Rohstoffe','Viele Materialien in Chips, Kabeln, Gebäuden','Umweltwirkung beginnt vor der Nutzung'],['🌐 Netze & Daten','Technik außerhalb deines Geräts','Benötigt ebenfalls Strom und Materialien']].map(r=>`<tr>${r.map(v=>`<td>${v}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody><\/table><\/div><div class=\"note\">⚠️ Die Zahlen sind Beispiele mit unterschiedlichen Bezugsgrößen. Man darf sie nicht als Verbrauch einer einzelnen KI-Anfrage verstehen.<\/div><div class=\"actions\"><button class=\"btn alt\" onclick=\"stage='detail';idx=0;render()\">Informationskarten noch einmal ansehen<\/button><button class=\"btn\" onclick=\"window.print()\">🖨️ Zusammenfassung drucken<\/button><a class=\"btn\" style=\"text-decoration:none\" href=\"#\" onclick=\"parent.postMessage('go2','*');return false\">Weiter zu Station 2: Filmcheck →<\/a><\/div>`}\nfunction toggle(i){if(stage!=='choose')return;selected.has(i)?selected.delete(i):selected.add(i);render()}render();<\/script><\/body><\/html>\n", "2": "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Station 2 – KI unter Strom<\/title><style>\n:root{--ink:#163348;--teal:#087f83}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#dff5f1,#eaf2ff 55%,#fff7e8);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}main{max-width:1050px;margin:26px auto 70px;padding:0 18px}.hero{background:linear-gradient(115deg,#095c6b,#167e8a);border-radius:27px;padding:30px 36px;color:white;box-shadow:0 12px 35px #15546825}.eyebrow{font-weight:800;letter-spacing:.12em;font-size:.78rem;text-transform:uppercase;color:#bff5e5}h1{font-size:clamp(1.8rem,4vw,2.9rem);margin:9px 0}h2{margin:0 0 12px;font-size:1.5rem}.progress{height:11px;background:#ffffff50;border-radius:99px;overflow:hidden;margin-top:18px}.progress>div{height:100%;background:#ffc963;transition:width .3s}.panel{background:white;border-radius:25px;padding:27px;margin-top:20px;box-shadow:0 10px 35px #24516d14}p{line-height:1.55}.lead{font-size:1.1rem}.video{background:#102b3c;color:white;border-radius:19px;padding:17px}.video a{color:#102b3c;display:inline-block;background:#b7f5f0;padding:15px 20px;border-radius:12px;font-weight:800;text-decoration:none}.video p{font-size:.9rem}.btn{border:0;border-radius:13px;padding:14px 20px;background:#087e83;color:white;font-weight:800;font-size:1rem;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#e8f3f6;color:#16495b}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}.note{padding:14px 17px;background:#e8f5fc;border-left:5px solid #2484bb;border-radius:12px;margin:18px 0}.question{padding:19px;border:2px solid #dfebee;border-radius:18px;margin:13px 0;background:#fbfefe}.question h3{font-size:1.03rem;margin:0 0 13px;line-height:1.45}.choices{display:flex;gap:12px;flex-wrap:wrap}.choice{cursor:pointer;display:flex;gap:9px;align-items:center;border:2px solid #d7e5e8;padding:12px 17px;border-radius:13px;background:white;font-weight:700;min-width:150px}.choice:has(input:checked){border-color:#087e83;background:#dff5f1}.choice input{accent-color:#087e83;width:18px;height:18px}.question.correct{border-color:#2b9868;background:#f0fbf4}.question.wrong{border-color:#d65c63;background:#fff4f3}.feedback{margin-top:13px;line-height:1.55;font-size:.94rem}.feedback strong{display:block}.score{font-size:2rem;font-weight:900;color:#087e83}.done{display:inline-block;background:#d8f4e5;color:#11613e;border-radius:30px;padding:8px 14px;font-weight:800}a{color:#087e83}.hidden{display:none!important}@media(max-width:650px){.hero{padding:24px}.panel{padding:18px}.choice{flex:1;min-width:115px}}@media print{.actions{display:none}}\n<\/style><\/head><body><main><header class=\"hero\"><div class=\"eyebrow\">KI & Nachhaltigkeit · Klasse 7 · Station 2<\/div><h1>⚡ KI unter Strom<\/h1><div>Was kostet eine KI-Anfrage unsere Umwelt?<\/div><div class=\"progress\"><div id=\"progress\" style=\"width:20%\"><\/div><\/div><\/header><section class=\"panel\" style=\"border:2px solid #087f83\"><b>Dein Weg durch die Stationen:<\/b> <a href=\"#\" onclick=\"parent.postMessage('go1','*');return false\">← Station 1<\/a> &nbsp; | &nbsp; <a href=\"#\" onclick=\"parent.postMessage('go3','*');return false\" style=\"font-weight:800\">Weiter zu Station 3 (auch ohne Film) →<\/a><p style=\"margin-bottom:0\">Falls die ARD am Schulrechner gesperrt ist, kannst du direkt zur nächsten Station wechseln.<\/p><\/section><section class=\"panel\" id=\"film\"><h2>🎬 1. Film ansehen<\/h2><p class=\"lead\">Schau dir den kurzen ARD-Beitrag <b>„Wie klimaschädlich ist Künstliche Intelligenz?“<\/b> aus <i>Wissen vor acht – Erde<\/i> aufmerksam an. Achte besonders auf Rechenzentren, Kühlung und den Unterschied zwischen Texten und Videos.<\/p><div class=\"video\"><p>Klicke auf den Link. Der Film öffnet sich in einem neuen Tab: <a href=\"https://www.ardmediathek.de/video/wissen-vor-acht-erde/wie-klimaschaedlich-ist-kuenstliche-intelligenz/ard/Y3JpZDovL2FyZC5kZS9wbGFuQVJEXzdkNjgzMDg3LTI0ZDktNGJiNi04ZWQ0LTNhZmE4MmI0NDJmZF9nYW56ZVNlbmR1bmc\" target=\"_blank\" rel=\"noopener\">▶ Film in der ARD Mediathek ansehen ↗<\/a><\/p><\/div><div class=\"note\">⏱️ Öffne den Film über den Link oben. Kehre anschließend zu dieser Seite zurück und starte den Filmcheck.<\/div><div class=\"note\" style=\"background:#fff6e5;border-left-color:#e4a437\"><strong>Film lässt sich nicht abspielen?<\/strong> Das kann an den Sicherheitseinstellungen des Schulnetzes liegen. Wenn der ARD-Link nicht funktioniert, kannst du die Station überspringen.<\/div><div class=\"actions\"><button class=\"btn\" onclick=\"document.getElementById('quiz').classList.remove('hidden');document.getElementById('progress').style.width='45%';document.getElementById('quiz').scrollIntoView({behavior:'smooth'})\">Film angesehen – zum Filmcheck →<\/button><a class=\"btn alt\" href=\"#\" onclick=\"parent.postMessage('go3','*');return false\" style=\"text-decoration:none\">Film funktioniert nicht? Station 2 überspringen →<\/a><\/div><\/section><section class=\"panel hidden\" id=\"quiz\"><h2>🧠 2. Filmcheck: Richtig oder falsch?<\/h2><p>Lies die sechs Aussagen. Wähle bei jeder <b>Richtig<\/b> oder <b>Falsch<\/b> und überprüfe anschließend deine Antworten.<\/p><div id=\"questions\"><\/div><div class=\"actions\"><button class=\"btn\" id=\"check\" disabled onclick=\"checkAnswers()\">Meine Antworten überprüfen ✓<\/button><button class=\"btn alt\" onclick=\"resetAnswers()\">Antworten zurücksetzen ↶<\/button><\/div><div id=\"result\" aria-live=\"polite\"><\/div><\/section><section class=\"panel hidden\" id=\"finish\"><span class=\"done\">✓ Filmcheck geschafft<\/span><h2 style=\"margin-top:15px\">Das hast du gelernt<\/h2><p>KI braucht Rechenzentren mit leistungsfähigen Chips. Nicht nur das Rechnen, sondern auch die Kühlung verbraucht Energie. Besonders aufwendige Anwendungen wie KI-Videos können deutlich mehr Strom benötigen als kurze Texte. Deshalb lohnt es sich, KI bewusst einzusetzen.<\/p><div class=\"note\">💡 Die Mikrowellen-Vergleiche aus dem Film sind Beispiele und keine festen Verbrauchswerte für jede KI-Anfrage.<\/div><div class=\"actions\"><a class=\"btn\" style=\"text-decoration:none\" href=\"#\" onclick=\"parent.postMessage('go1','*');return false\">← Station 1 noch einmal ansehen<\/a><button class=\"btn alt\" onclick=\"window.print()\">🖨️ Ergebnis drucken<\/button><\/div><\/section><\/main><script>\nconst questions=[\n['KI-Anfragen werden in großen Rechenzentren verarbeitet, in denen leistungsfähige Computerchips arbeiten.',true,'Im Film wird erklärt, dass viele leistungsfähige Chips in Rechenzentren gleichzeitig KI-Anfragen bearbeiten.'],\n['Die Kühlung der Rechenzentren kann laut Film bis zu 30 Prozent der gesamten Energie verbrauchen.',true,'Der Film nennt diese Schätzung. Der tatsächliche Anteil ist von Rechenzentrum und Kühltechnik abhängig.'],\n['Große Technologieunternehmen veröffentlichen genaue Angaben darüber, wie viel Strom jede KI-Anfrage verbraucht.',false,'Der Beitrag kritisiert, dass verlässliche und detaillierte Angaben oft nicht öffentlich sind.'],\n['Ein kurzer KI-generierter Text benötigt normalerweise mehr Energie als ein KI-generiertes Video.',false,'Der Film betont, dass Bilder und besonders Videos deutlich aufwendiger sein können als kurze Texte.'],\n['Im Film wird die Erzeugung eines kurzen KI-Textes mit ungefähr acht Sekunden Mikrowellenbetrieb verglichen.',true,'Dieser Vergleich kommt im Film vor. Er ist eine Veranschaulichung, kein fester Messwert für jede Textanfrage.'],\n['Der Film empfiehlt, KI möglichst für jede Kleinigkeit zu verwenden.',false,'Der Film empfiehlt, KI bewusst und nur dann einzusetzen, wenn sie wirklich sinnvoll ist.']\n];\nlet submitted=false;const box=document.getElementById('questions');function render(){box.innerHTML=questions.map((q,i)=>`<div class=\"question\" id=\"q${i}\"><h3>${i+1}. ${q[0]}<\/h3><div class=\"choices\"><label class=\"choice\"><input type=\"radio\" name=\"a${i}\" value=\"true\" onchange=\"changed()\"> Richtig<\/label><label class=\"choice\"><input type=\"radio\" name=\"a${i}\" value=\"false\" onchange=\"changed()\"> Falsch<\/label><\/div><div class=\"feedback hidden\" id=\"f${i}\"><\/div><\/div>`).join('')}function changed(){document.getElementById('check').disabled=!questions.every((_,i)=>document.querySelector(`input[name=a${i}]:checked`));if(submitted){submitted=false;document.getElementById('result').innerHTML='';document.getElementById('finish').classList.add('hidden');document.querySelectorAll('.question').forEach(e=>e.classList.remove('correct','wrong'));document.querySelectorAll('.feedback').forEach(e=>e.classList.add('hidden'));document.getElementById('progress').style.width='45%'}}function checkAnswers(){submitted=true;let score=0;questions.forEach((q,i)=>{let v=document.querySelector(`input[name=a${i}]:checked`).value==='true',ok=v===q[1];if(ok)score++;let e=document.getElementById(`q${i}`);e.classList.toggle('correct',ok);e.classList.toggle('wrong',!ok);let f=document.getElementById(`f${i}`);f.classList.remove('hidden');f.innerHTML=`<strong>${ok?'✓ Richtig!':'✕ Noch nicht richtig. Richtige Antwort: '+(q[1]?'Richtig':'Falsch')+'.'}<\/strong>${q[2]}`});document.getElementById('result').innerHTML=`<div class=\"note\"><div class=\"score\">${score} von 6 richtig<\/div>${score===6?'Prima! Du hast alle Aussagen richtig eingeschätzt.':'Lies dir die Erklärungen zu deinen Antworten durch. Du kannst sie danach verbessern.'}<\/div>`;document.getElementById('progress').style.width=score===6?'100%':'80%';document.getElementById('finish').classList.toggle('hidden',score!==6);if(score===6)document.getElementById('finish').scrollIntoView({behavior:'smooth',block:'start'})}function resetAnswers(){render();submitted=false;document.getElementById('check').disabled=true;document.getElementById('result').innerHTML='';document.getElementById('finish').classList.add('hidden');document.getElementById('progress').style.width='45%'}render();\n<\/script><div style=\"max-width:1050px;margin:0 auto 35px;padding:0 18px\"><a href=\"#\" onclick=\"parent.postMessage('go3','*');return false\" style=\"display:inline-block;background:#087f83;color:white;border-radius:13px;padding:14px 20px;text-decoration:none;font-weight:800\">Weiter zu Station 3: Wasser & Toilettenspülung →<\/a><\/div><\/body><\/html>\n", "3": "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Station 3 – KI, Wasser und die Toilettenspülung<\/title><style>\n*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#183648;background:linear-gradient(130deg,#e0f7f4,#edf3ff 55%,#fff6e8)}main{max-width:1000px;margin:24px auto 70px;padding:0 17px}.hero{border-radius:28px;background:linear-gradient(110deg,#075d70,#18868a);color:white;padding:28px 34px;box-shadow:0 12px 34px #17485b24}.tag{letter-spacing:.12em;text-transform:uppercase;color:#bdf4e7;font-size:.8rem;font-weight:850}h1{font-size:clamp(1.8rem,4.5vw,2.8rem);margin:8px 0}h2{margin:0 0 12px;font-size:1.55rem}p{line-height:1.6}.progress{height:11px;border-radius:20px;background:#ffffff45;overflow:hidden;margin-top:18px}.progress span{display:block;height:100%;width:15%;background:#ffcc6b;transition:width .35s}.panel{background:white;border-radius:25px;padding:27px;margin-top:20px;box-shadow:0 10px 35px #24516d15}.muted{color:#536b78}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.stat{background:#eaf7f6;border-radius:18px;padding:17px;text-align:center;flex:1;min-width:180px}.stat strong{display:block;font-size:2rem;color:#087d84}.people{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:18px 0}.person{font-size:1.6rem;text-align:center;background:#edf1f4;border-radius:11px;padding:8px 0;filter:grayscale(1);opacity:.35;transition:.2s}.person.on{background:#d3f3ed;filter:none;opacity:1}.person{border:2px solid transparent;cursor:pointer;font-family:inherit}.person:hover{border-color:#0d8991;opacity:.8}.person:focus-visible{outline:3px solid #ffbd59;outline-offset:2px}.person.on{border-color:#087f87}.day-button.active{background:#087f87;color:white}.day-button{min-width:44px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:20px 0}label{font-weight:700;display:block;margin-bottom:9px}input[type=range]{width:100%;accent-color:#0d8991;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:9px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#087f87;color:white;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #08616a}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #08616a}.btn.secondary{background:#e2f3f1;color:#075c67;box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}.meter{height:15px;background:#dce6eb;border-radius:20px;overflow:hidden}.meter span{display:block;height:100%;width:1%;background:linear-gradient(90deg,#49bdb7,#067b83);transition:width .3s}.notice{padding:16px;border-radius:15px;background:#fff4d9;border-left:5px solid #e7aa2b;margin-top:15px}.hidden{display:none!important}.toiletArea{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:center}.toiletScene{position:relative;min-height:390px;background:linear-gradient(#f1fafb 70%,#d7e7e9 70%);border-radius:23px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;padding-bottom:23px}.toilet{width:220px;max-width:70%;filter:drop-shadow(0 9px 8px #4565)}.chain{position:absolute;top:0;left:64%;width:45px;height:190px;cursor:pointer;border:0;background:transparent;padding:0;touch-action:manipulation}.chain .line{display:block;width:4px;height:145px;margin:auto;background:repeating-linear-gradient(to bottom,#65737d 0 6px,#c5cbd0 6px 11px);border-radius:3px}.chain .handle{display:block;background:#d6ad4b;border:4px solid #94752d;border-radius:50%;width:34px;height:34px;margin:auto;box-shadow:0 3px 5px #0003}.chain.pull{animation:pull .45s ease-in-out}@keyframes pull{50%{transform:translateY(30px)}}.splash{position:absolute;bottom:105px;font-size:3.3rem;opacity:0;pointer-events:none}.splash.active{animation:splash .65s ease-out}@keyframes splash{20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.7)}}.big{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;color:#087f87}.water{height:185px;border:5px solid #a4c4d0;border-radius:16px 16px 23px 23px;position:relative;overflow:hidden;background:#f5fafc;max-width:210px;margin:15px auto}.water .fill{position:absolute;bottom:0;width:100%;height:0%;background:linear-gradient(#64d4e8,#2096c6);transition:height .4s}.water .txt{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:1.6rem;text-shadow:0 1px white}.compare{display:grid;grid-template-columns:1fr 1fr;gap:13px}.comparison{background:#eaf6f5;border-radius:16px;padding:17px}.comparison h3{margin:0 0 7px}.comparison strong{font-size:1.5rem;color:#087c83}.small{font-size:.88rem}.footer{margin:23px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#076b78}a.btn{text-decoration:none;display:inline-block}button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid #ffbd59;outline-offset:3px}@media(max-width:650px){.controls,.toiletArea,.compare{grid-template-columns:1fr}.panel{padding:19px}.person{font-size:1.25rem}.toiletScene{min-height:340px}.chain{left:65%}}\n<\/style><\/head><body><main><header class=\"hero\"><div class=\"tag\">KI & Nachhaltigkeit · Station 3<\/div><h1>💧 KI, Wasser und die Toilettenspülung<\/h1><p>Wie aus wenigen KI-Fragen ganz schnell Tausende werden – und was das mit Wasser zu tun hat.<\/p><div class=\"progress\" aria-label=\"Fortschritt\"><span id=\"progress\"><\/span><\/div><\/header>\n<section class=\"panel\" id=\"classPanel\"><h2>👩‍🎓 Experiment 1: Deine Klasse nutzt KI<\/h2><p>Stell dir vor, jeder Schüler stellt <b>10 KI-Textanfragen pro Tag<\/b>. Wie schnell erreicht eure Klasse 1.000 Anfragen? Probiere es aus!<\/p><p class=\"muted small\"><b>Klicke jede Person einzeln an<\/b>, um sie zur KI-Gruppe hinzuzufügen. Ein erneuter Klick entfernt sie wieder.<\/p><div class=\"people\" id=\"people\" aria-label=\"30 einzeln anklickbare Schülerinnen und Schüler\"><\/div><div class=\"controls\"><div><label>Wie viele Schüler machen mit? <strong id=\"studentLabel\">0<\/strong> von 30<\/label><div class=\"buttons\"><button class=\"btn secondary\" type=\"button\" onclick=\"selectAll()\">Alle 30 auswählen<\/button><button class=\"btn secondary\" type=\"button\" onclick=\"clearStudents()\">Auswahl löschen<\/button><\/div><\/div><div><label>Wie viele Tage in einer Woche wird KI genutzt? <strong id=\"dayLabel\">1<\/strong><\/label><div class=\"buttons\" id=\"dayButtons\" role=\"group\" aria-label=\"Tage pro Woche wählen\"><\/div><\/div><\/div><div class=\"row\"><div class=\"stat\"><span>KI-Anfragen insgesamt<\/span><strong id=\"queryCount\">10<\/strong><\/div><div class=\"stat\"><span>Bis zu 1.000 fehlen noch<\/span><strong id=\"remaining\">990<\/strong><\/div><\/div><p><b>Fortschritt bis 1.000 Anfragen<\/b><\/p><div class=\"meter\"><span id=\"meter\"><\/span><\/div><div id=\"reached\" class=\"notice hidden\">🎉 <b>Geschafft!<\/b> Ihr habt mindestens 1.000 Anfragen erreicht! Das geht sogar innerhalb einer einzigen Woche. Schaut auf euren Zähler!<\/div><div class=\"footer\"><span class=\"muted small\">Beispielklasse: 30 Personen · jede stellt 10 Anfragen pro Nutzungstag.<\/span><button id=\"next\" class=\"btn\" disabled onclick=\"startToilet()\">Weiter zum Toiletten-Experiment →<\/button><\/div><\/section>\n<section class=\"panel hidden\" id=\"toiletPanel\"><h2>🚽 Experiment 2: Zieh an der Spülkette!<\/h2><p>Jetzt vergleichen wir <b>1.000 KI-Textanfragen<\/b> mit dem Wasserverbrauch einer Toilette. Ein Spülgang verbraucht in unserem Beispiel <b>4,5 Liter Wasser<\/b>.<\/p><p><b>Deine Aufgabe:<\/b> Wie oft könnte man die Toilette spülen, um ungefähr so viel Wasser zu verbrauchen wie bei 1.000 KI-Textanfragen? <b>Zieh so oft an der Kette, wie du vermutest!<\/b><\/p><div class=\"toiletArea\"><div class=\"toiletScene\"><svg class=\"toilet\" viewBox=\"0 0 240 285\" role=\"img\" aria-label=\"Weiße Toilette mit hohem Spülkasten und Sitz\"><rect x=\"62\" y=\"5\" width=\"116\" height=\"77\" rx=\"12\" fill=\"#fefefe\" stroke=\"#7196a7\" stroke-width=\"6\"/><rect x=\"78\" y=\"17\" width=\"84\" height=\"12\" rx=\"6\" fill=\"#e6f3f7\"/><path d=\"M95 80h50v44H95z\" fill=\"#fdfefe\" stroke=\"#7196a7\" stroke-width=\"6\"/><path d=\"M38 120q4-17 22-17h120q22 0 22 17v18H38z\" fill=\"#f9ffff\" stroke=\"#7196a7\" stroke-width=\"6\"/><ellipse cx=\"120\" cy=\"144\" rx=\"82\" ry=\"25\" fill=\"#fdfefe\" stroke=\"#7196a7\" stroke-width=\"6\"/><ellipse cx=\"120\" cy=\"147\" rx=\"54\" ry=\"14\" fill=\"#c7e9f1\"/><path d=\"M54 149q0 56 35 91v26h84v-26q27-37 26-91\" fill=\"#f9ffff\" stroke=\"#7196a7\" stroke-width=\"6\"/><path d=\"M87 262h91v16H79z\" fill=\"#edf8fb\" stroke=\"#7196a7\" stroke-width=\"5\"/><\/svg><button id=\"chain\" class=\"chain\" onclick=\"flush()\" aria-label=\"An der Spülkette ziehen\"><span class=\"line\"><\/span><span class=\"handle\"><\/span><\/button><div id=\"splash\" class=\"splash\">💦<\/div><\/div><div style=\"text-align:center\"><p class=\"muted\">Du hast gespült:<\/p><div class=\"big\" id=\"flushCount\" aria-live=\"polite\">0-mal<\/div><p class=\"muted\">Das entspricht<\/p><div class=\"big\" id=\"waterCount\">0 Liter<\/div><div class=\"water\" aria-hidden=\"true\"><div id=\"waterFill\" class=\"fill\"><\/div><div id=\"waterText\" class=\"txt\">0 L<\/div><\/div><div class=\"buttons\" style=\"justify-content:center\"><button class=\"btn secondary\" onclick=\"undo()\">↶ Eine Spülung zurück<\/button><button class=\"btn secondary\" onclick=\"resetFlush()\">Neu schätzen<\/button><\/div><\/div><\/div><div class=\"notice\">💡 <b>Für unser Experiment<\/b> verwenden wir einen vereinfachten Vergleichswert. Wie viel Wasser genau gebraucht wird, hängt von der KI und der Berechnung ab. Schätze zunächst selbst!<\/div><div class=\"footer\"><button class=\"btn\" onclick=\"reveal()\">Meine Schätzung überprüfen →<\/button><\/div><\/section>\n<section class=\"panel hidden\" id=\"resultPanel\"><h2>🔎 Auflösung: Wie nah war deine Schätzung?<\/h2><p>Du hast <b id=\"resultFlush\">0-mal<\/b> gespült. Das sind <b id=\"resultLiters\">0 Liter<\/b>.<\/p><div class=\"compare\"><div class=\"comparison\"><h3>💧 Unser Vergleichswert<\/h3><strong>15 Liter<\/strong><p>Für <b>1.000 KI-Textanfragen<\/b> rechnen wir in diesem Spiel vereinfacht mit <b>15 Litern Wasser<\/b>.<\/p><p>Das entspricht ungefähr <b>3 bis 4 Toilettenspülungen<\/b> mit je 4,5 Litern.<\/p><\/div><div class=\"comparison\"><h3>🚽 Deine Schätzung<\/h3><strong id=\"guessVerdict\">–<\/strong><p id=\"guessExplanation\">Vergleiche deine Spülungen mit dem Modellwert.<\/p><p class=\"small muted\">Drei Spülungen: 13,5 Liter. Vier Spülungen: 18 Liter.<\/p><\/div><\/div><div class=\"notice\"><b>Beachte!<\/b> Hierbei handelt es sich um einen Mittelwert. Die Werte hängen stark vom Standort und vom verwendeten KI-Modell ab.<\/div><p class=\"small muted\"><b>Quellen und Einordnung:<\/b> Google (2025), „Measuring the environmental impact of delivering AI at Google Scale“; Li et al., „Making AI Less Thirsty“ (GPT-3); <a href=\"https://www.fiegenbaum.solutions/blog/ki-wasserverbrauch-wie-viel-wasser-verbraucht-eine-anfrage\" target=\"_blank\" rel=\"noopener\">Zusammenstellung zum KI-Wasserverbrauch (September 2026)<\/a>. Der Unterrichtswert von 15 Litern ist eine didaktische Näherung, keine Prognose für eine bestimmte KI.<\/p><div class=\"footer\"><button class=\"btn secondary\" onclick=\"retry()\">↶ Noch einmal ausprobieren<\/button><a class=\"btn\" href=\"#\" onclick=\"parent.postMessage('go2','*');return false\">← Zurück zu Station 2<\/a> <a class=\"btn\" href=\"#\" onclick=\"parent.postMessage('go4','*');return false\">✓ Zum Start zurück<\/a><\/div><\/section>\n<\/main><script>\nconst $=id=>document.getElementById(id);let flushes=0;let shown=false;let selected=new Set();let days=1;const nf=n=>n.toLocaleString('de-DE');\n$('people').innerHTML=Array.from({length:30},(_,i)=>`<button type=\"button\" class=\"person\" id=\"p${i}\" aria-pressed=\"false\" aria-label=\"Person ${i+1} auswählen\" onclick=\"toggleStudent(${i})\">🧑‍🎓<\/button>`).join('');\n$('dayButtons').innerHTML=Array.from({length:7},(_,i)=>`<button type=\"button\" class=\"btn secondary day-button\" id=\"d${i+1}\" aria-pressed=\"false\" onclick=\"setDays(${i+1})\">${i+1}<\/button>`).join('');\nfunction updateClass(){const count=selected.size,q=count*10*days;$('studentLabel').textContent=count;$('dayLabel').textContent=days;$('queryCount').textContent=nf(q);$('remaining').textContent=nf(Math.max(0,1000-q));$('meter').style.width=Math.min(100,q/1000*100)+'%';for(let i=0;i<30;i++){const active=selected.has(i),p=$('p'+i);p.classList.toggle('on',active);p.setAttribute('aria-pressed',String(active));p.setAttribute('aria-label',`Person ${i+1} ${active?'abwählen':'auswählen'}`)}for(let i=1;i<=7;i++){const btn=$('d'+i);btn.classList.toggle('active',i===days);btn.setAttribute('aria-pressed',String(i===days))}$('reached').classList.toggle('hidden',q<1000);$('next').disabled=q<1000;$('progress').style.width=q>=1000?'38%':'15%'}\nfunction toggleStudent(i){if(selected.has(i))selected.delete(i);else selected.add(i);updateClass()}\nfunction selectAll(){selected=new Set(Array.from({length:30},(_,i)=>i));updateClass()}\nfunction clearStudents(){selected.clear();updateClass()}\nfunction setDays(n){days=n;updateClass()}\nfunction startToilet(){$('toiletPanel').classList.remove('hidden');$('progress').style.width='65%';$('toiletPanel').scrollIntoView({behavior:'smooth',block:'start'})}function updateFlush(){$('flushCount').textContent=flushes+'-mal';let v=flushes*4.5;$('waterCount').textContent=nf(v)+' Liter';$('waterText').textContent=nf(v)+' L';$('waterFill').style.height=Math.min(100,v/50*100)+'%'}function flush(){if(flushes>=30)return;flushes++;updateFlush();$('chain').classList.remove('pull');$('splash').classList.remove('active');void $('chain').offsetWidth;$('chain').classList.add('pull');$('splash').classList.add('active')}function undo(){flushes=Math.max(0,flushes-1);updateFlush()}function resetFlush(){flushes=0;updateFlush()}function reveal(){$('resultFlush').textContent=flushes+'-mal';$('resultLiters').textContent=nf(flushes*4.5)+' Liter';$('guessVerdict').textContent=(flushes===3||flushes===4)?'Sehr nah dran!':(flushes<3?'Etwas niedrig geschätzt':'Etwas hoch geschätzt');$('guessExplanation').textContent='Du hast '+flushes+' Spülungen gewählt. Unser Vergleichswert liegt bei etwa 3 bis 4 Spülungen.';$('resultPanel').classList.remove('hidden');$('progress').style.width='100%';$('resultPanel').scrollIntoView({behavior:'smooth',block:'start'})}function retry(){$('resultPanel').classList.add('hidden');resetFlush();$('progress').style.width='65%';$('toiletPanel').scrollIntoView({behavior:'smooth',block:'start'})}updateClass();\n<\/script><\/body><\/html>\n",
"4": "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Station 4 · KI und Handy-Akku<\/title><style>\n:root{--ink:#163348;--muted:#526b73;--blue:#087f83;--light:#e8f7f4;--green:#087f83;--bg:#eaf5f6;--line:#cce5e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}.wrap{max-width:960px;margin:auto;padding:26px 18px 60px}.top{background:linear-gradient(115deg,#103d54,#087f83);color:white;border-radius:22px;padding:28px 32px;border-bottom:5px solid #ffda76}.eyebrow{font-weight:750;letter-spacing:.09em;font-size:13px;text-transform:uppercase;opacity:.9}h1{font-size:clamp(29px,4vw,42px);line-height:1.15;margin:8px 0 10px}h2{font-size:23px;line-height:1.25;margin:0 0 14px}p{margin:8px 0 14px}.top p{max-width:720px;margin-bottom:0}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin-top:18px;box-shadow:0 6px 18px #103d5410}.tag{display:inline-block;background:#dff5f1;color:#095c6b;border-radius:30px;padding:4px 12px;font-weight:750;font-size:13px;margin-bottom:12px}.note{background:#e8f7f4;border-left:5px solid #087f83;border-radius:9px;padding:14px 17px;font-size:15px}.sim{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(240px,.7fr);gap:24px;align-items:center}.control label{display:block;font-weight:750;margin:12px 0 8px}input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button{font:inherit;cursor:pointer;border:2px solid #b7e1e5;border-radius:11px;background:white;color:var(--ink);font-weight:700;padding:9px 16px}button:hover,button:focus-visible{border-color:var(--blue);outline-offset:3px}button.active{background:#dff5f1;border-color:var(--blue);color:#095c6b}.battery-panel{background:#f0fafb;border-radius:17px;padding:20px;text-align:center}.battery{height:98px;width:min(100%,260px);border:6px solid #16495b;border-radius:16px;position:relative;margin:8px auto 18px;padding:5px;background:white}.battery:after{content:'';position:absolute;right:-15px;top:27px;height:32px;width:10px;background:#16495b;border-radius:0 6px 6px 0}.fill{height:100%;width:100%;border-radius:7px;background:#21a78b;transition:width .25s,background .25s}.battery-label{font-size:30px;font-weight:850}.muted{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.metric{background:#f0fafb;border-radius:12px;padding:13px;text-align:center}.metric strong{display:block;font-size:23px;color:#087f83}.metric span{font-size:13px;color:var(--muted)}fieldset{border:0;padding:0;margin:0}legend{font-weight:750;margin-bottom:10px}.options{display:grid;gap:10px}.option{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px 15px;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:#e8f7f4}.option input{margin-top:6px;accent-color:var(--blue)}.primary{background:var(--blue);border-color:var(--blue);color:white;margin-top:16px}.primary:hover{background:#095c6b}.feedback{margin-top:14px;border-radius:12px;padding:14px 16px;background:#dff5f1;border:1px solid #9bd9cb}.feedback.bad{background:#fff6e8;border-color:#f0c885}.hidden{display:none}.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}@media(max-width:700px){.sim{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.card{padding:20px}.top{padding:24px}}\n<\/style><\/head><body><main class=\"wrap\"><header class=\"top\"><div class=\"eyebrow\">KI & Nachhaltigkeit · Station 4<\/div><h1>Wie viel Handy-Akku steckt in KI?<\/h1><p>Entdecke mit einem interaktiven Rechenmodell, warum viele kleine KI-Anfragen zusammen Energie benötigen.<\/p><\/header>\n<section class=\"card\"><span class=\"tag\">1 · Verstehen<\/span><h2>Eine KI-Anfrage braucht Strom<\/h2><p>Wenn du eine KI um eine Antwort bittest, arbeiten dafür Computer in einem Rechenzentrum. Sie verbrauchen elektrische Energie. Wir vergleichen diese Energie mit der Speicherkapazität eines Handy-Akkus.<\/p><div class=\"note\"><strong>Unser Rechenbeispiel:<\/strong> Ein Handy-Akku speichert <strong>15 Wattstunden (Wh)<\/strong>. Für eine kurze KI-Textanfrage setzen wir beispielhaft <strong>0,3 Wh<\/strong> an. Das sind <strong>Modellannahmen für diese Aufgabe<\/strong>, keine festen Verbrauchswerte aller Handys oder KI-Systeme. Der echte Verbrauch kann stark abweichen.<\/div><\/section>\n<section class=\"card\"><span class=\"tag\">2 · Ausprobieren<\/span><h2>Du bestimmst die Zahl der KI-Anfragen<\/h2><div class=\"sim\"><div class=\"control\"><label for=\"queries\">Anzahl der KI-Textanfragen: <output id=\"queryOut\">10<\/output><\/label><input id=\"queries\" type=\"range\" min=\"0\" max=\"150\" step=\"1\" value=\"10\"><div class=\"ticks\"><span>0<\/span><span>75<\/span><span>150<\/span><\/div><div class=\"quick\" aria-label=\"Schnellauswahl\"><button type=\"button\" data-count=\"10\" class=\"active\">10<\/button><button type=\"button\" data-count=\"25\">25<\/button><button type=\"button\" data-count=\"50\">50<\/button><button type=\"button\" data-count=\"100\">100<\/button><\/div><p class=\"muted\" style=\"margin-top:17px;font-size:15px\">Stell dir vor: So viel Energie würde für diese Zahl von Anfragen im Rechenmodell benötigt.<\/p><\/div><div class=\"battery-panel\"><div class=\"muted\">Verbleibende Vergleichsenergie<\/div><div class=\"battery\" role=\"img\" aria-label=\"Vergleichs-Akku\"><div id=\"batteryFill\" class=\"fill\"><\/div><\/div><div id=\"batteryPercent\" class=\"battery-label\">80 %<\/div><div class=\"muted\" id=\"batteryNote\">entspricht 20 % eines Akkus verbraucht<\/div><\/div><\/div><div class=\"metrics\"><div class=\"metric\"><strong id=\"energy\">3,0 Wh<\/strong><span>Energie für KI-Anfragen<\/span><\/div><div class=\"metric\"><strong id=\"equivalent\">20 %<\/strong><span>eines 15-Wh-Akkus<\/span><\/div><div class=\"metric\"><strong id=\"batteries\">0,2<\/strong><span>Akku-Ladungen als Energievergleich<\/span><\/div><\/div><p class=\"note\" style=\"margin-top:16px\"><strong>Wichtig:<\/strong> Der Akku wird hier <em>nur als Vergleichsmaßstab<\/em> verwendet. Deine KI-Anfragen entladen nicht unmittelbar deinen Handy-Akku um diesen Betrag – der Strom wird überwiegend in Rechenzentren verbraucht.<\/p><\/section>\n<section class=\"card\"><span class=\"tag\">3 · Nachdenken<\/span><h2>Knacke die Akku-Frage<\/h2><fieldset><legend>Wie viele Anfragen entsprechen in unserem Rechenbeispiel ungefähr der Energie einer vollständigen Handy-Akkuladung?<\/legend><div class=\"options\"><label class=\"option\"><input type=\"radio\" name=\"answer\" value=\"10\">10 Anfragen<\/label><label class=\"option\"><input type=\"radio\" name=\"answer\" value=\"50\">50 Anfragen<\/label><label class=\"option\"><input type=\"radio\" name=\"answer\" value=\"100\">100 Anfragen<\/label><\/div><\/fieldset><button class=\"primary\" type=\"button\" id=\"check\">Antwort prüfen<\/button><div id=\"feedback\" class=\"feedback hidden\" role=\"status\" aria-live=\"polite\"><\/div><\/section>\n<section class=\"card\"><span class=\"tag\">4 · Mitnehmen<\/span><h2>Was bedeutet das für unseren Alltag?<\/h2><p>Eine einzelne Anfrage kann wenig Energie benötigen. Wenn aber sehr viele Menschen KI häufig verwenden, summiert sich der Energiebedarf. Besonders aufwendige Aufgaben können deutlich mehr Energie benötigen als kurze Textantworten.<\/p><p><strong>Dein Merksatz:<\/strong> Nutze KI dort, wo sie dir wirklich hilft – und überlege, ob du eine einfache Frage manchmal auch ohne KI beantworten kannst.<\/p><\/section><div class=\"foot\">Eigenständige Station · funktioniert offline · keine weiteren Dateien erforderlich<\/div><\/main>\n<script>\n(()=>{'use strict';const q=document.getElementById('queries'),out=document.getElementById('queryOut'),energy=document.getElementById('energy'),eq=document.getElementById('equivalent'),batteries=document.getElementById('batteries'),fill=document.getElementById('batteryFill'),pct=document.getElementById('batteryPercent'),note=document.getElementById('batteryNote'),buttons=[...document.querySelectorAll('[data-count]')];const fmt=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1,minimumFractionDigits:1});function update(){const n=Number(q.value),wh=n*.3,share=wh/15,remaining=Math.max(0,100-share*100);out.textContent=n;energy.textContent=fmt(wh)+' Wh';eq.textContent=Math.round(share*100)+' %';batteries.textContent=fmt(share);fill.style.width=remaining+'%';fill.style.background=remaining>35?'#21a78b':remaining>10?'#f0b84b':'#e66d60';pct.textContent=Math.round(remaining)+' %';note.textContent=share<=1?'entspricht '+Math.round(share*100)+' % eines Akkus verbraucht':'Energievergleich: '+fmt(share)+' ganze Akkuladungen';buttons.forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===n));}q.addEventListener('input',update);buttons.forEach(b=>b.addEventListener('click',()=>{q.value=b.dataset.count;update()}));document.getElementById('check').addEventListener('click',()=>{const selected=document.querySelector('input[name=\"answer\"]:checked'),f=document.getElementById('feedback');f.classList.remove('hidden','bad');if(!selected){f.classList.add('bad');f.textContent='Bitte wähle zuerst eine Antwort aus.';return}if(selected.value==='50'){f.innerHTML='<strong>Richtig!<\/strong> 50 × 0,3 Wh = 15 Wh. Das entspricht der Energie einer vollständigen Akkuladung in unserem Modell.';}else{f.classList.add('bad');f.innerHTML='<strong>Noch nicht ganz.<\/strong> Rechne: 15 Wh ÷ 0,3 Wh pro Anfrage. Probiere es noch einmal!';}});update()})();\n<\/script><div style=\"max-width:960px;margin:15px auto 45px;padding:15px 20px;background:#fff;border:1px solid #cce5e4;border-radius:16px;font:700 16px system-ui,sans-serif;display:flex;gap:12px;flex-wrap:wrap\"><a style=\"color:#087f83\" href=\"#\" onclick=\"parent.postMessage('go3','*');return false\">← Vorherige Station<\/a><a style=\"color:#087f83;margin-left:auto\" href=\"#\" onclick=\"parent.postMessage('go5','*');return false\">Weiter zu Station 5 →<\/a><\/div><\/body><\/html>\n",
"5": "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>KI-Führerschein – KI im Alltag<\/title><style>\n:root{--ink:#103c46;--teal:#087e86;--mint:#e8f8f3;--yellow:#ffd96b;--line:#c9e6e2}*{box-sizing:border-box}body{margin:0;background:#f2faf8;color:var(--ink);font:17px/1.5 system-ui,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}header{background:linear-gradient(115deg,#103c46,#07858b);color:white;padding:32px 24px;border-radius:22px;box-shadow:0 10px 30px #164d4d18}header .tag{display:inline-block;background:var(--yellow);color:#213c3e;padding:5px 13px;border-radius:40px;font-weight:800;font-size:13px}h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:14px 0 8px}h2{font-size:23px}p{margin:8px 0 14px}.intro,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.cat{padding:14px;border-radius:14px;background:var(--mint);border:1px solid var(--line);font-size:15px}.cat strong{display:block;font-size:17px;margin-bottom:5px}.progress{height:13px;background:#dcefeb;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#12a49d;transition:width .3s}.small{font-size:14px;color:#527179}.situation{font-size:22px;font-weight:750;margin:12px 0 22px}.choices{display:grid;gap:11px}.choice{font:inherit;text-align:left;padding:15px 18px;background:#fff;border:2px solid #bedbd8;border-radius:13px;cursor:pointer;color:var(--ink);font-weight:700}.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--teal);background:#f1fcf8}.choice:disabled{cursor:default}.choice.correct{background:#d7f5e5;border-color:#14845c}.choice.wrong{background:#fff0e5;border-color:#d87d43}.feedback{padding:16px;border-radius:14px;background:#f0f9f5;border-left:5px solid #14977b;margin-top:18px}.btn{background:var(--teal);color:white;border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e6f3f1;color:var(--ink)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.result{background:#fff8e0;border:1px solid #efd47d;border-radius:15px;padding:17px}.eco{background:#e8f8f3;border:2px solid #65c9b2;border-radius:16px;padding:18px;margin-top:18px}.eco strong{font-size:23px}.decision{margin-top:19px;padding:17px;background:#f7fbf7;border:1px solid var(--line);border-radius:15px}.decision .choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choice.avoid{background:#dcf8e7;border-color:#48a67b}.eco-note{font-size:14px;color:#456b70}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.count{border-radius:13px;background:var(--mint);text-align:center;padding:12px}.count b{font-size:27px;display:block}textarea{width:100%;min-height:100px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit}footer{font-size:13px;color:#5a7679;margin:25px 0}@media(max-width:650px){.categories,.counts,.decision .choices{grid-template-columns:1fr}.wrap{padding:12px}header{padding:23px 18px}.intro,.panel{padding:17px}}\n<\/style><\/head><body><main class=\"wrap\"><header><span class=\"tag\">KI-FÜHRERSCHEIN · ALLTAGS-CHECK<\/span><h1>🤖 KI im Alltag: Brauche ich sie wirklich?<\/h1><p>13 gemischte Alltagssituationen: Wann hilft KI wirklich – und wann sparst du durch einen Verzicht Strom und Wasser?<\/p><\/header><section class=\"intro\"><h2>Deine Aufgabe<\/h2><p>Lies jede Situation und wähle zuerst die passendste Einschätzung. Entscheide danach selbst, ob du KI dafür nutzen möchtest. Du erhältst eine Erklärung und siehst, welche Ressourcen du durch einen Verzicht sparen kannst. Es geht nicht darum, KI grundsätzlich gut oder schlecht zu finden, sondern sie <strong>bewusst und verantwortungsvoll<\/strong> einzusetzen.<\/p><div class=\"categories\"><div class=\"cat\"><strong>🚫 Überflüssig<\/strong>Eine einfache Lösung ohne KI ist hier sinnvoller.<\/div><div class=\"cat\"><strong>💡 Wirklich hilfreich<\/strong>KI kann dich bei einer passenden Aufgabe sinnvoll unterstützen.<\/div><div class=\"cat\"><strong>⚖️ Erst nachdenken!<\/strong>KI spart Zeit, kann aber Lernen oder Eigenleistung ersetzen.<\/div><\/div><\/section><section class=\"panel\" id=\"game\"><div class=\"small\" id=\"progressText\" aria-live=\"polite\">Situation 1 von 13<\/div><div class=\"progress\" role=\"progressbar\" aria-label=\"Fortschritt\"><div class=\"bar\" id=\"bar\"><\/div><\/div><h2 id=\"headline\">Was würdest du tun?<\/h2><div class=\"situation\" id=\"situation\"><\/div><div class=\"choices\" id=\"choices\"><\/div><div class=\"feedback hidden\" id=\"feedback\" role=\"status\"><\/div><div class=\"decision hidden\" id=\"decision\"><strong>🌍 Und wie entscheidest du dich persönlich?<\/strong><p>Beide Entscheidungen sind möglich. Überlege, ob der Nutzen den zusätzlichen Ressourcenverbrauch rechtfertigt.<\/p><div class=\"choices\"><button class=\"choice avoid\" id=\"avoid\">🌱 Ich verzichte auf KI<\/button><button class=\"choice\" id=\"use\">🤖 Ich nutze KI bewusst<\/button><\/div><p class=\"small\" id=\"decisionFeedback\" aria-live=\"polite\"><\/p><\/div><div class=\"eco\" aria-live=\"polite\"><div>🌿 <strong>Deine Umweltbilanz<\/strong><\/div><div id=\"ecoLive\">0 vermiedene KI-Anfragen · ca. 0,0 ml Wasser · ca. 0,0 Wh Strom<\/div><div class=\"eco-note\">Vereinfachtes Rechenmodell: 1 vermiedene Textanfrage ≈ 0,3 ml Wasser und 0,3 Wh Strom. Tatsächliche Werte variieren stark nach KI-Modell, Rechenzentrum und Berechnungsmethode. Es sind keine exakt messbaren persönlichen Einsparungen.<\/div><\/div><div class=\"controls\"><button class=\"btn\" id=\"next\" disabled>Nächste Situation →<\/button><button class=\"btn secondary\" id=\"restart\">Neu beginnen<\/button><\/div><\/section><section class=\"panel hidden\" id=\"end\"><h2>🎉 Geschafft! Dein KI-Kompass<\/h2><p>Du hast alle 13 Situationen durchdacht. Entscheidend ist nicht nur, ob KI etwas <em>kann<\/em>, sondern ob ihr Einsatz <strong>sinnvoll, fair und lernförderlich<\/strong> ist.<\/p><div class=\"counts\"><div class=\"count\"><b>5<\/b>überflüssig<\/div><div class=\"count\"><b>5<\/b>hilfreich<\/div><div class=\"count\"><b>3<\/b>erst nachdenken<\/div><\/div><div class=\"result\" id=\"score\"><\/div><div class=\"eco\"><strong>🌍 Deine Entscheidung für die Umwelt<\/strong><p id=\"ecoFinal\"><\/p><p class=\"eco-note\">Diese Modellrechnung berücksichtigt nur angenommene Textanfragen. Andere Nutzungen können deutlich mehr oder weniger verbrauchen.<\/p><\/div><div class=\"result\" style=\"margin-top:16px\"><strong>Unser Merksatz für den KI-Führerschein:<\/strong><p>„KI soll mir helfen, besser zu lernen und zu arbeiten – nicht das Denken und Lernen für mich übernehmen.“<\/p><\/div><h2>Deine persönliche Regel<\/h2><p>Vervollständige den Satz: <strong>Bevor ich KI nutze, frage ich mich …<\/strong><\/p><textarea id=\"reflection\" placeholder=\"Zum Beispiel: Kann ich es selbst lösen? Lerne ich dabei noch etwas? Darf ich das Ergebnis als meine Arbeit abgeben?\"><\/textarea><div class=\"controls\"><button class=\"btn\" id=\"copy\">Meine Regel kopieren<\/button><button class=\"btn secondary\" id=\"again\">Alle Situationen erneut spielen<\/button><\/div><p class=\"small\" id=\"copyStatus\" aria-live=\"polite\"><\/p><\/section><footer>Hinweis: Umweltwerte sind illustrative Rechenannahmen, keine gesicherten Durchschnittswerte. Die Situationen sind bewusst vereinfacht. Je nach Aufgabe, Datenschutz und Schulregeln kann eine andere Entscheidung ebenfalls begründet sein.<\/footer><\/main><script>\nconst items=[\n{t:'Du möchtest wissen, wie viel 7 × 8 ist. Du hast das Einmaleins bereits gelernt.',a:0,e:'Hier brauchst du keine KI. Kopfrechnen geht schnell, verbraucht keine zusätzliche Rechenzentrumsleistung und trainiert dein Wissen.'},\n{t:'Du möchtest wissen, wie das Wetter gerade draußen ist, und kannst aus dem Fenster schauen.',a:0,e:'Ein Blick aus dem Fenster genügt. Für eine einfache Beobachtung brauchst du kein KI-System.'},\n{t:'Du willst herausfinden, wie spät es ist. Die Uhr hängt direkt vor dir.',a:0,e:'Die Uhr liefert die Antwort sofort. KI wäre ein unnötiger Umweg.'},\n{t:'Du möchtest die Bedeutung eines einzelnen Wortes nachschlagen und hast ein Wörterbuch zur Hand.',a:0,e:'Ein Wörterbuch reicht völlig aus. Du kannst die Bedeutung direkt nachschlagen.'},\n{t:'Du willst ausrechnen, wie viel Wechselgeld du für einen Einkauf bekommst. Du kannst die Beträge einfach abziehen.',a:0,e:'Selbst rechnen oder ein einfacher Taschenrechner sind hier naheliegender als generative KI.'},\n{t:'Du verstehst einen schwierigen Sachtext nicht und möchtest dir die wichtigsten Begriffe in einfacher Sprache erklären lassen.',a:1,e:'KI kann einen Text verständlicher erklären. Prüfe die Aussagen am Original und frage bei Unklarheiten nach.'},\n{t:'Du übst für eine Englisch-Arbeit und möchtest zusätzliche Vokabel-Fragen, die zu deinem Lernstand passen.',a:1,e:'KI kann passende Übungsfragen erstellen und dir Rückmeldung geben. Lernen und Antworten übernimmst du selbst.'},\n{t:'Du möchtest verschiedene Ideen sammeln, wie eure Klasse beim Schulfest Müll vermeiden kann.',a:1,e:'Beim Brainstorming kann KI neue Anregungen liefern. Entscheiden und umsetzen muss eure Klasse selbst.'},\n{t:'Du hast eine eigene Geschichte geschrieben und möchtest Hinweise, wie du sie spannender gestalten kannst.',a:1,e:'Feedback zu deinem eigenen Text kann helfen. Du entscheidest selbst, welche Vorschläge du übernimmst.'},\n{t:'Du möchtest dir einen komplizierten biologischen Vorgang schrittweise erklären und danach mit eigenen Worten wiedergeben.',a:1,e:'Eine schrittweise Erklärung kann beim Verstehen helfen. Wichtig ist, dass du sie kritisch prüfst und den Vorgang selbst erklären kannst.'},\n{t:'Du sollst einen Aufsatz als Hausaufgabe schreiben. KI könnte den fertigen Text in Sekunden für dich verfassen.',a:2,e:'Das spart Zeit, aber du übst das Schreiben nicht. Einen KI-Text darfst du nicht als eigene Leistung ausgeben. Besser: selbst schreiben und KI höchstens für erlaubtes Feedback nutzen.'},\n{t:'Du sollst ein Referat vorbereiten. KI bietet dir an, alle Folien und den Vortrag komplett zu übernehmen.',a:2,e:'Das wäre bequem, aber du musst die Inhalte verstehen, Quellen prüfen und deine eigene Leistung erbringen. Nutze KI lieber für eine Gliederung oder Verständnisfragen, sofern erlaubt.'},\n{t:'Du sollst Matheaufgaben selbst lösen. KI könnte dir einfach alle fertigen Ergebnisse und Rechenwege geben.',a:2,e:'Du wärst schneller fertig, hättest aber kaum geübt. Sinnvoller: erst selbst rechnen und KI bei Bedarf um einen Hinweis statt der vollständigen Lösung bitten.'}\n];\nconst labels=['🚫 Überflüssig','💡 Wirklich hilfreich','⚖️ Erst nachdenken!'];\n// Abwechslungsreiche feste Reihenfolge: einfach, hilfreich, kritisch, hilfreich usw.\nconst order=[0,5,10,1,6,11,2,7,12,3,8,4,9];\nconst situations=order.map(i=>items[i]);\nlet index=0,correct=0,answered=false,decided=false,avoided=0,used=0;\nconst $=id=>document.getElementById(id);\nconst fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});\nfunction updateEco(){ $('ecoLive').textContent=`${avoided} vermiedene KI-Anfrage${avoided===1?'':'n'} · ca. ${fmt(avoided*0.3)} ml Wasser · ca. ${fmt(avoided*0.3)} Wh Strom`; }\nfunction show(){answered=false;decided=false;const item=situations[index];$('progressText').textContent=`Situation ${index+1} von ${situations.length}`;$('bar').style.width=`${index/situations.length*100}%`;$('situation').textContent=item.t;$('choices').innerHTML='';labels.forEach((label,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>answer(i);$('choices').appendChild(b)});$('feedback').classList.add('hidden');$('decision').classList.add('hidden');$('decisionFeedback').textContent='';$('avoid').disabled=false;$('use').disabled=false;$('next').disabled=true;$('next').textContent=index===situations.length-1?'Ergebnis ansehen →':'Nächste Situation →';updateEco()}\nfunction answer(choice){if(answered)return;answered=true;const item=situations[index];if(choice===item.a)correct++;[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('feedback').innerHTML=`<strong>${choice===item.a?'✓ Gut eingeschätzt!':'↪ Eine andere Einschätzung passt hier besser.'}<\/strong><p>${item.e}<\/p>`;$('feedback').classList.remove('hidden');$('decision').classList.remove('hidden')}\nfunction decide(avoid){if(!answered||decided)return;decided=true;if(avoid){avoided++;$('decisionFeedback').textContent='🌱 Gut überlegt! Du hast dich bewusst gegen eine zusätzliche KI-Anfrage entschieden – auch wenn KI hier helfen könnte. Im Rechenmodell sparst du 0,3 ml Wasser und 0,3 Wh Strom.';}else{used++;$('decisionFeedback').textContent=situations[index].a===0?'🤔 Überlege noch einmal: Hier wäre eine einfache Lösung ohne KI möglich gewesen.':'👍 Eine bewusste Entscheidung! Nutze KI gezielt, prüfe die Ergebnisse und übernimm das Denken selbst.';}$('avoid').disabled=true;$('use').disabled=true;$('next').disabled=false;updateEco()}\nfunction end(){ $('game').classList.add('hidden');$('end').classList.remove('hidden');$('bar').style.width='100%';$('score').textContent=`Du hast ${correct} von 13 Situationen passend eingeordnet. Du hast dich ${avoided}-mal gegen und ${used}-mal für KI entschieden. Wichtig ist vor allem, dass du deine Entscheidungen begründen kannst.`;$('ecoFinal').textContent=`Du hast ${avoided} zusätzliche Textanfragen vermieden. Das entspricht im vereinfachten Modell ungefähr ${fmt(avoided*0.3)} ml Wasser und ${fmt(avoided*0.3)} Wh Strom. Auch der Verzicht auf eine grundsätzlich hilfreiche KI-Anwendung zählt!`;window.scrollTo({top:0,behavior:'smooth'})}\nfunction reset(){index=0;correct=0;avoided=0;used=0;$('end').classList.add('hidden');$('game').classList.remove('hidden');show();window.scrollTo({top:0,behavior:'smooth'})}\n$('avoid').onclick=()=>decide(true);$('use').onclick=()=>decide(false);\n$('next').onclick=()=>{if(!decided)return;if(++index===situations.length)end();else show()};$('restart').onclick=reset;$('again').onclick=reset;$('copy').onclick=async()=>{const value=$('reflection').value.trim();if(!value){$('copyStatus').textContent='Schreibe zuerst deine Regel auf.';return}try{await navigator.clipboard.writeText('Bevor ich KI nutze, frage ich mich: '+value);$('copyStatus').textContent='Deine Regel wurde kopiert.'}catch(e){$('reflection').select();$('copyStatus').textContent='Markiere und kopiere deinen Text mit Strg+C.'}};show();\n<\/script><div style=\"max-width:960px;margin:15px auto 45px;padding:15px 20px;background:#fff;border:1px solid #cce5e4;border-radius:16px;font:700 16px system-ui,sans-serif;display:flex;gap:12px;flex-wrap:wrap\"><a style=\"color:#087f83\" href=\"#\" onclick=\"parent.postMessage('go4','*');return false\">← Vorherige Station<\/a><a style=\"color:#087f83;margin-left:auto\" href=\"#\" onclick=\"parent.postMessage('go4','*');return false\">Zur Startseite ↗<\/a><\/div><\/body><\/html>"
};
function show(n){document.getElementById('intro').style.display=n==='home'?'block':'none';const frame=document.getElementById('content');frame.style.display=n==='home'?'none':'block';if(n!=='home')frame.srcdoc=pages[n];for(const x of ['home','1','2','3','4','5'])document.getElementById(x==='home'?'home':'b'+x).classList.toggle('active',x===n);history.replaceState(null,'',n==='home'?'#start':'#station'+n);window.scrollTo(0,0)}
window.addEventListener('message',e=>{if(e.source!==document.getElementById('content').contentWindow)return;if(/^go[12345]$/.test(e.data))show(e.data.slice(-1));else if(e.data==='home')show('home')});
const match=location.hash.match(/^#station([12345])$/);if(match)show(match[1]);else show('home');
</script></body></html>
